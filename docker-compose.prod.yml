name: histoires-de-chimeres-prod

# Serveur à Caddy « edge » mutualisé (même principe qu'Agilometre) : l'app rejoint le réseau
# externe edge_net sous un alias unique, la base reste sur un réseau interne, aucun port publié.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - chimeres_db_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    restart: unless-stopped

  app:
    image: ghcr.io/arnaudbracchetti/histoires-de-chimeres-app:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      edge_net:
        aliases:
          - chimeres-app
      chimeres_db_net: {}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    restart: unless-stopped

networks:
  edge_net:
    external: true
  chimeres_db_net:
    driver: bridge
    internal: true

volumes:
  db_data:
