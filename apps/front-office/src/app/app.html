<!-- Motif gravé en filigrane, derrière chaque écran (docs/design/identite.md) : décoratif. -->
<svg class="watermark" aria-hidden="true" focusable="false" viewBox="-100 -100 200 200">
  <use href="illustration.svg#engraving" x="-100" y="-100" width="200" height="200" />
</svg>
<main>
  @if (ended()) {
    <app-convention-ended-page />
  } @else if (frontOffice.error()) {
    <p>Impossible de charger la convention.</p>
  } @else if (!frontOffice.hasValue()) {
    <p>Chargement…</p>
  } @else if (!presenceCode()) {
    <app-presence-code-page (ended)="endedOnEntry.set(true)" />
  } @else {
    <h1>Bienvenue à {{ frontOffice.value().conventionName }}</h1>
  }
</main>
