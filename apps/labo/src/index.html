<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Labo Chimères</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151717" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link id="manifeste" rel="manifest" href="manifest.webmanifest" />
    <script>
      // PROTOTYPE (#59). Lu avant Angular : l'URL exacte de cette ouverture, et la variante
      // du manifeste (`?manifeste=b` : sans start_url) avant un éventuel ajout à l'écran d'accueil.
      window.laboBoot = { href: location.href, referrer: document.referrer, at: Date.now() };
      if (new URLSearchParams(location.search).get('manifeste') === 'b') {
        document.getElementById('manifeste').href = 'manifest-b.webmanifest';
      }
      // `beforeinstallprompt` peut partir avant le démarrage d'Angular : gardé ici pour le bouton « Installer ».
      window.laboInstall = { event: null, firedAt: null };
      addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.laboInstall = { event, firedAt: Date.now() };
        dispatchEvent(new Event('labo-installable'));
      });
    </script>
  </head>
  <body>
    <labo-root></labo-root>
  </body>
</html>
