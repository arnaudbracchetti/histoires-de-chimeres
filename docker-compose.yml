# Développement. `pnpm dev:db` ne lance que postgres ;
# `docker compose up --build app` construit et lance l'image de production en local.
# `app-e2e` est la même image, sur la base chimeres_e2e : Playwright la démarre (`pnpm test:e2e`).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chimeres
      POSTGRES_PASSWORD: chimeres
      POSTGRES_DB: chimeres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 5435 : Agilometre occupe déjà 5433 et 5434 sur ce poste.
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chimeres']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chimeres:chimeres@postgres:5432/chimeres?schema=public
    ports:
      - '8080:3000'

  app-e2e:
    profiles: [e2e]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Créée par `prisma migrate deploy` au démarrage du conteneur si elle manque.
      DATABASE_URL: postgresql://chimeres:chimeres@postgres:5432/chimeres_e2e?schema=public
      # Paire de test, sans valeur ailleurs : avec elle, le front office propose les notifications.
      VAPID_PUBLIC_KEY: BMXbLlbTNw9LkgEydftW4ItQAwBr29-km3dwRNyGCMn7n1lVj_1_POgKxC3QQlX70s8CVN7C5eqGhe-j0ke7riY
      VAPID_PRIVATE_KEY: uNAJwgUkFvwCdgTS7SegYNhM5FD5P5ks4rggyO7mOvk
      VAPID_SUBJECT: mailto:e2e@example.org
      # L'adresse que les notifications ouvrent.
      PUBLIC_URL: http://localhost:8081
    ports:
      - '8081:3000'

volumes:
  postgres-data:
