# Vérification de chaque push de main, de chaque PR et de chaque tag de version (#196).
# Sur un tag vX.Y.Z de main seulement, publication de l'image sur ghcr (#197).
# Base : docs/research/ci-github-actions.md.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chimeres
          POSTGRES_PASSWORD: chimeres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chimeres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://chimeres:chimeres@localhost:5432/chimeres_test?schema=public
      TEST_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      # Sans `version` : l'action lit `packageManager` et échouerait si les deux différaient.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm check:migrations
      # Le lint (type-aware) et les tests lisent les packages par leur dist/ et le client Prisma généré.
      - run: pnpm build:packages
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter api test:e2e

  # L'image ne porte que sa version : pas de `latest`, pas de GitHub Release.
  image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # Tout l'historique : l'ancêtre de origin/main se vérifie sur le graphe complet.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Le tag est sur main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME n'est pas sur main : aucune image publiée."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/arnaudbracchetti/histoires-de-chimeres-app:${{ github.ref_name }}
          build-args: APP_VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
