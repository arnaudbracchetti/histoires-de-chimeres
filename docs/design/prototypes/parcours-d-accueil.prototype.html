<!doctype html>
<html lang="fr">
<!--
  PROTOTYPE JETABLE : ne pas reprendre ce code en production.
  Question : dans quel ordre, et avec quels écrans, se fait le premier usage sur le téléphone ?
  Scan du QR code (code de présence), pseudo et ses confirmations (pseudo existant, pseudo d'un MJ),
  repli quand le code manque, ajout à l'écran d'accueil sur iPhone (où l'on retape son pseudo),
  notifications, « Changer de pseudo », « La convention est terminée ».
  Ticket « Parcours d'accueil : QR code, pseudo, installation, notifications » (#50).

  Trois variantes, basculables par ?variant=A|B|C et par les flèches ← → du clavier :
    A « Tout d'un trait »    : pseudo, puis chaque étape à la suite (installation sur iPhone, notifications).
    B « Installer d'abord »  : sur iPhone, Safari ne sert qu'à installer ; le pseudo se tape une seule fois, dans l'application.
    C « Accueil d'abord »    : pseudo, puis l'Accueil ; une carte « Pour connaître ta table » et le bandeau mènent aux étapes.
  Retenue : B, avec l'insistance sur les notifications, la confirmation « Continuer sans notifications ? »,
  l'installation sur Android et le passage de Chrome à l'application. A et C n'ont pas reçu ces retouches.

  ?phone=iphone|android|ancien (iOS 16.3 ou moins, sans notifications). ?fin=1 : la convention est terminée.
  Le téléphone est simulé : écran d'accueil, appareil photo, Safari ou Chrome, dialogues du système.
  Hypothèses iPhone, sur le pire cas (à confirmer par le test sur iPhone, #60) : la web app a son propre stockage,
  ne reçoit pas le code du QR code, et n'a pas de geste de retour.
  Rien n'est enregistré : tout vit en mémoire.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours d'accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Aldrich&display=swap">
<style>
/* Jetons repris de packages/design/tokens.css. Échelle typographique du mobile : provisoire, pour le prototype. */
:root {
  color-scheme: dark;
  --surface-0: #151717; --surface-1: #1b1e1e; --surface-2: #222525; --surface-3: #2a2d2d;
  --border: #313535; --text: #eceae6; --text-muted: #a9a49e;
  --accent: #fc9203; --on-accent: #161818; --focus: #7cc4e4;
  --success: #6cc08b; --warning: #e8d25c; --danger: #f07f63;
  --engraving: #3a3e3e; --engraving-strong: #626767; --initial: #8c837c;
  --emblem-1: #4e4944; --emblem-2: #5e5852; --emblem-3: #6e6862;
  --emblem-4: #7d766f; --emblem-5: #8c837c; --emblem-6: #a39a92;
  --font-display: 'Uncial Antiqua', serif;
  --font-caps: 'Aldrich', sans-serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-hero: 2rem; --fs-title: 1.625rem; --fs-section: 1.25rem; --fs-block: 1.0625rem;
  --fs-body: .9375rem; --fs-meta: .8125rem; --fs-over: .6875rem;
  --space-xxs: 2px; --space-xs: 4px; --space-s: 8px; --space-m: 12px;
  --space-l: 16px; --space-xl: 24px; --space-xxl: 32px;
  --radius-card: 12px; --radius-control: 8px; --radius-thumb: 6px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0b0c0c; color: var(--text); font: 400 var(--fs-body)/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
svg.i { width: 20px; height: 20px; flex: none; }
.over { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .12em; font-size: var(--fs-over); color: var(--text-muted); }
.meta { color: var(--text-muted); font-size: var(--fs-meta); }
.stack { display: grid; gap: var(--space-s); }
.stack-l { display: grid; gap: var(--space-l); }
.pad { padding: var(--space-l); }

/* ---------- Scène : téléphone sur ordinateur, plein écran sur téléphone ---------- */
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 16px 16px 96px; }
.notes { width: 340px; flex: none; color: #c9c4be; font: 13px/1.55 system-ui, sans-serif; display: none; max-height: calc(100vh - 120px); overflow-y: auto; }
.notes h2 { font: 600 15px/1.3 system-ui, sans-serif; color: #f1efec; margin: 0 0 6px; }
.notes h3 { font: 600 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #8f8a85; margin: 18px 0 6px; }
.notes p { margin: 0 0 8px; }
.notes dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.notes dt { color: #8f8a85; }
.notes dd { margin: 0; color: #f1efec; }
.notes .changed { color: #fc9203; }
.notes code { color: #f1efec; }
@media (min-width: 1000px) { .notes { display: block; } }
.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 120px)); min-height: 640px; border-radius: 46px; overflow: hidden; background: var(--surface-0); display: flex; flex-direction: column; box-shadow: 0 0 0 10px #1c1d1d, 0 0 0 11px #333; }
.statusbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font: 600 15px system-ui, sans-serif; background: var(--surface-1); }
.statusbar.on-home { background: transparent; position: absolute; inset: 0 0 auto; z-index: 5; }
.statusbar .sb-right { font-size: 12px; letter-spacing: .04em; }
.app { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
@media (max-width: 520px) {
  .stage { padding: 0; }
  .phone { width: 100vw; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; border-radius: 0; box-shadow: none; }
}

/* ---------- Système simulé : hors du design évalué ---------- */
.home { flex: 1; position: relative; padding: 70px 22px 20px; background: radial-gradient(120% 80% at 30% 10%, #3b4a63, #1d2433 55%, #10131a); display: grid; grid-template-columns: repeat(4, 1fr); align-content: start; gap: 22px 10px; font-family: -apple-system, system-ui, sans-serif; }
.app-icon { display: grid; justify-items: center; gap: 6px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.app-icon .ic { width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center; background: #5a6170; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.app-icon .ic svg { width: 30px; height: 30px; color: #fff; }
.app-icon .ic.chim { background: #151717; }
.app-icon .ic.chim svg { width: 50px; height: 50px; }
.app-icon.new .ic { box-shadow: 0 0 0 3px #fc9203, 0 2px 6px rgba(0,0,0,.35); }
.app-icon[disabled] { cursor: default; opacity: .85; }
.home-hint { grid-column: 1 / -1; margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,.35); color: #e8ecf3; font-size: 12px; line-height: 1.4; }
.ios-indicator { flex: none; height: 26px; display: grid; place-items: center; background: inherit; }
.ios-indicator button { width: 134px; height: 18px; display: grid; place-items: center; }
.ios-indicator button::before { content: ''; width: 134px; height: 5px; border-radius: 3px; background: #e9e9e9; }
.android-nav { flex: none; height: 44px; display: grid; grid-template-columns: repeat(3, 1fr); background: #000; color: #e8e8e8; font: 18px system-ui, sans-serif; }
.android-nav button { display: grid; place-items: center; }
.safari-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; background: #1c1c1e; font-family: -apple-system, system-ui, sans-serif; }
.safari-bar .url { flex: 1; height: 40px; border-radius: 20px; background: #2c2c2e; display: grid; place-items: center; font-size: 15px; color: #f2f2f7; }
.safari-bar button { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: #0a84ff; background: #2c2c2e; }
.chrome-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: #202124; font-family: Roboto, system-ui, sans-serif; }
.chrome-bar .url { flex: 1; height: 36px; border-radius: 18px; background: #303134; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; color: #e8eaed; }
.chrome-bar button { width: 40px; height: 40px; display: grid; place-items: center; color: #e8eaed; }
.sys-scrim { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.45); }
.ios-alert { position: absolute; z-index: 61; left: 50%; top: 50%; translate: -50% -50%; width: 270px; border-radius: 14px; background: rgba(44,44,46,.97); text-align: center; font-family: -apple-system, system-ui, sans-serif; color: #fff; overflow: hidden; }
.ios-alert .t { padding: 18px 16px 4px; font-weight: 600; font-size: 16px; }
.ios-alert .d { padding: 0 16px 18px; font-size: 13px; color: #d1d1d6; }
.ios-alert .bs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #48484a; }
.ios-alert .bs button { padding: 12px; color: #0a84ff; font-size: 16px; text-align: center; }
.ios-alert .bs button + button { border-left: 1px solid #48484a; font-weight: 600; }
.ios-sheet { position: absolute; z-index: 61; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; border-radius: 14px 14px 0 0; background: #1c1c1e; color: #fff; font-family: -apple-system, system-ui, sans-serif; padding: 14px 14px 30px; display: grid; gap: 12px; }
.ios-sheet .head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #38383a; }
.ios-sheet .head .ic { width: 44px; height: 44px; border-radius: 10px; background: #151717; display: grid; place-items: center; }
.ios-sheet .head .ic svg { width: 36px; height: 36px; }
.ios-group { border-radius: 10px; background: #2c2c2e; overflow: hidden; }
.ios-group button, .ios-group div.r { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 12px 14px; font-size: 16px; color: #fff; }
.ios-group > * + * { border-top: 1px solid #3a3a3c; }
.ios-group svg { width: 20px; height: 20px; color: #f2f2f7; }
.ios-nav { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
.ios-nav button { color: #0a84ff; }
.ios-nav strong { font-weight: 600; }
.ios-toggle { width: 50px; height: 30px; border-radius: 15px; background: #30d158; position: relative; }
.ios-toggle::after { content: ''; position: absolute; right: 2px; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; }
.ios-menu { position: absolute; z-index: 61; right: 12px; bottom: 86px; width: 240px; border-radius: 14px; background: rgba(44,44,46,.98); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
.ios-menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 16px; color: #fff; }
.ios-menu button + button { border-top: 1px solid #3a3a3c; }
.ios-menu svg { width: 20px; height: 20px; }
.md-dialog { position: absolute; z-index: 61; left: 24px; right: 24px; top: 50%; translate: 0 -50%; border-radius: 28px; background: #2b2930; color: #e6e0e9; font-family: Roboto, system-ui, sans-serif; padding: 24px; display: grid; gap: 16px; }
.md-dialog .ttl { font-size: 20px; text-align: center; }
.md-dialog .ico { justify-self: center; color: #d0bcff; }
.md-dialog .ico svg { width: 26px; height: 26px; }
.md-dialog .bs { display: flex; justify-content: flex-end; gap: 8px; }
.md-dialog .bs.col { flex-direction: column; }
.md-dialog .bs button { padding: 10px 14px; border-radius: 20px; color: #d0bcff; font-weight: 500; }
.md-dialog .bs.col button { background: #4a4458; color: #e8def8; text-align: center; }
.md-dialog .app { flex: none; display: flex; flex-direction: row; align-items: center; gap: 12px; }
.md-dialog .app .ic { width: 44px; height: 44px; border-radius: 12px; background: #151717; display: grid; place-items: center; }
.md-dialog .app .ic svg { width: 36px; height: 36px; }
.md-menu { position: absolute; z-index: 61; right: 6px; top: 96px; width: 250px; border-radius: 6px; background: #2d2e31; color: #e8eaed; font-family: Roboto, system-ui, sans-serif; padding: 8px 0; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.md-menu button { display: block; width: 100%; padding: 12px 18px; font-size: 15px; }
.sys-toast { position: absolute; z-index: 62; left: 16px; right: 16px; bottom: 60px; padding: 12px 16px; border-radius: 10px; background: #e8eaed; color: #202124; font: 14px Roboto, system-ui, sans-serif; }

/* ---------- Application : éléments communs ---------- */
.hdr { flex: none; display: flex; align-items: center; gap: var(--space-s); padding: var(--space-xs) var(--space-s) var(--space-xs) var(--space-l); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--space-s); min-width: 0; flex: 1; }
.emblem { width: 28px; height: 28px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pseudo { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border); font-weight: 600; font-size: var(--fs-meta); flex: none; max-width: 150px; }
.pseudo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pseudo svg { width: 18px; height: 18px; color: var(--text-muted); }
.pseudo[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; flex: none; }
.icon-btn:hover { background: var(--surface-3); }
.bandeau { flex: none; display: flex; gap: var(--space-s); align-items: flex-start; width: 100%; min-height: 44px; padding: var(--space-s) var(--space-l); background: color-mix(in srgb, var(--warning) 14%, var(--surface-1)); border-bottom: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; text-align: left; }
.bandeau svg { width: 18px; height: 18px; color: var(--warning); margin-top: 1px; }
.bandeau .chev { margin-left: auto; color: var(--text-muted); }
.tabbar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-1); border-top: 1px solid var(--border); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: var(--text-muted); font-size: .75rem; font-weight: 600; text-align: center; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--radius-control); font-weight: 600; font-size: var(--fs-body); border: 1px solid transparent; text-align: center; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface-3); border-color: var(--border); }
.btn-ghost { color: var(--accent); padding: 0 var(--space-s); }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--text-muted); }
.badge svg { width: 14px; height: 14px; }
.t-ok { color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface-2)); }
.t-accent { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-card); }
.section-title { font-size: var(--fs-section); font-weight: 600; }
.row { position: relative; display: flex; gap: var(--space-m); align-items: center; padding: var(--space-m) var(--space-l); border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.status { display: flex; gap: var(--space-s); align-items: flex-start; }
.status svg { width: 18px; height: 18px; margin-top: 1px; }
.tone-ok { color: var(--success); } .tone-accent { color: var(--accent); } .tone-muted { color: var(--text-muted); } .tone-warn { color: var(--warning); } .tone-danger { color: var(--danger); }
.hero { position: relative; overflow: hidden; display: grid; gap: var(--space-s); padding: var(--space-l); }
.hero .eng-bg { position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; pointer-events: none; }
.hero > * { position: relative; }
.hero-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }

/* ---------- Écrans du parcours ---------- */
.ob { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--surface-0); }
.ob-top { flex: none; display: flex; align-items: center; gap: var(--space-s); min-height: 56px; padding: var(--space-xs) var(--space-s); }
.ob-top .brand { padding-left: var(--space-s); }
.ob-body { display: grid; gap: var(--space-l); padding: var(--space-s) var(--space-xl) var(--space-xl); }
.ob-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.ob-actions { flex: none; display: grid; gap: var(--space-s); padding: var(--space-m) var(--space-xl) var(--space-l); }
.field { display: grid; gap: var(--space-xs); }
.field label { font-weight: 600; font-size: var(--fs-meta); }
.field input { font: 400 17px/1.3 var(--font-ui); color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-control); min-height: 52px; padding: 0 var(--space-m); width: 100%; }
.field input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.field input.code { font-family: var(--font-caps); font-size: 24px; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.field .err { display: flex; gap: var(--space-xs); color: var(--danger); font-size: var(--fs-meta); font-weight: 600; }
.field .err svg { width: 16px; height: 16px; margin-top: 1px; }
.field input[aria-invalid="true"] { border-color: var(--danger); }
.big-pseudo { font-family: var(--font-display); font-size: var(--fs-hero); line-height: 1.1; color: var(--accent); word-break: break-word; }
.steps { display: grid; gap: var(--space-m); counter-reset: step; }
.steps li { display: grid; grid-template-columns: 32px 1fr; gap: var(--space-m); align-items: start; counter-increment: step; }
.steps li::before { content: counter(step); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--border); font-weight: 700; color: var(--accent); }
.steps li > div { padding-top: 5px; }
.kbd { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; background: var(--surface-3); border: 1px solid var(--border); font-weight: 600; white-space: nowrap; vertical-align: 1px; }
.kbd svg { width: 15px; height: 15px; }
.recap { display: grid; gap: var(--space-xs); padding: var(--space-m) var(--space-l); border-radius: var(--radius-control); background: var(--surface-2); border: 1px dashed var(--engraving-strong); }
.recap dl { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-m); margin: 0; align-items: baseline; }
.recap dt { color: var(--text-muted); font-size: var(--fs-meta); }
.recap dd { margin: 0; font-weight: 700; }
.recap dd.code { font-family: var(--font-caps); letter-spacing: .2em; font-size: 1.25rem; color: var(--accent); }
.notif-mock { display: grid; grid-template-columns: 36px 1fr; gap: var(--space-s) var(--space-m); padding: var(--space-m); border-radius: 16px; background: #2c2c2e; font-family: -apple-system, system-ui, sans-serif; }
.notif-mock .ic { width: 36px; height: 36px; border-radius: 8px; background: #151717; display: grid; place-items: center; }
.notif-mock .ic svg { width: 30px; height: 30px; }
.notif-mock strong { display: block; font-size: 14px; }
.notif-mock span { font-size: 13px; color: #d1d1d6; }
.closed { position: relative; flex: 1; display: grid; align-content: center; justify-items: center; gap: var(--space-l); padding: var(--space-xxl) var(--space-xl); text-align: center; overflow: hidden; }
.closed > * { position: relative; }
.closed .eng-closed { position: absolute; width: 520px; height: 520px; top: 50%; left: 50%; translate: -50% -50%; }
.emblem-big { width: 96px; height: 96px; }
.closed-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); }
.why { display: grid; gap: var(--space-s); padding: var(--space-m) var(--space-l); border-radius: var(--radius-control); background: var(--surface-2); border-left: 4px solid var(--accent); }
.why strong { font-weight: 700; }
.slot-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; min-height: 44px; padding: var(--space-s) var(--space-l); background: var(--surface-1); border-bottom: 1px solid var(--border); }
.slot-head .over { color: var(--text); }
.settings { flex: 1; overflow-y: auto; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; padding: 8px 16px 24px; display: grid; align-content: start; gap: 16px; }
.settings.md { background: #141218; font-family: Roboto, system-ui, sans-serif; }
.settings .crumbs { display: flex; align-items: center; gap: 6px; color: #0a84ff; font-size: 16px; min-height: 44px; }
.settings.md .crumbs { color: #d0bcff; }
.settings h1 { font-size: 30px; font-weight: 700; }
.settings .note { font-size: 13px; color: #98989d; padding: 0 4px; }
.settings .ios-group { background: #1c1c1e; }
.settings.md .ios-group { background: #2b2930; border-radius: 20px; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: #39393d; position: relative; flex: none; }
.sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left 120ms; }
.sw[aria-checked="true"] { background: #30d158; }
.sw[aria-checked="true"]::after { left: 22px; }
.md .sw[aria-checked="true"] { background: #d0bcff; }
.activate { display: grid; gap: var(--space-m); padding: var(--space-l); border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
.activate-item { display: grid; grid-template-columns: 28px 1fr; gap: var(--space-s); align-items: start; }
.activate-item .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); font-weight: 700; font-size: var(--fs-meta); color: var(--accent); }
.activate-item .n.done { background: color-mix(in srgb, var(--success) 20%, var(--surface-3)); color: var(--success); }
.activate-item .btn { justify-self: start; min-height: 40px; margin-top: var(--space-xs); }

/* Superpositions de l'application */
.scrim { position: absolute; inset: 0; z-index: 29; background: color-mix(in srgb, var(--surface-0) 72%, transparent); }
.menu { --menu-edge: color-mix(in srgb, var(--accent) 60%, var(--border)); position: absolute; z-index: 30; top: 62px; right: var(--space-s); width: 264px; padding: var(--space-l); display: grid; gap: var(--space-s); background: var(--surface-3); border: 1px solid var(--menu-edge); border-radius: var(--radius-card); }
.menu::before { content: ''; position: absolute; top: -7px; right: 52px; width: 12px; height: 12px; background: var(--surface-3); border-left: 1px solid var(--menu-edge); border-top: 1px solid var(--menu-edge); rotate: 45deg; }
.menu .btn-secondary { background: var(--surface-2); }
.dialog { position: absolute; z-index: 30; left: var(--space-l); right: var(--space-l); top: 50%; translate: 0 -50%; padding: var(--space-xl) var(--space-l) var(--space-l); display: grid; gap: var(--space-m); background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-card); }
.dialog h2 { font-size: var(--fs-section); font-weight: 600; }
.sheet { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column; background: var(--surface-1); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; }
.sheet .ob-body { padding-top: var(--space-l); }
.toast { position: absolute; z-index: 40; left: var(--space-l); right: var(--space-l); bottom: 84px; padding: var(--space-m) var(--space-l); background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-control); font-size: var(--fs-meta); }
.toast strong { display: block; color: var(--text); font-size: var(--fs-body); }

}

    stores: { browser: { code: null, pseudo: null }, app: { code: null, pseudo: null } },
    perm: { browser: 'default', app: 'default' },
    nav: { browser: [], app: [] },
    tabs: { browser: 'accueil', app: 'accueil' },
    from: 'home',           // d'où l'on vient quand on ouvre les réglages du téléphone
    overlay: null,          // de l'application : menu, change, guide, skip ; du système : perm, ios-menu, share, addhome, md-menu, install, site
    input: '', error: '',
    pending: null,          // pseudo saisi, en attente de confirmation
    toast: null, sysToast: null,
    server: SERVER0(),
    last: null,
  });
}
reset();

const ios = () => S.device !== 'android';
// iPhone ancien : iOS 16.3 ou moins, sans push, même dans l'application installée.
const old = () => S.device === 'ancien';
// Sur Android, la PWA partage le stockage et la permission de Chrome ; sur iPhone, la web app a les siens.
const key = (w = S.where) => (ios() ? w : 'browser');
const store = (w) => S.stores[key(w)];
const perm = (w) => S.perm[key(w)];
const pushSupported = (w = S.where) => !old() && !(ios() && w === 'browser');
const needsInstall = (w = S.where) => ios() && !old() && w === 'browser';
const nav = () => S.nav[S.where];
const screen = () => nav()[nav().length - 1];
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
const findPseudo = (s) => S.server.find((p) => norm(p.name) === norm(s));
const me = () => findPseudo(store().pseudo ?? '');
const browserName = () => (ios() ? 'Safari' : 'Chrome');

// Cas du bandeau de NO-6 (null : le téléphone reçoit les notifications).
function bandeauCase(w = S.where) {
  if (old()) return 'non-pris';
  if (needsInstall(w)) return 'ecran';
  if (perm(w) === 'granted') return null;
  return perm(w) === 'denied' ? 'refusee' : 'permission';
}
const BANDEAU = {
  ecran: "Ajoute l'application à l'écran d'accueil pour connaître ta table",
  permission: 'Active les notifications pour connaître ta table',
  refusee: 'Notifications bloquées : réactive-les dans les réglages pour connaître ta table',
  'non-pris': 'Ce téléphone ne reçoit pas les notifications : reviens voir ta table ici après chaque tirage',
};

/* ================= Enchaînement des écrans ================= */
// Premier écran quand on ouvre l'application dans un contexte.
function boot() {
  if (S.ended) return 'fin';
  const st = store();
  if (st.pseudo) return 'accueil';
  if (!st.code) return 'code';
  if (S.variant === 'B' && needsInstall()) return 'install-first';
  return 'pseudo';
}
// Après la liaison du téléphone à un pseudo. Les écrans d'identification sortent de l'historique.
function afterLink() {
  S.tabs[S.where] = 'accueil';
  if (S.variant === 'C') return 'accueil';
  if (S.variant === 'A' && needsInstall()) return 'install';
  if (pushSupported() && perm() === 'default') return 'notif';
  return afterNotif();
}
const androidInstallStep = () => S.variant !== 'C' && !ios() && !S.installed;
function afterNotif() {
  return androidInstallStep() ? 'android-install' : 'accueil';
}
function go(sc) { nav().push(sc); S.input = ''; S.error = ''; }
function replaceAll(sc) { S.nav[S.where] = [sc]; S.input = ''; S.error = ''; }
function back() {
  if (nav().length > 1) { nav().pop(); S.error = ''; S.input = screen() === 'pseudo' && S.pending ? S.pending.name : ''; S.pending = null; return true; }
  return false;
}
function link(p) {
  const st = store();
  if (!p) { p = { name: S.input.trim(), mj: false, phones: 0 }; S.server.push(p); S.last = `Pseudo « ${p.name} » créé et relié à ce téléphone.`; }
  else S.last = `Téléphone relié à « ${p.name} »${p.mj ? ' (MJ)' : ''}.`;
  p.phones++;
  st.pseudo = p.name;
  S.pending = null;
  replaceAll(afterLink());
}

/* ================= Morceaux communs ================= */
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const kbd = (ic, label = '') => `<span class="kbd">${ic ? icon(ic) : ''}${label}</span>`;
const emblem = (cls = 'emblem', id = 'emblem-small') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const engraving = (cls) => `<svg class="${cls}" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#engraving" x="-100" y="-100" width="200" height="200"/></svg>`;
const brand = () => `<div class="brand">${emblem()}<span class="brand-name">Histoires de Chimères</span></div>`;
const backBtn = (act = 'back', label = 'Retour') => `<button class="icon-btn" data-act="${act}" aria-label="${label}">${icon('chevron-left')}</button>`;

function ob({ top = '', body, actions = '' }) {

}
function field({ label, code = false, hint = '' }) {
  const err = S.error ? `<p class="err" id="f-err">${icon('triangle-alert')}<span>${S.error}</span></p>` : '';

    ${hint ? `<p class="meta">${hint}</p>` : ''}${err}</form>`;

function recap({ pseudo = true } = {}) {

const notifMock = (mj) => `<figure class="stack" style="margin:0"><figcaption class="over">Exemple de notification</figcaption>

// Ce que les notifications apportent (NO-2), redit à chaque étape qui les concerne.

const withoutNotif = 'Sans elles, tu ne sauras ni ta table ni les changements du programme, sauf en revenant voir l\'application après chaque tirage.';

/* ---------- Coquille (variante A de la coquille, simplifiée) : le bandeau est sur chaque onglet ---------- */
const GAMES = [
  { slot: 1, table: 'Dragon', title: "Les Brumes d'Innsmouth", system: "L'Appel de Cthulhu", mj: 'Morgane' },
  { slot: 1, table: 'Griffon', title: 'Opération Nébuleuse', system: 'Alien', mj: 'Brann' },

  { slot: 2, table: 'Dragon', title: "La Tour d'ébène", system: 'Dungeons & Dragons', mj: 'Kaïros' },
  { slot: 2, table: 'Licorne', title: 'Vacances à Mälaren', system: 'Tales from the Loop', mj: 'Morgane' },
];
function bandeau() {
  const c = bandeauCase();
  if (!c) return '';
  if (c === 'non-pris') return `<div class="bandeau" role="status">${icon('triangle-alert')}<span>${BANDEAU[c]}</span></div>`;
  return `<button class="bandeau" data-act="guide">${icon('bell-off')}<span>${BANDEAU[c]}</span>${icon('chevron-right', 'i chev')}</button>`;
}
function accueil() {
  const p = me();
  const tab = S.tabs[S.where];

  if (tab === 'programme') {
    body = `<div class="stack">${[1, 2].map((n) => `<section><div class="slot-head"><span class="over">Créneau ${n} · ${SLOTS[n - 1].start}</span></div>
      ${GAMES.filter((g) => g.slot === n).map((g) => `<button class="row" data-act="out"><div class="row-main"><span style="font-weight:600">${g.title}</span><span class="meta">${g.system} · avec ${g.mj} · table ${g.table}</span></div>${icon('chevron-right', 'i tone-muted')}</button>`).join('')}</section>`).join('')}</div>`;
  } else if (tab === 'mes') {
    body = `<div class="stack">${SLOTS.map((s) => `<section><div class="slot-head"><span class="over">Créneau ${s.n} · ${s.start}</span></div>
      <div class="pad meta" style="padding-block:var(--space-m)">${lead(s.n) ? `Tu mènes ${p.leads.title}, table ${p.leads.table}.` : 'Aucune inscription sur ce créneau.'}</div></section>`).join('')}</div>`;
  } else {
    const lines = SLOTS.map((s) => {
      const l = lead(s.n)
        ? `<div class="status tone-accent">${icon('book-open')}<div><div style="font-weight:600">Tu mènes</div><div class="meta">${p.leads.title}, table ${p.leads.table}</div></div></div>`
        : `<div class="status tone-muted">${icon('plus')}<div><div style="font-weight:600">Aucune inscription</div><div class="meta">Choisir une partie</div></div></div>`;
      return `<li><button class="row" data-act="tab" data-v="programme"><div class="row-main"><span class="over">Créneau ${s.n} · ${s.start}</span>${l}</div>${icon('chevron-right', 'i tone-muted')}</button></li>`;
    }).join('');
    body = `<div class="pad stack-l">
      ${S.variant === 'C' ? activateCard() : installCard()}
      <section class="card hero">${engraving('eng-bg')}
        <span class="over">Inscriptions ouvertes</span>

  }
  const tb = (v, ic, label) => `<button class="tab" data-act="tab" data-v="${v}" ${tab === v ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`;
  return `<header class="hdr">${brand()}<button class="pseudo" data-act="menu" aria-haspopup="dialog" aria-expanded="${S.overlay === 'menu'}">${icon('user-round')}<span>${store().pseudo}</span></button></header>

}
// Android, variantes A et B : tant que l'application n'est pas installée, une carte y incite en tête de l'Accueil.
function installCard() {
  if (ios()) return '';
  if (S.installed) return S.where !== 'browser' ? '' : `<section class="card activate" style="border-color:color-mix(in srgb, var(--accent) 45%, var(--border))">
    <span class="over">Tu es dans Chrome</span>

  return `<section class="card activate" style="border-color:color-mix(in srgb, var(--accent) 45%, var(--border))">

// Variante C : ce qui manque pour connaître sa table, en tête de l'Accueil.
function activateCard() {
  const items = [];
  const done = (t) => `<div class="activate-item"><span class="n done">${icon('check')}</span><div>${t}</div></div>`;
  const todo = (n, t, btn) => `<div class="activate-item"><span class="n">${n}</span><div><div style="font-weight:600">${t}</div>${btn}</div></div>`;
  if (old()) return '';
  if (ios()) {
    if (S.where === 'browser') {
      items.push(todo(1, "Ajoute l'application à l'écran d'accueil", `<p class="meta">Sur iPhone, les notifications ne marchent que là. Tu y retaperas ton code et ton pseudo.</p><button class="btn btn-secondary" data-act="guide">Voir comment</button>`));
      items.push(todo(2, "Active les notifications, dans l'application", ''));
    } else {
      items.push(done("Application sur l'écran d'accueil"));
    }
  }
  if (pushSupported()) {
    const n = items.length + 1;
    if (perm() === 'default') items.push(todo(n, 'Active les notifications', `<button class="btn btn-primary" data-act="ask-perm">${icon('bell')}Activer</button>`));
    if (perm() === 'denied') items.push(todo(n, 'Notifications bloquées', `<button class="btn btn-secondary" data-act="guide">Voir comment les réactiver</button>`));
  }

function frTypography(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (n.parentElement.closest('input')) continue;
    n.nodeValue = n.nodeValue
      .replace(/« /g, '« ').replace(/ »/g, ' »')
      .replace(/ ([;!?])/g, ' $1').replace(/ :/g, ' :')
      .replace(/(\d) h (\d\d)/g, '$1 h $2')
      .replace(/(\d) (?=[A-Za-zÀ-ÿ])/g, '$1 ');
  }
}

/* ================= Gestes ================= */
let toastTimer;
function toast(msg, sys = false) {
  S[sys ? 'sysToast' : 'toast'] = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; S.sysToast = null; render(); }, 2800);
}
function openIn(where) {
  S.where = where; S.overlay = null; S.justInstalled = false;
  if (!nav().length || S.ended) replaceAll(boot());
}
function submit() {
  const v = S.input.trim();
  if (screen() === 'code') {
    if (!v) { S.error = 'Tape le code de présence.'; return; }
    if (v.replace(/\s/g, '').toUpperCase() !== CODE) { S.error = "Ce code ne correspond pas. Vérifie-le sur l'affiche, sous le QR code."; return; }
    store().code = CODE;
    S.last = 'Code de présence gardé par le téléphone.';
    replaceAll(boot());
    return;
  }
  if (!v) { S.error = 'Tape ton pseudo.'; return; }
  const p = findPseudo(v);
  if (!p) return link(null);
  S.pending = p;
  go('confirm');
}
function permAnswer(granted) {
  S.perm[key()] = granted ? 'granted' : 'denied';
  S.overlay = null;
  S.last = granted ? 'Notifications autorisées : abonnement rangé avec le téléphone relié.' : 'Notifications refusées : seul le réglage du téléphone peut les rouvrir.';
  if (screen() === 'notif') return replaceAll(granted ? afterNotif() : 'blocked');
  if (granted) toast('<strong>Notifications activées</strong>Ta table arrivera par notification.');
}

phone.addEventListener('submit', (e) => { e.preventDefault(); submit(); render(); });
phone.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  switch (act) {
    // Téléphone
    case 'scan':
      // L'URL du QR code porte le code. Sur Android, un lien ouvre la PWA installée (constaté, #53) ; sur iPhone, Safari.
      S.where = !ios() && S.installed ? 'app' : 'browser';
      store().code = CODE; S.overlay = null; S.justInstalled = false;
      S.last = `QR code scanné : ${S.where === 'app' ? 'la PWA' : browserName()} s'ouvre sur https://${HOST}/?code=${CODE}.`;
      if (!nav().length || S.ended || !store().pseudo) replaceAll(boot());
      break;
    case 'open-browser': openIn('browser'); if (!store().code && !nav().length) S.last = `${browserName()} ouvert sans le QR code : le code manque.`; break;
    case 'open-app': openIn('app'); break;
    case 'home': S.where = 'home'; S.overlay = null; break;
    case 'sys-back':
      if (S.overlay) S.overlay = null;
      else if (S.where === 'home' || S.where === 'settings') S.where = 'home';
      else if (!back()) { if (S.where === 'app' || !ios()) S.where = 'home'; else return toast('Pas de page précédente.', true); }
      break;
    case 'ios-more': S.overlay = 'ios-menu'; break;
    case 'ios-share': S.overlay = 'share'; break;
    case 'ios-addhome': S.overlay = 'addhome'; break;
    case 'ios-add': S.installed = true; S.justInstalled = true; S.overlay = null; S.where = 'home'; S.last = "Icône ajoutée à l'écran d'accueil. La web app a son propre stockage, vide."; break;
    case 'md-more': S.overlay = 'md-menu'; break;
    case 'bip':
      if (S.installed) { openIn('app'); break; }
      S.overlay = 'install'; break;
    case 'install-ok':
      S.installed = true; S.overlay = null; S.last = "PWA installée : elle partage le stockage et la permission de Chrome. Chrome reste ouvert : l'application reçoit appinstalled et invite à passer dans l'application.";
      if (S.where === 'browser' && store().pseudo) replaceAll('android-installed');
      render(); return toast('Chimères a été ajoutée à l\'écran d\'accueil.', true);
    case 'open-installed':
      // Mécanisme à essayer avec le labo : lien vers l'application depuis Chrome, ou seulement l'icône.
      openIn('app'); S.last = "Passage de Chrome à l'application installée."; break;
    case 'stay-chrome': replaceAll('accueil'); break;
    case 'sys-close': S.overlay = null; break;
    case 'sys-none': S.overlay = null; break;
    case 'perm-allow': permAnswer(true); break;
    case 'perm-deny': permAnswer(false); break;
    // Application
    case 'submit': submit(); break;
    case 'back': back(); break;
    case 'yes': link(S.pending); break;
    case 'no': nav().pop(); S.pending = null; S.input = ''; S.error = ''; break;
    case 'skip': S.overlay = 'skip'; break;
    case 'skip-ok':
      S.overlay = null;
      if (screen() === 'install-first') go('pseudo');
      else replaceAll(afterNotif());
      break;
    case 'tab': S.tabs[S.where] = t.dataset.v; break;
    case 'dismiss-install': S.installDismissed = true; break;
    case 'open-settings': S.where = 'settings'; S.overlay = null; S.justInstalled = false; break;
    case 'settings-toggle': {
      const k = ios() ? 'app' : 'browser';
      S.perm[k] = S.perm[k] === 'granted' ? 'denied' : 'granted';
      S.last = `Réglages du téléphone : notifications ${S.perm[k] === 'granted' ? 'autorisées' : 'refusées'} pour Chimères.`;
      break;
    }
    case 'site': S.overlay = 'site'; break;
    case 'site-toggle':
      S.perm.browser = S.perm.browser === 'granted' ? 'denied' : 'granted';
      S.last = `Paramètres du site dans Chrome : notifications ${S.perm.browser === 'granted' ? 'autorisées' : 'bloquées'}.`;
      break;
    case 'later': replaceAll(screen() === 'notif' ? afterNotif() : 'accueil'); break;
    case 'continue': replaceAll(afterNotif()); break;
    case 'ask-perm': S.overlay = 'perm'; break;
    case 'menu': S.overlay = S.overlay === 'menu' ? null : 'menu'; break;
    case 'change': S.overlay = 'change'; break;
    case 'change-ok': {
      const p = me(); p.phones = Math.max(0, p.phones - 1);
      S.last = `Lien coupé avec « ${p.name} » ; le pseudo reste, avec ses inscriptions.`;
      store().pseudo = null; S.overlay = null; replaceAll('pseudo'); break;
    }
    case 'guide': S.overlay = 'guide'; break;
    case 'close': S.overlay = null; break;
    case 'out': return toast('<strong>Hors du parcours</strong>Le programme et les fiches sont dans le prototype de la coquille.');
  }
  render();
});

}

const sw = document.getElementById('switcher');
if (matchMedia('(max-width: 520px)').matches) sw.classList.add('collapsed');
document.getElementById('sw-toggle').onclick = (e) => { const c = sw.classList.toggle('collapsed'); e.target.setAttribute('aria-expanded', String(!c)); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'Escape' && S.overlay) { S.overlay = null; render(); }
});

syncUrl();
render();
</script>
</html>
