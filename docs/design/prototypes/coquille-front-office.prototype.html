<!doctype html>
<html lang="fr">
<!--
  PROTOTYPE JETABLE : ne pas reprendre ce code en production.
  Question : comment s'organise le front office sur un téléphone ? Navigation (onglets ? lesquels),
  et ce que montre l'écran d'accueil selon le moment de la journée : avant l'ouverture des inscriptions,
  inscriptions ouvertes, tirage lancé, tirage publié (« la dernière affectation publiée en premier », §5.6).
  Ticket « Coquille du front office : navigation et écran d'accueil selon la phase » (#51).

  Quatre variantes, basculables par ?variant=A|B|C|D et par les flèches ← → du clavier.
  Le moment de la journée se choisit dans la barre (?moment=…), ou par les flèches ↑ ↓.
  ?mj=1 relie le téléphone au MJ Kaïros, qui mène au créneau 2. ?bandeau=… montre le bandeau de NO-6.
  Rien n'est enregistré : tout vit en mémoire. La fiche d'une partie est une ébauche commune aux variantes
  (elle relève d'un autre ticket). Aucune image de scénario : toutes les parties ont l'illustration par défaut.

    A « Trois onglets »       : Accueil, Programme, Mes parties. L'accueil ne montre que ce qui compte maintenant.
    B « Ma journée »          : deux onglets. L'accueil est l'agenda de la journée ; la dernière affectation, en billet.
    C « Créneau par créneau » : pas de barre d'onglets ; un onglet par créneau en haut, une page par créneau.
    D « Le fil »              : un seul écran, le fil de ce qui t'arrive ; le programme s'ouvre par un bouton.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coquille du front office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Aldrich&display=swap">
<style>
/* Jetons repris de packages/design/tokens.css. Échelle typographique du mobile : provisoire, pour le prototype. */
:root {
  color-scheme: dark;
  --surface-0: #151717;
  --surface-1: #1b1e1e;
  --surface-2: #222525;
  --surface-3: #2a2d2d;
  --border: #313535;
  --text: #eceae6;
  --text-muted: #a9a49e;
  --accent: #fc9203;
  --on-accent: #161818;
  --focus: #7cc4e4;
  --success: #6cc08b;
  --warning: #e8d25c;
  --danger: #f07f63;
  --engraving: #3a3e3e;
  --engraving-strong: #626767;
  --initial: #8c837c;
  --emblem-1: #4e4944; --emblem-2: #5e5852; --emblem-3: #6e6862;
  --emblem-4: #7d766f; --emblem-5: #8c837c; --emblem-6: #a39a92;
  --font-display: 'Uncial Antiqua', serif;
  --font-caps: 'Aldrich', sans-serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-hero: 2rem;
  --fs-title: 1.625rem;
  --fs-section: 1.25rem;
  --fs-block: 1.0625rem;
  --fs-body: .9375rem;
  --fs-meta: .8125rem;
  --fs-over: .6875rem;
  --space-xxs: 2px; --space-xs: 4px; --space-s: 8px; --space-m: 12px;
  --space-l: 16px; --space-xl: 24px; --space-xxl: 32px;
  --radius-card: 12px; --radius-control: 8px; --radius-thumb: 6px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0b0c0c; color: var(--text); font: 400 var(--fs-body)/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
svg.i { width: 20px; height: 20px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.over { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .12em; font-size: var(--fs-over); color: var(--text-muted); }
.meta { color: var(--text-muted); font-size: var(--fs-meta); }
.stack { display: grid; gap: var(--space-s); }
.stack-l { display: grid; gap: var(--space-l); }
.pad { padding: var(--space-l); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Scène : téléphone sur ordinateur, plein écran sur téléphone ---------- */
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 16px 16px 96px; }
.notes { width: 320px; flex: none; color: #c9c4be; font: 13px/1.55 system-ui, sans-serif; display: none; }
.notes h2 { font: 600 15px/1.3 system-ui, sans-serif; color: #f1efec; margin: 0 0 6px; }
.notes h3 { font: 600 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #8f8a85; margin: 18px 0 6px; }
.notes p { margin: 0 0 8px; }
.notes .clock { font: 600 28px/1 system-ui, sans-serif; color: #f1efec; font-variant-numeric: tabular-nums; }
@media (min-width: 1000px) { .notes { display: block; } }
.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 120px)); min-height: 600px; border-radius: 46px; overflow: hidden; background: var(--surface-0); display: flex; flex-direction: column; box-shadow: 0 0 0 10px #1c1d1d, 0 0 0 11px #333; }
.statusbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font: 600 15px system-ui, sans-serif; background: var(--surface-1); }
.statusbar .sb-right { font-size: 12px; letter-spacing: .04em; }
.app { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
@media (max-width: 520px) {
  .stage { padding: 0; }
  .phone { width: 100vw; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; border-radius: 0; box-shadow: none; }
  .statusbar { display: none; }
}

/* ---------- Éléments communs ---------- */
.hdr { flex: none; display: flex; align-items: center; gap: var(--space-s); padding: var(--space-xs) var(--space-s) var(--space-xs) var(--space-l); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--space-s); min-width: 0; flex: 1; }
.emblem { width: 28px; height: 28px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.2; flex: 1; min-width: 0; }
.pseudo { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border); font-weight: 600; font-size: var(--fs-meta); flex: none; max-width: 150px; }
.pseudo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pseudo svg { width: 18px; height: 18px; color: var(--text-muted); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; flex: none; }
.icon-btn:hover { background: var(--surface-3); }

.bandeau { flex: none; display: flex; gap: var(--space-s); align-items: flex-start; width: 100%; min-height: 44px; padding: var(--space-s) var(--space-l); background: color-mix(in srgb, var(--warning) 14%, var(--surface-1)); border-bottom: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; text-align: left; }
.bandeau svg { width: 18px; height: 18px; color: var(--warning); margin-top: 1px; }
.bandeau .chev { margin-left: auto; color: var(--text-muted); }
.bandeau.bottom { border-bottom: 0; border-top: 1px solid var(--border); }

.tabbar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-1); border-top: 1px solid var(--border); padding-bottom: max(env(safe-area-inset-bottom), 8px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: var(--text-muted); font-size: .75rem; font-weight: 600; text-align: center; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--radius-control); font-weight: 600; font-size: var(--fs-body); border: 1px solid transparent; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface-3); border-color: var(--border); }
.btn-ghost { color: var(--accent); padding: 0 var(--space-s); }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--text-muted); }
.badge svg { width: 14px; height: 14px; }
.t-ok { color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface-2)); }
.t-warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, var(--surface-2)); }
.t-danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface-2)); }
.t-accent { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.t-neutral { color: var(--text); background: var(--surface-3); }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-xs); }

.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-card); }
.section-title { font-size: var(--fs-section); font-weight: 600; }
.block-title { font-size: var(--fs-block); font-weight: 600; line-height: 1.25; }

/* Illustration par défaut : motif gravé et lettrine, sur le tiers droit et dans le haut. */
.ill { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: var(--radius-card); background: var(--surface-2); border: 1px solid var(--border); width: 100%; display: block; text-align: left; }
.ill > svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, color-mix(in srgb, var(--surface-0) 94%, transparent) 82%); }
.ill-text { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--space-l); z-index: 1; display: grid; gap: var(--space-xs); }
.ill .corner { position: absolute; top: var(--space-m); left: var(--space-m); z-index: 1; }
.thumb { width: 44px; height: 44px; flex: none; border-radius: var(--radius-thumb); background: var(--surface-3); }
.lettrine { font-family: var(--font-display); fill: var(--initial); }

/* Ligne de partie */
.row { position: relative; display: flex; gap: var(--space-m); align-items: flex-start; padding: var(--space-m) var(--space-l); border-bottom: 1px solid var(--border); }
.row-hit { position: absolute; inset: 0; z-index: 0; }
.row-hit:focus-visible { outline-offset: -2px; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; pointer-events: none; }
.row-title { font-weight: 600; font-size: var(--fs-block); line-height: 1.25; }
.row-side { position: relative; z-index: 1; flex: none; align-self: center; }
.toggle { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-3); color: var(--text); }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.toggle:disabled { opacity: .55; cursor: default; }

.slot-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: var(--space-s); padding: var(--space-s) var(--space-l); background: var(--surface-1); border-bottom: 1px solid var(--border); min-height: 44px; }
.slot-head .over { color: var(--text); }

.status { display: flex; gap: var(--space-s); align-items: flex-start; }
.status svg { width: 18px; height: 18px; margin-top: 1px; }
.tone-ok { color: var(--success); } .tone-warn { color: var(--warning); } .tone-accent { color: var(--accent); } .tone-muted { color: var(--text-muted); } .tone-neutral { color: var(--text); }
.past { opacity: .55; }
.empty { display: grid; justify-items: center; gap: var(--space-s); text-align: center; padding: var(--space-xxl) var(--space-l); color: var(--text-muted); }
.empty svg.eng { width: 120px; height: 120px; }

/* Cartes d'état (héros) */
.hero { position: relative; overflow: hidden; display: grid; gap: var(--space-s); padding: var(--space-l); width: 100%; text-align: left; }
.hero .eng-bg { position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; pointer-events: none; }
.hero > * { position: relative; }
.hero-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.hero-table { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-hero); line-height: 1.1; }
.hero.warn { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
.hero.flat { border-left: 4px solid var(--accent); }
.hero.flat.warn { border-left-color: var(--warning); }
.hero.flat.ok { border-left-color: var(--success); }
.left-list { display: grid; gap: 1px; background: var(--border); border-radius: var(--radius-control); overflow: hidden; margin-top: var(--space-xs); }
.left-item { display: flex; align-items: center; gap: var(--space-m); padding: var(--space-s) var(--space-m); background: var(--surface-3); min-height: 52px; width: 100%; text-align: left; }
.left-item > div { flex: 1; min-width: 0; }
.counts { display: grid; grid-template-columns: 1fr; gap: var(--space-xs); margin-top: var(--space-xs); }
.counts > div { background: var(--surface-3); border-radius: var(--radius-control); padding: var(--space-s) var(--space-m); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-s); }
.counts strong { font-size: var(--fs-body); }

/* A : puces de créneau */
.chips { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-xs); padding: var(--space-s) var(--space-l); background: var(--surface-0); border-bottom: 1px solid var(--border); }
.chip { display: grid; justify-items: center; gap: 1px; min-height: 48px; padding: var(--space-xs); border-radius: var(--radius-control); background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; }
.chip .over { font-size: .625rem; }
.chip[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.chip[aria-selected="true"] .over { color: var(--accent); }
.state-line { display: flex; align-items: center; gap: var(--space-s); padding: var(--space-m) var(--space-l) 0; }

/* B : agenda */
.agenda { display: grid; padding: var(--space-l) var(--space-l) var(--space-xl) 0; }
.ag-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); }
.ag-time { padding: var(--space-m) var(--space-s) 0 0; text-align: right; font-size: var(--fs-meta); color: var(--text-muted); font-variant-numeric: tabular-nums; position: relative; }
.ag-block { padding: var(--space-m); display: grid; gap: var(--space-s); position: relative; min-width: 0; }
.ag-block.now { border-color: var(--accent); }
.ag-pause { grid-column: 2; padding: var(--space-s) var(--space-m); font-size: var(--fs-meta); color: var(--text-muted); border-left: 1px dashed var(--border); margin-left: var(--space-l); }
.ag-now { grid-column: 1 / -1; display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; margin: var(--space-xs) 0; }
.ag-now span { text-align: right; padding-right: var(--space-s); color: var(--accent); font-weight: 600; font-size: var(--fs-meta); font-variant-numeric: tabular-nums; }
.ag-now i { height: 2px; background: var(--accent); border-radius: 2px; position: relative; }
.ag-now i::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.mine-item { display: flex; gap: var(--space-s); align-items: center; padding: var(--space-s); background: var(--surface-3); border-radius: var(--radius-control); width: 100%; text-align: left; min-height: 52px; }
.mine-item > div { flex: 1; min-width: 0; }
.mine-item .thumb { width: 36px; height: 36px; }

/* B : billet */
.ticket { display: grid; grid-template-columns: 84px 1fr; width: 100%; text-align: left; padding: 0; overflow: hidden; }
.ticket .stub { display: grid; align-content: center; justify-items: center; gap: var(--space-xs); padding: var(--space-m) var(--space-s); background: var(--surface-3); border-right: 2px dashed var(--surface-0); }
.ticket .stub strong { font-family: var(--font-caps); font-size: 1.75rem; font-weight: normal; color: var(--accent); font-variant-numeric: tabular-nums; }
.ticket .body { padding: var(--space-m) var(--space-l); display: grid; gap: var(--space-xs); }
.ticket.warn .stub strong { color: var(--warning); }

/* C : onglets de créneau */
.slot-tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-1); border-bottom: 1px solid var(--border); }
.slot-tab { display: grid; justify-items: center; gap: 2px; padding: var(--space-s) var(--space-xs) var(--space-s); min-height: 64px; border-bottom: 3px solid transparent; color: var(--text-muted); }
.slot-tab strong { font-size: var(--fs-meta); color: var(--text); font-variant-numeric: tabular-nums; }
.slot-tab svg { width: 16px; height: 16px; }
.slot-tab[aria-selected="true"] { border-bottom-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface-1)); }
.slot-tab[aria-selected="true"] .over { color: var(--accent); }
.swipe-hint { text-align: center; padding: var(--space-l); }

/* D : fil */
.feed { display: grid; gap: var(--space-s); padding: 0 var(--space-l) var(--space-xl); }
.ev { display: grid; grid-template-columns: 52px 1fr; gap: var(--space-m); padding: var(--space-m); width: 100%; text-align: left; }
.ev time { font-size: var(--fs-meta); color: var(--text-muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.ev.muted { background: transparent; border-style: dashed; }
.ev .block-title { font-size: var(--fs-body); }
.dock { flex: none; padding: var(--space-s) var(--space-l) max(env(safe-area-inset-bottom), var(--space-m)); background: var(--surface-1); border-top: 1px solid var(--border); }

/* Écran d'attente */
.closed { position: relative; min-height: 100%; display: grid; align-content: center; justify-items: center; gap: var(--space-l); padding: var(--space-xxl) var(--space-xl); text-align: center; overflow: hidden; }
.closed > * { position: relative; }
.closed .eng-closed { position: absolute; width: 520px; height: 520px; top: 50%; left: 50%; translate: -50% -50%; }
.emblem-big { width: 96px; height: 96px; }
.closed-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); }

/* Fiche (ébauche commune) et superpositions */
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--surface-0); animation: slide-in 160ms ease-out; }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
.sheet-bar { flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xs) var(--space-s); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet-actions { flex: none; display: grid; gap: var(--space-s); padding: var(--space-m) var(--space-l) max(env(safe-area-inset-bottom), var(--space-m)); background: var(--surface-1); border-top: 1px solid var(--border); }
.fiche-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.warn-note { display: flex; gap: var(--space-s); color: var(--warning); font-size: var(--fs-meta); font-weight: 600; }
.warn-note svg { width: 18px; height: 18px; }
.cw { padding: var(--space-m); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-control); display: grid; gap: var(--space-xs); }
.scrim { position: absolute; inset: 0; z-index: 29; background: color-mix(in srgb, var(--surface-0) 72%, transparent); animation: fade-in 140ms ease-out; }
.menu { --menu-edge: color-mix(in srgb, var(--accent) 60%, var(--border)); position: absolute; z-index: 30; top: 62px; right: var(--space-s); width: 264px; padding: var(--space-l); display: grid; gap: var(--space-s); background: var(--surface-3); border: 1px solid var(--menu-edge); border-radius: var(--radius-card); animation: pop-in 140ms ease-out; transform-origin: top right; }
.menu::before { content: ''; position: absolute; top: -7px; right: 52px; width: 12px; height: 12px; background: var(--surface-3); border-left: 1px solid var(--menu-edge); border-top: 1px solid var(--menu-edge); rotate: 45deg; }
.menu .btn-secondary { background: var(--surface-2); }
.pseudo[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.pseudo[aria-expanded="true"] svg { color: var(--accent); }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
@keyframes fade-in { from { opacity: 0; } }
.toast { position: absolute; z-index: 40; left: var(--space-l); right: var(--space-l); bottom: 84px; padding: var(--space-m) var(--space-l); background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-control); font-size: var(--fs-meta); }
.toast strong { display: block; color: var(--text); font-size: var(--fs-body); }

/* ---------- Barre du prototype : hors du design évalué ---------- */

  { key: 'non-place', clock: 568, label: '9 h 28 · créneau 1 publié : pas de place', slots: ['published', 'open', 'open', 'open'], signups: S1, results: { 1: null },
    note: "Publication du créneau 1 : ses deux parties sont complètes. Il reste de la place aux tables Licorne et Hydre." },
  { key: 'pause', clock: 760, label: '12 h 40 · pause, créneau 2 pas encore tiré', slots: ['published', 'open', 'open', 'open'], signups: S2, results: { 1: 'g13' },
    note: "Le créneau 1 est terminé, le créneau 2 pas encore tiré. Un créneau terminé disparaît de l'application : son affectation ne passe plus en premier." },
  { key: 'c2-publie', clock: 802, label: '13 h 22 · créneau 2 publié', slots: ['published', 'published', 'open', 'open'], signups: S2, results: { 1: 'g13', 2: 'g22' },
    note: "Publication du créneau 2. Avec « MJ », Kaïros mène à la table Dragon." },
  { key: 'c2-en-cours', clock: 855, label: '14 h 15 · créneau 2 en cours, nouvelle partie', slots: ['published', 'published', 'open', 'open'], signups: S2, results: { 1: 'g13', 2: 'g22' },
    note: "Le créneau 2 se joue. À 14 h 02, un Organisateur a programmé une partie au créneau 3 depuis la réserve : notification « nouvelle partie »." },
  { key: 'c3-double', clock: 985, label: '16 h 25 · créneau 3 publié : partie double', slots: ['published', 'published', 'published', 'open'], signups: S2, results: { 1: 'g13', 2: 'g22', 3: 'g32' },
    note: "Publication du créneau 3 : le participant joue la partie double, sur les créneaux 3 et 4. Il ne peut plus s'inscrire au créneau 4 (TI-3)." },
];
const BANDEAUX = {
  aucun: { label: 'Bandeau : aucun' },
  ecran: { label: "Bandeau : pas sur l'écran d'accueil", text: "Ajoute l'application à l'écran d'accueil pour connaître ta table", tap: true },
  permission: { label: 'Bandeau : permission à donner', text: 'Active les notifications pour connaître ta table', tap: true },
  refusee: { label: 'Bandeau : permission refusée', text: 'Notifications bloquées : réactive-les dans les réglages pour connaître ta table', tap: true },
  'non-pris': { label: 'Bandeau : push non pris en charge', text: 'Ce téléphone ne reçoit pas les notifications : reviens voir ta table ici après chaque tirage', tap: false },
};
const VARIANTS = {
  A: { name: 'Trois onglets', pitch: "Accueil, Programme, Mes parties. L'accueil ne montre que ce qui compte maintenant : la dernière affectation publiée, sinon l'état des inscriptions, puis la suite de la journée en une ligne par créneau. « Mes parties » détaille tout, créneau par créneau." },
  B: { name: 'Ma journée', pitch: "Deux onglets. L'accueil est l'agenda de la journée : un bloc par créneau sur un axe horaire, les pauses, la ligne « maintenant ». La dernière affectation publiée est épinglée au-dessus, en billet. Le programme défile d'un seul tenant." },
  C: { name: 'Créneau par créneau', pitch: "Pas de barre d'onglets. Un onglet par créneau en haut ; chaque créneau a sa page, qui change selon son état. L'application s'ouvre sur le créneau qui compte. On s'inscrit directement depuis la liste ; on glisse d'un créneau à l'autre." },
  D: { name: 'Le fil', pitch: "Un seul écran : le fil de ce qui t'arrive, du plus récent au plus ancien, avec les textes des notifications. La dernière affectation publiée est épinglée en tête. Le programme s'ouvre par un bouton, en bas." },
};
const KEYS = Object.keys(VARIANTS);

/* ================= État ================= */
const params = new URLSearchParams(location.search);
const momentIndex = Math.max(0, MOMENTS.findIndex((m) => m.key === params.get('moment')));
const S = {
  variant: KEYS.includes(params.get('variant')) ? params.get('variant') : 'A',
  moment: params.has('moment') ? momentIndex : 1,
  mj: params.get('mj') === '1',
  bandeau: BANDEAUX[params.get('bandeau')] ? params.get('bandeau') : 'aucun',
  tabs: { A: 'accueil', B: 'journee' },
  progSlot: null,
  cSlot: null,
  dProg: false,
  fiche: null,
  warnFor: null,
  menu: false,
  toast: null,
  scrollTo: null,
  signups: new Set(),
};

const M = () => MOMENTS[S.moment];
const G = (id) => GAMES.find((g) => g.id === id);
const pseudo = () => (S.mj ? 'Kaïros' : 'Mélusine');
const clock = () => M().clock;
const fmt = (min) => `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}`;
const dur = (min) => (min < 60 ? `${min} min` : min % 60 ? `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}` : `${min / 60} h`);
const plural = (k, w) => `${k} ${w}${k > 1 ? 's' : ''}`;
const listFr = (a) => (a.length <= 1 ? a.join('') : `${a.slice(0, -1).join(', ')} et ${a[a.length - 1]}`);
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

function resetMoment() {
  // Le MJ Kaïros mène au créneau 2 : il n'y a aucune inscription (IN-4).
  S.signups = new Set(M().signups.filter((id) => !(S.mj && G(id).slot === 2)));
  S.progSlot = null; S.cSlot = null; S.dProg = false; S.fiche = null; S.warnFor = null; S.menu = false;
}

/* ================= Règles (simplifiées) ================= */
const slotState = (n) => M().slots[n - 1];
function timeOf(n, double) {
  const s = SLOTS[n - 1].s, e = (double ? SLOTS[n] : SLOTS[n - 1]).e, c = clock();
  return c < s ? 'upcoming' : c < e ? 'current' : 'past';
}
const visible = (g) => !g.from || g.from <= clock();
const gamesOn = (n) => GAMES.filter((g) => visible(g) && (g.slot === n || (g.double && g.slot + 1 === n)));
const result = (n) => (S.mj && n === 2 ? undefined : M().results[n]);
const slotName = (n, double) => (double ? `Créneaux ${n} et ${n + 1}` : `Créneau ${n}`);
const slotRange = (n, double) => `${SLOTS[n - 1].start} – ${(double ? SLOTS[n] : SLOTS[n - 1]).end}`;

// Ce que le créneau n est pour la personne reliée au téléphone.
function mine(n) {
  const st = slotState(n);
  if (S.mj && n === 2) return { kind: 'leads', game: G('g21'), published: st === 'published' };
  const prev = n > 1 ? result(n - 1) : undefined;
  if (prev && G(prev).double && G(prev).slot === n - 1 && slotState(n - 1) === 'published') return { kind: 'assigned', game: G(prev), continued: true };
  if (st === 'published') {
    const r = result(n);
    if (r === undefined) return { kind: 'none' };
    return r ? { kind: 'assigned', game: G(r) } : { kind: 'unassigned', left: gamesOn(n).filter((g) => (g.players ?? 0) < g.max) };
  }
  const signups = gamesOn(n).filter((g) => S.signups.has(g.id));
  if (st === 'drawing') return { kind: 'pending', signups };
  if (st === 'open') return { kind: 'open', signups };
  return { kind: 'before' };
}

// La carte à montrer en premier : la dernière affectation publiée, tant que son créneau n'est pas fini.
function focus() {
  for (let n = 4; n >= 1; n--) {
    if (slotState(n) !== 'published') continue;
    const m = mine(n);
    if (m.continued || !['assigned', 'unassigned', 'leads'].includes(m.kind)) continue;
    if (timeOf(n, m.game?.double) !== 'past') return { type: m.kind, n, m };
    break;
  }
  for (let n = 1; n <= 4; n++) {
    if (slotState(n) === 'drawing' && timeOf(n) !== 'past') {
      const m = mine(n);
      if (m.signups.length) return { type: 'pending', n, m };
    }
  }
  return { type: slotState(1) === 'before' ? 'before' : 'open' };
}
const focusSlot = () => {
  const f = focus();
  if (f.n) return f.n;
  return SLOTS.find((s) => timeOf(s.n) !== 'past')?.n ?? 4;
};

function canSignUp(g) {
  if (S.mj && g.id === 'g21') return { ok: false, why: 'Tu mènes cette partie.' };
  for (const n of g.double ? [g.slot, g.slot + 1] : [g.slot]) {
    const st = slotState(n);
    if (st === 'before') return { ok: false, why: "Les inscriptions ne sont pas encore ouvertes : elles ouvriront le jour de la convention." };
    if (st === 'drawing') return { ok: false, why: `Tirage en cours : les inscriptions du créneau ${n} sont fermées.` };
    if (st === 'published') return { ok: false, why: `Le tirage du créneau ${n} est publié.` };
    if (S.mj && n === 2) return { ok: false, why: 'Tu mènes une partie sur ce créneau.' };
    const m = mine(n);
    if (m.continued) return { ok: false, why: `Tu joues ${m.game.title} sur ce créneau.` };
  }
  return { ok: true };
}

/* ================= Morceaux communs ================= */
function initialOf(title) {
  const words = title.trim().split(/\s+/);
  let w = words[0];
  if (/^l['’]/i.test(w)) w = w.slice(2);
  else if (['le', 'la', 'les', 'un', 'une', 'des', 'the', 'a', 'an'].includes(w.toLowerCase()) && words[1]) w = words[1];
  return w.charAt(0).toLocaleUpperCase('fr');
}
const thumb = (g, size = 44) => `<svg class="thumb" style="width:${size}px;height:${size}px" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#engraving-small" x="-100" y="-100" width="200" height="200"/><text class="lettrine" x="0" y="8" text-anchor="middle" dominant-baseline="middle" font-size="92">${initialOf(g.title)}</text></svg>`;
const art = (g) => `<svg class="art" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#engraving-initial" x="168" y="-4" width="164" height="164"/><text class="lettrine" x="250" y="82" text-anchor="middle" dominant-baseline="middle" font-size="66">${initialOf(g.title)}</text></svg>`;
const engraving = (cls) => `<svg class="${cls}" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#engraving" x="-100" y="-100" width="200" height="200"/></svg>`;

function counter(g) {
  const n = g.slot;
  if (slotState(n) === 'before') return `<span class="num">${plural(g.max, 'place')}</span>`;
  if (slotState(n) === 'published' && g.players != null) return `<span class="num">${plural(g.players, 'joueur')} · ${plural(g.max, 'place')}</span>`;
  const k = g.others + (S.signups.has(g.id) ? 1 : 0);
  return `<span class="num">${plural(k, 'inscrit')} · ${plural(g.max, 'place')}</span>`;
}
const oversubscribed = (g) => slotState(g.slot) !== 'before' && slotState(g.slot) !== 'published' && g.others + (S.signups.has(g.id) ? 1 : 0) > g.max;
const badge = (tone, ic, label) => `<span class="badge t-${tone}">${icon(ic)}${label}</span>`;
const tresDemandee = (g) => (oversubscribed(g) ? badge('warn', 'triangle-alert', 'Très demandée') : '');

function slotBadge(n) {
  const t = timeOf(n), st = slotState(n);
  if (t === 'past') return badge('neutral', 'circle-check', 'Terminé');
  if (t === 'current') return badge('accent', 'clock', 'Maintenant');
  if (st === 'before') return badge('neutral', 'clock', 'Inscriptions bientôt');
  if (st === 'open') return badge('accent', 'circle-check', 'Inscriptions ouvertes');
  if (st === 'drawing') return badge('neutral', 'hourglass', 'Tirage en cours');
  return badge('ok', 'circle-check', 'Tirage publié');
}

// Une ligne d'état par créneau, pour la personne.
function mineLine(n) {
  const m = mine(n);
  const g = m.game;
  switch (m.kind) {
    case 'before': return { tone: 'muted', ic: 'clock', label: 'Inscriptions pas encore ouvertes', act: 'goto-prog' };
    case 'open': return m.signups.length
      ? { tone: 'accent', ic: 'circle-check', label: plural(m.signups.length, 'inscription'), detail: listFr(m.signups.map((x) => x.title)), act: 'goto-prog' }
      : { tone: 'muted', ic: 'plus', label: 'Aucune inscription', detail: 'Choisir une partie', act: 'goto-prog' };
    case 'pending': return { tone: 'neutral', ic: 'hourglass', label: 'Tirage en cours', detail: m.signups.length ? plural(m.signups.length, 'inscription') + ' : ' + listFr(m.signups.map((x) => x.title)) : 'Aucune inscription', act: 'goto-prog' };
    case 'assigned': return { tone: 'ok', ic: 'circle-check', label: `Table ${g.table}`, detail: `${g.title}, avec ${g.mj}${m.continued ? ' · suite de la partie double' : ''}`, act: 'fiche', id: g.id };
    case 'unassigned': return { tone: 'warn', ic: 'triangle-alert', label: 'Pas de place pour toi', detail: m.left.length ? `Il reste de la place aux tables ${listFr(m.left.map((x) => x.table))}` : 'Toutes les parties du créneau sont complètes.', act: 'goto-prog' };
    case 'leads': return m.published
      ? { tone: 'accent', ic: 'book-open', label: `Tu mènes à la table ${g.table}`, detail: `${g.title}, avec ${g.players} joueurs`, act: 'fiche', id: g.id }
      : { tone: 'accent', ic: 'book-open', label: 'Tu mènes', detail: `${g.title}, table ${g.table}`, act: 'fiche', id: g.id };
    default: return { tone: 'muted', ic: 'circle-check', label: 'Tirage publié', detail: 'Aucune inscription sur ce créneau', act: 'goto-prog' };
  }
}
const statusHTML = (l) => `<div class="status tone-${l.tone}">${icon(l.ic)}<div><div style="font-weight:600">${l.label}</div>${l.detail ? `<div class="meta">${l.detail}</div>` : ''}</div></div>`;

function header(right = '') {
  return `<header class="hdr"><div class="brand"><svg class="emblem" aria-hidden="true"><use href="#emblem-small"/></svg><span class="brand-name">Histoires de Chimères</span></div>${right}${pseudoBtn()}</header>`;
}
const pseudoBtn = () => `<button class="pseudo" data-act="menu" aria-haspopup="dialog" aria-expanded="${S.menu}">${icon('user-round')}<span>${pseudo()}</span></button>`;
function bandeau(pos = '') {
  const b = BANDEAUX[S.bandeau];
  if (!b.text) return '';
  const inner = `${icon(b.tap ? 'bell-off' : 'triangle-alert')}<span>${b.text}</span>${b.tap ? icon('chevron-right', 'i chev') : ''}`;
  return b.tap ? `<button class="bandeau ${pos}" data-act="bandeau">${inner}</button>` : `<div class="bandeau ${pos}" role="status">${inner}</div>`;
}
const tabbar = (items, current) => `<nav class="tabbar" aria-label="Navigation principale">${items.map(([k, ic, label]) => `<button class="tab" data-act="tab" data-v="${k}" ${k === current ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`;

// Ligne de partie. inline : bouton d'inscription dans la ligne (variante C).
function gameRow(g, { inline = false } = {}) {
  const signed = S.signups.has(g.id);
  const can = canSignUp(g);
  const st = slotState(g.slot);
  let side = '';
  if (inline && can.ok) side = `<div class="row-side"><button class="toggle" data-act="toggle" data-id="${g.id}" aria-pressed="${signed}" aria-label="${signed ? 'Se désinscrire de' : "S'inscrire à"} ${g.title}">${icon(signed ? 'check' : 'plus')}</button></div>`;
  else if (inline && signed && st === 'drawing') side = `<div class="row-side"><span class="toggle" aria-label="Inscrit, tirage en cours" style="opacity:.6">${icon('lock')}</span></div>`;
  const myBadges = [];
  if (signed && st !== 'published' && !(inline && can.ok)) myBadges.push(badge('accent', 'check', 'Inscrit'));
  const r = mine(g.slot);
  if (r.kind === 'assigned' && r.game.id === g.id) myBadges.push(badge('ok', 'circle-check', 'Ta table'));
  if (r.kind === 'leads' && r.game.id === g.id) myBadges.push(badge('accent', 'book-open', 'Tu mènes'));
  if (g.double) myBadges.push(badge('neutral', 'clock', `Double · créneaux ${g.slot} et ${g.slot + 1}`));
  if (g.from) myBadges.push(badge('accent', 'sparkles', 'Nouvelle'));
  const left = st === 'published' && g.players != null && g.players < g.max ? badge('ok', 'users', `${plural(g.max - g.players, 'place')} libre${g.max - g.players > 1 ? 's' : ''}`) : '';
  return `<div class="row">
    <button class="row-hit" data-act="fiche" data-id="${g.id}" aria-label="${g.title}, table ${g.table}"></button>
    ${thumb(g)}
    <div class="row-main">
      <span class="row-title">${g.title}</span>
      <span class="meta">${g.system} · avec ${g.mj}</span>
      <span class="meta">Table ${g.table} · ${counter(g)}</span>
      ${myBadges.length || oversubscribed(g) || left ? `<span class="badges" style="margin-top:4px">${myBadges.join('')}${tresDemandee(g)}${left}</span>` : ''}
    </div>${side}
  </div>`;
}

/* ---------- Cartes d'état ---------- */
// Grande carte 3:2 pour une affectation, une partie menée ; carte gravée pour les autres états.
function heroBig(f) {
  if (f.type === 'assigned' || (f.type === 'leads' && f.m.published)) {
    const g = f.m.game, dbl = !!g.double;
    const t = timeOf(f.n, dbl);
    const when = t === 'current' ? badge('accent', 'clock', `Maintenant · jusqu'à ${(dbl ? SLOTS[f.n] : SLOTS[f.n - 1]).end}`) : badge('neutral', 'clock', `Début à ${SLOTS[f.n - 1].start}`);
    const title = f.type === 'leads' ? `Tu mènes à la table ${g.table}` : `Table ${g.table}`;
    const line = f.type === 'leads' ? `<strong>${g.title}</strong>, avec ${g.players} joueurs.` : `Tu joues à <strong>${g.title}</strong>, avec ${g.mj}.`;
    return `<button class="ill" data-act="fiche" data-id="${g.id}">${art(g)}
      <span class="corner">${when}</span>
      <span class="ill-text"><span class="over">${slotName(f.n, dbl)} · ${slotRange(f.n, dbl)}</span>
      <span class="${f.type === 'leads' ? 'hero-title' : 'hero-table'}">${title}</span>
      <span>${line}</span><span class="meta">${g.system}</span></span></button>
      ${f.type === 'leads' ? `<button class="btn btn-secondary btn-block" data-act="mj-view">${icon('users')}Voir tes joueurs</button>` : ''}`;
  }
  if (f.type === 'unassigned') return unassignedCard(f, '');
  return phaseCard(f, '');
}
function unassignedCard(f, cls) {
  const left = f.m.left;
  return `<section class="card hero warn ${cls}">
    <span class="over">${slotName(f.n)} · ${slotRange(f.n)}</span>
    <h2 class="hero-title">Pas de place pour toi</h2>
    <p>${left.length ? `Les parties que tu avais choisies sont complètes. Il reste de la place aux tables ${listFr(left.map((g) => g.table))} : va voir leur MJ.` : 'Toutes les parties du créneau sont complètes.'}</p>
    <div class="left-list">${left.map((g) => `<button class="left-item" data-act="fiche" data-id="${g.id}">${thumb(g, 36)}<div><div style="font-weight:600">Table ${g.table}</div><div class="meta">${g.title}, avec ${g.mj}</div></div>${badge('ok', 'users', plural(g.max - g.players, 'place'))}</button>`).join('')}</div>
  </section>`;
}
function phaseCard(f, cls) {
  const eng = cls.includes('flat') ? '' : engraving('eng-bg');
  if (f.type === 'pending') {
    const k = f.m.signups.length;
    return `<section class="card hero ${cls}">${eng}
      <span class="over">${slotName(f.n)} · ${slotRange(f.n)}</span>
      <h2 class="hero-title">Tirage en cours</h2>
      <p>Tes ${plural(k, 'inscription')} comptent pour ce tirage : ${listFr(f.m.signups.map((g) => g.title))}.</p>
      <p class="meta">Ta table s'affichera ici dès la publication.</p></section>`;
  }
  if (f.type === 'before') {
    return `<section class="card hero ${cls}">${eng}
      <span class="over">Samedi 14 mars 2027</span>
      <h2 class="hero-title">Les inscriptions ouvriront le jour de la convention</h2>
      <p>En attendant, tu peux lire le programme.</p>
      <div><button class="btn btn-primary" data-act="goto-prog" data-n="1">${icon('calendar')}Voir le programme</button></div></section>`;
  }
  const counts = SLOTS.filter((s) => timeOf(s.n) !== 'past').map((s) => {
    const m = mine(s.n);
    const v = m.kind === 'leads' ? 'Tu mènes' : m.continued ? 'Partie double' : m.kind === 'assigned' ? `Table ${m.game.table}` : m.kind === 'unassigned' ? 'Pas de place' : m.signups ? (m.signups.length ? plural(m.signups.length, 'inscription') : 'Aucune inscription') : '–';
    return `<div><span class="over">Créneau ${s.n} · ${s.start}</span><strong class="num">${v}</strong></div>`;
  }).join('');
  return `<section class="card hero ${cls}">${eng}
    <span class="over">Inscriptions ouvertes</span>
    <h2 class="hero-title">Choisis tes parties</h2>
    <p>Inscris-toi à autant de parties que tu veux, sur chaque créneau. Chaque créneau est tiré au sort peu avant son début.</p>
    ${cls.includes('flat') ? `<div class="counts">${counts}</div>` : ''}
    <div><button class="btn btn-primary" data-act="goto-prog" data-n="${focusSlot()}">${icon('calendar')}Voir le programme</button></div></section>`;
}

/* ================= Variante A : trois onglets ================= */
function renderA() {
  const tab = S.tabs.A;
  let body = '';
  if (tab === 'accueil') {
    const f = focus();
    const skip = f.n ? [f.n, ...(f.m?.game?.double ? [f.n + 1] : [])] : [];
    const next = SLOTS.filter((s) => timeOf(s.n) !== 'past' && !skip.includes(s.n));
    body = `<div class="pad stack-l">
      ${heroBig(f)}
      ${next.length ? `<section class="stack"><h2 class="section-title">Ton programme</h2>
        <ul class="card" style="overflow:hidden">${next.map((s) => { const l = mineLine(s.n); return `<li style="border-bottom:1px solid var(--border)"><button class="row" style="border:0;width:100%;text-align:left" data-act="${l.act}" data-id="${l.id ?? ''}" data-n="${s.n}"><div class="row-main"><span class="over">${slotName(s.n)} · ${s.start}</span>${statusHTML(l)}</div>${icon('chevron-right', 'i tone-muted')}</button></li>`; }).join('')}</ul></section>` : ''}
    </div>`;
  } else if (tab === 'programme') {
    const n = S.progSlot ?? focusSlot();
    const shown = SLOTS.filter((s) => timeOf(s.n) !== 'past');
    body = `<div class="chips" role="tablist" aria-label="Créneaux" style="grid-template-columns:repeat(${shown.length}, 1fr)">${shown.map((s) => `<button class="chip" role="tab" data-act="prog-slot" data-n="${s.n}" aria-selected="${s.n === n}"><span class="over">Créneau ${s.n}</span><span class="num">${s.start}</span></button>`).join('')}</div>
      <div class="state-line"><span class="meta num">${slotRange(n)}</span>${slotBadge(n)}</div>

  } else {
    body = `<div class="stack">${SLOTS.filter((s) => timeOf(s.n) !== 'past').map((s) => mesPartiesSlot(s.n)).join('')}</div>`;

function bigGameCard(g) {
  const signed = S.signups.has(g.id);
  const r = mine(g.slot);
  const badges = [];
  if (signed && slotState(g.slot) !== 'published') badges.push(badge('accent', 'check', 'Inscrit'));
  if (r.kind === 'assigned' && r.game.id === g.id) badges.push(badge('ok', 'circle-check', 'Ta table'));
  if (r.kind === 'leads' && r.game.id === g.id) badges.push(badge('accent', 'book-open', 'Tu mènes'));
  if (g.double) badges.push(badge('neutral', 'clock', `Double · créneaux ${g.slot} et ${g.slot + 1}`));
  if (g.from) badges.push(badge('accent', 'sparkles', 'Nouvelle'));
  return `<button class="ill" data-act="fiche" data-id="${g.id}">${art(g)}
    ${badges.length ? `<span class="corner badges">${badges.join('')}</span>` : ''}
    <span class="ill-text"><span class="over">Table ${g.table}</span><span class="block-title">${g.title}</span>
    <span class="meta">${g.system} · avec ${g.mj}</span>
    <span class="badges" style="align-items:center"><span class="meta">${counter(g)}</span>${tresDemandee(g)}</span></span></button>`;
}
function mesPartiesSlot(n) {
  const m = mine(n);
  const past = timeOf(n) === 'past';
  let content = '';
  if (m.kind === 'assigned' || m.kind === 'leads') {
    const l = mineLine(n);
    content = `<button class="mine-item" data-act="fiche" data-id="${m.game.id}">${thumb(m.game, 36)}<div>${statusHTML(l)}</div></button>`;
  } else if (m.kind === 'unassigned') {
    content = `<div class="mine-item">${statusHTML(mineLine(n))}</div>`;
  } else if (m.signups?.length) {
    content = m.signups.map((g) => `<button class="mine-item" data-act="fiche" data-id="${g.id}">${thumb(g, 36)}<div><div style="font-weight:600">${g.title}</div><div class="meta">Table ${g.table} · ${counter(g)}</div></div>${m.kind === 'pending' ? icon('lock', 'i tone-muted') : tresDemandee(g)}</button>`).join('');
  } else if (m.kind === 'open') {
    content = `<div class="mine-item" style="justify-content:space-between"><span class="meta">Aucune inscription</span><button class="btn btn-ghost" data-act="goto-prog" data-n="${n}">Choisir une partie</button></div>`;
  } else {
    content = `<div class="mine-item"><span class="meta">${m.kind === 'before' ? 'Inscriptions pas encore ouvertes' : 'Aucune inscription sur ce créneau'}</span></div>`;

}

/* ================= Variante B : ma journée ================= */
function renderB() {

  } else {
    body = programmeAll('B');

function ticket(f) {
  const g = f.m.game, dbl = !!g.double;
  const t = timeOf(f.n, dbl);
  return `<button class="card ticket" data-act="fiche" data-id="${g.id}">
    <span class="stub"><span class="over">${dbl ? 'Créneaux' : 'Créneau'}</span><strong>${dbl ? `${f.n}–${f.n + 1}` : f.n}</strong><span class="meta num">${SLOTS[f.n - 1].start}</span></span>
    <span class="body"><span class="over">${f.type === 'leads' ? 'Tu mènes à la table' : 'Ta table'}</span><span class="hero-table">${g.table}</span>
      <span>${f.type === 'leads' ? `<strong>${g.title}</strong>, avec ${g.players} joueurs.` : `Tu joues à <strong>${g.title}</strong>, avec ${g.mj}.`}</span>
      <span>${t === 'current' ? badge('accent', 'clock', `Maintenant · jusqu'à ${(dbl ? SLOTS[f.n] : SLOTS[f.n - 1]).end}`) : badge('neutral', 'clock', slotRange(f.n, dbl))}</span></span></button>`;
}
function agenda() {
  const c = clock();
  const nowLine = `<div class="ag-now"><span>${fmt(c)}</span><i></i></div>`;
  let out = '';
  SLOTS.forEach((s, i) => {
    if (c < s.s && (i === 0 || c >= SLOTS[i - 1].e)) out += nowLine;
    const t = timeOf(s.n);
    const m = mine(s.n);
    let inner = '';
    if (m.kind === 'open' || m.kind === 'pending') {
      inner = m.signups.length
        ? m.signups.map((g) => `<button class="mine-item" data-act="fiche" data-id="${g.id}">${thumb(g, 36)}<div><div style="font-weight:600">${g.title}</div><div class="meta">Table ${g.table} · ${counter(g)}</div>${m.kind === 'pending' ? '' : tresDemandee(g)}</div>${m.kind === 'pending' ? icon('lock', 'i tone-muted') : ''}</button>`).join('')
        : '';
      inner += m.kind === 'open' ? `<button class="btn ${m.signups.length ? 'btn-ghost' : 'btn-secondary'}" data-act="goto-prog" data-n="${s.n}">${icon('plus')}${m.signups.length ? 'Ajouter une partie' : 'Choisir une partie'}</button>` : `<p class="meta">Ta table s'affichera ici dès la publication.</p>`;
    } else if (m.kind === 'assigned' || m.kind === 'leads') {
      inner = `<button class="mine-item" data-act="fiche" data-id="${m.game.id}">${thumb(m.game, 36)}<div>${statusHTML(mineLine(s.n))}</div></button>`;
    } else if (m.kind === 'unassigned') {
      inner = `<div class="mine-item">${statusHTML(mineLine(s.n))}</div>`;
    } else {
      inner = `<p class="meta">${m.kind === 'before' ? `${plural(gamesOn(s.n).length, 'partie')} au programme · inscriptions pas encore ouvertes` : 'Aucune inscription sur ce créneau'}</p>`;
      if (m.kind === 'before') inner += `<button class="btn btn-ghost" style="justify-self:start" data-act="goto-prog" data-n="${s.n}">Voir les parties</button>`;
    }
    out += `<div class="ag-row ${t === 'past' ? 'past' : ''}"><div class="ag-time">${s.start}</div>
      <section class="card ag-block ${t === 'current' ? 'now' : ''}" aria-label="Créneau ${s.n}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="stack" style="gap:0"><span class="over" style="color:var(--text)">${slotName(s.n)}</span><span class="meta num" style="white-space:nowrap">${slotRange(s.n)}</span></span>${slotBadge(s.n)}</div>
        ${inner}</section></div>`;
    if (i < SLOTS.length - 1) out += `<div class="ag-row"><div></div><div class="ag-pause">pause de ${dur(SLOTS[i + 1].s - s.e)}</div></div>`;
  });
  if (c >= SLOTS[3].e) out += nowLine;
  return out;
}
function programmeAll(prefix) {
  return SLOTS.map((s) => `<section id="${prefix}-prog-${s.n}" class="${timeOf(s.n) === 'past' ? 'past' : ''}"><div class="slot-head"><span class="over">${slotName(s.n)} · ${slotRange(s.n)}</span>${slotBadge(s.n)}</div>

/* ================= Variante D : le fil ================= */
function feedEvents() {
  const c = clock(), ev = [];
  if (slotState(1) !== 'before') ev.push({ t: 510, muted: true, ic: 'circle-check', title: 'Inscriptions ouvertes', body: 'Inscris-toi à autant de parties que tu veux, sur chaque créneau.', act: 'open-prog' });
  SLOTS.forEach((s) => {
    const st = slotState(s.n);
    if (st === 'drawing' || st === 'published') ev.push({ t: s.draw, muted: true, ic: 'hourglass', title: `Créneau ${s.n} : tirage lancé`, body: 'Les inscriptions du créneau sont fermées.' });
    if (st !== 'published') return;
    const m = mine(s.n);
    if (m.continued) return;
    const g = m.game;
    if (m.kind === 'assigned') ev.push({ t: s.pub, ic: 'circle-check', tone: 'ok', title: `${g.double ? `Créneaux ${s.n} et ${s.n + 1}` : `Créneau ${s.n}`} : table ${g.table}`, body: `Tu joues à ${g.title}, avec ${g.mj}.`, act: 'fiche', id: g.id });
    if (m.kind === 'unassigned') ev.push({ t: s.pub, ic: 'triangle-alert', tone: 'warn', title: `Créneau ${s.n} : pas de place pour toi`, body: `Les parties que tu avais choisies sont complètes. Il reste de la place aux tables ${listFr(m.left.map((x) => x.table))} : va voir leur MJ.`, act: 'goto-prog', n: s.n });
    if (m.kind === 'leads') ev.push({ t: s.pub, ic: 'book-open', tone: 'accent', title: `Créneau ${s.n} : tu mènes à la table ${g.table}`, body: `${g.title}, avec ${g.players} joueurs.`, act: 'fiche', id: g.id });
  });
  const ng = G('g35');
  if (c >= ng.from) ev.push({ t: ng.from, ic: 'sparkles', tone: 'accent', title: 'Créneau 3 : nouvelle partie', body: `${ng.title} · ${ng.system}, table ${ng.table}. Tu peux t'y inscrire.`, act: 'fiche', id: ng.id });
  return ev.sort((a, b) => b.t - a.t);
}
function renderD() {

  const body = `<div class="pad stack-l"><div class="stack"><h1 class="over">Maintenant</h1>${pinned}</div></div>

  if (S.dProg) html += `<section class="sheet" aria-label="Programme"><div class="sheet-bar"><button class="icon-btn" data-act="close-prog" aria-label="Retour">${icon('chevron-left')}</button><h1 class="page-title" style="font-size:var(--fs-section)">Programme</h1></div>${bandeau()}<div class="scroll" data-sid="D-prog">${programmeAll('D')}</div></section>`;
  return html;
}

/* ================= Rendu ================= */
const app = document.getElementById('app');
function frTypography(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    n.nodeValue = n.nodeValue
      .replace(/« /g, '« ').replace(/ »/g, ' »')
      .replace(/ ([;!?])/g, ' $1').replace(/ :/g, ' :')
      .replace(/(\d) h (\d\d)/g, '$1 h $2').replace(/(\d) h\b/g, '$1 h')
      .replace(/ – /g, ' – ')
      .replace(/(\d) (?=[A-Za-zÀ-ÿ])/g, '$1 ');
  }
}
function render() {
  const saved = {};
  app.querySelectorAll('[data-sid]').forEach((el) => { saved[el.dataset.sid] = el.scrollTop; });
  let html = M().closed ? renderClosed() : { A: renderA, B: renderB, C: renderC, D: renderD }[S.variant]();
  if (S.fiche && !M().closed) html += renderFiche();
  if (S.menu) html += renderMenu();
  if (S.toast) html += `<div class="toast" role="status">${S.toast}</div>`;
  app.innerHTML = html;
  frTypography(app);
  app.querySelectorAll('[data-sid]').forEach((el) => { if (saved[el.dataset.sid] != null) el.scrollTop = saved[el.dataset.sid]; });
  if (S.scrollTo) { app.querySelector('#' + S.scrollTo)?.scrollIntoView({ block: 'start' }); S.scrollTo = null; }
  document.getElementById('sb-time').textContent = fmt(clock()).replace(' h ', ':');
  document.getElementById('sw-label').textContent = `${S.variant} · ${VARIANTS[S.variant].name}`;
  document.getElementById('moment').value = String(S.moment);
  document.getElementById('mj').checked = S.mj;
  document.getElementById('bandeau').value = S.bandeau;
  renderNotes();
}
function renderNotes() {
  const v = VARIANTS[S.variant];
  const notes = document.getElementById('notes');
  notes.innerHTML = `<h2>${S.variant} · ${v.name}</h2><p>${v.pitch}</p>
    <h3>Moment</h3><p class="clock">${fmt(clock())}</p><p>${M().note}</p>
    <h3>À regarder</h3><p>Ce que montre l'écran à l'ouverture ; où sont tes inscriptions ; où est ta table ; ce qui reste à faire. Avec « MJ » : où se place la partie qu'on mène.</p>
    ${S.variant === 'A' ? `<h3>Retour</h3><p>Le bouton retour du téléphone ou du navigateur, et la flèche ‹ de la fiche, remontent d'un écran : fiche → liste → Accueil → sortie. Changer d'onglet ne s'empile pas : le retour depuis un onglet ramène à l'Accueil. « Ouvrir par une notification » ouvre la fiche directement, avec l'Accueil recréé dessous.</p><p>Écran actuel : <code>${location.hash || '#/accueil'}</code> · profondeur ${depth()}</p>` : ''}
    <p style="color:#8f8a85">← → : variante · ↑ ↓ : moment. La fiche d'une partie est une ébauche commune, hors de la question.</p>`;
  frTypography(notes);
}
function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set('variant', S.variant);
  u.searchParams.set('moment', M().key);
  if (S.mj) u.searchParams.set('mj', '1'); else u.searchParams.delete('mj');
  if (S.bandeau !== 'aucun') u.searchParams.set('bandeau', S.bandeau); else u.searchParams.delete('bandeau');
  writeHistory('replace', history.state, u);
}
// Dans une page intégrée (claude.ai), changer l'URL peut être refusé : on garde alors l'état seul.
function writeHistory(mode, state, u) {
  const fn = mode === 'push' ? 'pushState' : 'replaceState';
  try { history[fn](state, '', u); } catch { history[fn](state, ''); }
}
let toastTimer;
function toast(msg) {
  S.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600);
}
function gotoProg(n) {
  n = Number(n) || focusSlot();
  if (S.variant === 'A') { S.tabs.A = 'programme'; S.progSlot = n; }
  if (S.variant === 'B') { S.tabs.B = 'programme'; S.scrollTo = `B-prog-${n}`; }
  if (S.variant === 'C') S.cSlot = n;
  if (S.variant === 'D') { S.dProg = true; S.scrollTo = `D-prog-${n}`; }
}

/* ---------- Variante A : un écran, une entrée d'historique ----------
   L'Accueil est la racine (profondeur 0). Un autre onglet se pose au-dessus (profondeur 1) ;
   changer d'onglet ne s'empile pas : le retour depuis un onglet ramène toujours à l'Accueil.
   Une fiche s'empile au-dessus de l'écran qui l'ouvre. Le retour du téléphone, du navigateur
   et la flèche ‹ remontent d'un cran. Ouvrir par une notification recrée l'Accueil dessous. */
const depth = () => history.state?.depth ?? 0;
const screenOf = () => ({ tab: S.tabs.A, slot: S.progSlot, fiche: S.fiche });
function hashOf(sc) {
  if (sc.fiche) return `#/partie/${sc.fiche}`;
  if (sc.tab === 'programme') return `#/programme/${sc.slot ?? focusSlot()}`;
  return sc.tab === 'mes' ? '#/mes-parties' : '#/accueil';
}
function applyScreen(sc) { S.tabs.A = sc.tab ?? 'accueil'; S.progSlot = sc.slot ?? null; S.fiche = sc.fiche ?? null; S.warnFor = null; S.menu = false; }
function go(sc, mode) {
  const d = mode === 'push' ? depth() + 1 : depth();
  const u = new URL(location.href);
  u.hash = hashOf(sc);
  writeHistory(mode, { ...sc, depth: d }, u);
  applyScreen(sc);
  render();
}
let pending = null;
function backTo(d, then) {
  if (depth() > d) { pending = then; history.go(d - depth()); } else then();
}
function backOne() { if (depth() > 0) history.back(); else go({ tab: 'accueil' }, 'replace'); }
function goTab(tab) {
  backTo(0, () => (tab === 'accueil' ? go({ tab }, 'replace') : go({ tab }, 'push')));
}
// Ouverture à froid sur un écran (lien d'une notification) : l'Accueil est recréé dessous.
function openAt(sc) {
  backTo(0, () => {
    go({ tab: 'accueil' }, 'replace');
    if (sc.fiche || sc.tab !== 'accueil') go(sc, 'push');
  });
}
function parseHash() {
  const [, kind, arg] = location.hash.split('/');
  if (kind === 'partie' && G(arg)) return { tab: 'accueil', fiche: arg };
  if (kind === 'programme') return { tab: 'programme', slot: Number(arg) || null };
  if (kind === 'mes-parties') return { tab: 'mes' };
  return { tab: 'accueil' };
}
function notificationTarget() {
  const f = focus();
  if (f.m?.game) return f.m.game.id;
  return visible(G('g35')) ? 'g35' : 'g11';
}
window.addEventListener('popstate', (e) => {
  if (S.variant !== 'A') return;
  applyScreen(e.state ?? parseHash());
  if (pending) { const p = pending; pending = null; p(); } else render();
});
function routeA(act, d) {
  switch (act) {
    case 'tab': goTab(d.v); return true;
    case 'fiche': go({ ...screenOf(), fiche: d.id }, 'push'); return true;
    case 'back': backOne(); return true;
    case 'goto-prog': backTo(0, () => go({ tab: 'programme', slot: Number(d.n) || focusSlot() }, 'push')); return true;
    case 'prog-slot': go({ tab: 'programme', slot: Number(d.n) }, 'replace'); return true;
  }
  return false;
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  const { act, id, n, v } = t.dataset;
  if (act !== 'menu') S.menu = false;
  if (S.variant === 'A' && !M().closed && routeA(act, t.dataset)) return;
  switch (act) {
    case 'tab': S.tabs[S.variant] = v; S.fiche = null; break;
    case 'prog-slot': S.progSlot = Number(n); break;
    case 'cslot': S.cSlot = Number(n); break;
    case 'goto-prog': S.fiche = null; gotoProg(n); break;
    case 'fiche': S.fiche = id; S.warnFor = null; break;
    case 'back': S.fiche = null; break;
    case 'open-prog': S.dProg = true; break;
    case 'close-prog': S.dProg = false; break;
    case 'menu': S.menu = !S.menu; break;
    case 'toggle': {
      if (!canSignUp(G(id)).ok) break;
      if (S.signups.has(id)) { S.signups.delete(id); S.warnFor = null; }
      else {
        S.signups.add(id);
        if (oversubscribed(G(id))) {
          if (S.fiche) S.warnFor = id;
          else return toast(`<strong>Partie très demandée</strong>Tu risques de ne pas y avoir de place. Inscris-toi aussi à d'autres parties du créneau ${G(id).slot}.`);
        }
      }
      break;
    }
    case 'change-pseudo': return toast("<strong>Changer de pseudo</strong>Coupe le lien du téléphone et ramène à l'identification (ID-9). Hors du prototype.");
    case 'bandeau': return toast("<strong>Guide d'activation</strong>Il relève du parcours d'accueil, un autre ticket.");
    case 'mj-view': return toast('<strong>Vue du MJ</strong>Elle relève de son propre ticket.');
    case 'early': return toast("<strong>Code d'accès anticipé</strong>Sa saisie relève de l'écran d'attente (ticket « Programme public avant la convention »).");
  }
  render();
});

// C : glisser d'un créneau à l'autre.
let touch = null;
app.addEventListener('touchstart', (e) => { if (S.variant === 'C' && !S.fiche) touch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
app.addEventListener('touchend', (e) => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const n = (S.cSlot ?? focusSlot()) + (dx < 0 ? 1 : -1);
  if (n >= 1 && n <= 4) { S.cSlot = n; render(); }
});

/* ---------- Barre du prototype ---------- */
const momentSel = document.getElementById('moment');
momentSel.innerHTML = MOMENTS.map((m, i) => `<option value="${i}">${m.label}</option>`).join('');
document.getElementById('bandeau').innerHTML = Object.entries(BANDEAUX).map(([k, b]) => `<option value="${k}">${b.label}</option>`).join('');
function setVariant(k) {
  S.variant = k; S.fiche = null; S.menu = false; S.dProg = false;
  syncUrl();
  if (k === 'A') openAt({ tab: S.tabs.A });
  else render();
}
const cycle = (dir) => setVariant(KEYS[(KEYS.indexOf(S.variant) + dir + KEYS.length) % KEYS.length]);
function setMoment(i) {
  const tab = S.tabs.A;
  S.moment = (i + MOMENTS.length) % MOMENTS.length;
  resetMoment();
  syncUrl();
  if (S.variant === 'A') openAt({ tab: M().closed ? 'accueil' : tab });
  else render();
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('m-prev').onclick = () => setMoment(S.moment - 1);
document.getElementById('m-next').onclick = () => setMoment(S.moment + 1);
momentSel.onchange = (e) => setMoment(Number(e.target.value));
document.getElementById('mj').onchange = (e) => { S.mj = e.target.checked; resetMoment(); syncUrl(); render(); };
document.getElementById('bandeau').onchange = (e) => { S.bandeau = e.target.value; syncUrl(); render(); };
document.getElementById('notif').onclick = () => { if (S.variant !== 'A') setVariant('A'); if (!M().closed) openAt({ tab: 'accueil', fiche: notificationTarget() }); };
const sw = document.getElementById('switcher');
if (matchMedia('(max-width: 520px)').matches) sw.classList.add('collapsed');
document.getElementById('sw-toggle').onclick = (e) => { const c = sw.classList.toggle('collapsed'); e.target.setAttribute('aria-expanded', String(!c)); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); setMoment(S.moment - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setMoment(S.moment + 1); }
  else if (e.key === 'Escape' && (S.fiche || S.menu || S.dProg)) {
    if (S.menu) S.menu = false;
    else if (S.variant === 'A' && S.fiche) return backOne();
    else if (S.fiche) S.fiche = null; else S.dProg = false;
    render();
  }
});

resetMoment();
syncUrl();
if (S.variant === 'A') openAt(M().closed ? { tab: 'accueil' } : parseHash());
else render();
</script>
</html>
