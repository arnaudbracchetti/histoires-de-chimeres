<title>Fiche de partie</title>
<!--
  PROTOTYPE JETABLE : ne pas reprendre ce code en production.
  Question : à quoi ressemble la fiche d'une partie sur le téléphone, et comment on s'y inscrit
  (§5.3, IN-2 à IN-5) ? Où va le bouton, quand vient l'avertissement « Très demandée », faut-il
  confirmer la désinscription, que montre la fiche quand on ne peut pas s'inscrire, et comment
  se présente une partie double ?
  Ticket « Fiche d'une partie et geste d'inscription » (#63), carte « Front office mobile » (#42).

  Trois variantes, basculables par la barre (← →) ; le cas par ↑ ↓. Le réseau et les libellés
  se changent dans la barre, pour tous les cas. Rien n'est enregistré : tout vit en mémoire.
  La coquille reprend la variante retenue (#51), et la vue du MJ celle de #54.

    A « Barre en bas »          : bouton fixé en bas ; confirmation avant de s'inscrire à une partie très demandée.
    B « Inscription en tête »   : encart en haut (créneau, compteur, avertissements, bouton) ; avertissement après, dans l'encart.
    C « Bouton en fin de fiche » : la fiche se lit comme une affiche, le bouton vient à la fin ; avertissement après, par une alerte.

  Verdict : variante A retenue. En plus de la confirmation, une partie qui devient très demandée
  notifie ses inscrits sans autre inscription sur le créneau (NO-2). Détail dans le ticket #63.
-->

<style>
/* Thème sombre seul, comme la charte. Jetons repris de packages/design/tokens.css. */
/* Jetons repris de packages/design/tokens.css. Échelle typographique du mobile : provisoire, pour le prototype. */
:root {
  color-scheme: dark;
  --surface-0: #151717;
  --surface-1: #1b1e1e;
  --surface-2: #222525;
  --surface-3: #2a2d2d;
  --border: #313535;
  --text: #eceae6;
  --text-muted: #a9a49e;
  --accent: #fc9203;
  --on-accent: #161818;
  --focus: #7cc4e4;
  --success: #6cc08b;
  --warning: #e8d25c;
  --danger: #f07f63;
  --engraving: #3a3e3e;
  --engraving-strong: #626767;
  --initial: #8c837c;
  --emblem-1: #4e4944; --emblem-2: #5e5852; --emblem-3: #6e6862;
  --emblem-4: #7d766f; --emblem-5: #8c837c; --emblem-6: #a39a92;
  --font-display: 'Uncial Antiqua', serif;
  --font-caps: 'Aldrich', sans-serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-hero: 2rem;
  --fs-title: 1.625rem;
  --fs-section: 1.25rem;
  --fs-block: 1.0625rem;
  --fs-body: .9375rem;
  --fs-meta: .8125rem;
  --fs-over: .6875rem;
  --space-xxs: 2px; --space-xs: 4px; --space-s: 8px; --space-m: 12px;
  --space-l: 16px; --space-xl: 24px; --space-xxl: 32px;
  --radius-card: 12px; --radius-control: 8px; --radius-thumb: 6px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0b0c0c; color: var(--text); font: 400 var(--fs-body)/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
svg.i { width: 20px; height: 20px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.over { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .12em; font-size: var(--fs-over); color: var(--text-muted); }
.meta { color: var(--text-muted); font-size: var(--fs-meta); }
.stack { display: grid; gap: var(--space-s); }
.stack-l { display: grid; gap: var(--space-l); }
.pad { padding: var(--space-l); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Scène : téléphone sur ordinateur, plein écran sur téléphone ---------- */
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 16px 16px 96px; }
.notes { width: 320px; flex: none; color: #c9c4be; font: 13px/1.55 system-ui, sans-serif; display: none; }
.notes h2 { font: 600 15px/1.3 system-ui, sans-serif; color: #f1efec; margin: 0 0 6px; }
.notes h3 { font: 600 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #8f8a85; margin: 18px 0 6px; }
.notes p { margin: 0 0 8px; }
.notes .clock { font: 600 28px/1 system-ui, sans-serif; color: #f1efec; font-variant-numeric: tabular-nums; }
@media (min-width: 1000px) { .notes { display: block; } }
.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 120px)); min-height: 600px; border-radius: 46px; overflow: hidden; background: var(--surface-0); display: flex; flex-direction: column; box-shadow: 0 0 0 10px #1c1d1d, 0 0 0 11px #333; }
.statusbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font: 600 15px system-ui, sans-serif; background: var(--surface-1); }
.statusbar .sb-right { font-size: 12px; letter-spacing: .04em; }
.app { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
@media (max-width: 520px) {
  .stage { padding: 0; }
  .phone { width: 100vw; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; border-radius: 0; box-shadow: none; }
  .statusbar { display: none; }
}

/* ---------- Éléments communs ---------- */
.hdr { flex: none; display: flex; align-items: center; gap: var(--space-s); padding: var(--space-xs) var(--space-s) var(--space-xs) var(--space-l); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--space-s); min-width: 0; flex: 1; }
.emblem { width: 28px; height: 28px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.2; flex: 1; min-width: 0; }
.pseudo { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border); font-weight: 600; font-size: var(--fs-meta); flex: none; max-width: 150px; }
.pseudo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pseudo svg { width: 18px; height: 18px; color: var(--text-muted); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; flex: none; }
.icon-btn:hover { background: var(--surface-3); }

.bandeau { flex: none; display: flex; gap: var(--space-s); align-items: flex-start; width: 100%; min-height: 44px; padding: var(--space-s) var(--space-l); background: color-mix(in srgb, var(--warning) 14%, var(--surface-1)); border-bottom: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; text-align: left; }
.bandeau svg { width: 18px; height: 18px; color: var(--warning); margin-top: 1px; }
.bandeau .chev { margin-left: auto; color: var(--text-muted); }
.bandeau.bottom { border-bottom: 0; border-top: 1px solid var(--border); }

.tabbar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-1); border-top: 1px solid var(--border); padding-bottom: max(env(safe-area-inset-bottom), 8px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: var(--text-muted); font-size: .75rem; font-weight: 600; text-align: center; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--radius-control); font-weight: 600; font-size: var(--fs-body); border: 1px solid transparent; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface-3); border-color: var(--border); }
.btn-ghost { color: var(--accent); padding: 0 var(--space-s); }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--text-muted); }
.badge svg { width: 14px; height: 14px; }
.t-ok { color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface-2)); }
.t-warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, var(--surface-2)); }
.t-danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface-2)); }
.t-accent { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.t-neutral { color: var(--text); background: var(--surface-3); }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-xs); }

.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-card); }
.section-title { font-size: var(--fs-section); font-weight: 600; }
.block-title { font-size: var(--fs-block); font-weight: 600; line-height: 1.25; }

/* Illustration par défaut : motif gravé et lettrine, sur le tiers droit et dans le haut. */
.ill { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: var(--radius-card); background: var(--surface-2); border: 1px solid var(--border); width: 100%; display: block; text-align: left; }
.ill > svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, color-mix(in srgb, var(--surface-0) 94%, transparent) 82%); }
.ill-text { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--space-l); z-index: 1; display: grid; gap: var(--space-xs); }
.ill .corner { position: absolute; top: var(--space-m); left: var(--space-m); z-index: 1; }
.thumb { width: 44px; height: 44px; flex: none; border-radius: var(--radius-thumb); background: var(--surface-3); }
.lettrine { font-family: var(--font-display); fill: var(--initial); }

/* Ligne de partie */
.row { position: relative; display: flex; gap: var(--space-m); align-items: flex-start; padding: var(--space-m) var(--space-l); border-bottom: 1px solid var(--border); }
.row-hit { position: absolute; inset: 0; z-index: 0; }
.row-hit:focus-visible { outline-offset: -2px; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; pointer-events: none; }
.row-title { font-weight: 600; font-size: var(--fs-block); line-height: 1.25; }
.row-side { position: relative; z-index: 1; flex: none; align-self: center; }
.toggle { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-3); color: var(--text); }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.toggle:disabled { opacity: .55; cursor: default; }

.slot-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: var(--space-s); padding: var(--space-s) var(--space-l); background: var(--surface-1); border-bottom: 1px solid var(--border); min-height: 44px; }
.slot-head .over { color: var(--text); }

.status { display: flex; gap: var(--space-s); align-items: flex-start; }
.status svg { width: 18px; height: 18px; margin-top: 1px; }
.tone-ok { color: var(--success); } .tone-warn { color: var(--warning); } .tone-accent { color: var(--accent); } .tone-muted { color: var(--text-muted); } .tone-neutral { color: var(--text); }
.past { opacity: .55; }
.empty { display: grid; justify-items: center; gap: var(--space-s); text-align: center; padding: var(--space-xxl) var(--space-l); color: var(--text-muted); }
.empty svg.eng { width: 120px; height: 120px; }

/* Cartes d'état (héros) */
.hero { position: relative; overflow: hidden; display: grid; gap: var(--space-s); padding: var(--space-l); width: 100%; text-align: left; }
.hero .eng-bg { position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; pointer-events: none; }
.hero > * { position: relative; }
.hero-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.hero-table { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-hero); line-height: 1.1; }
.hero.warn { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
.hero.flat { border-left: 4px solid var(--accent); }
.hero.flat.warn { border-left-color: var(--warning); }
.hero.flat.ok { border-left-color: var(--success); }
.left-list { display: grid; gap: 1px; background: var(--border); border-radius: var(--radius-control); overflow: hidden; margin-top: var(--space-xs); }
.left-item { display: flex; align-items: center; gap: var(--space-m); padding: var(--space-s) var(--space-m); background: var(--surface-3); min-height: 52px; width: 100%; text-align: left; }
.left-item > div { flex: 1; min-width: 0; }
.counts { display: grid; grid-template-columns: 1fr; gap: var(--space-xs); margin-top: var(--space-xs); }
.counts > div { background: var(--surface-3); border-radius: var(--radius-control); padding: var(--space-s) var(--space-m); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-s); }
.counts strong { font-size: var(--fs-body); }

/* A : puces de créneau */
.chips { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-xs); padding: var(--space-s) var(--space-l); background: var(--surface-0); border-bottom: 1px solid var(--border); }
.chip { display: grid; justify-items: center; gap: 1px; min-height: 48px; padding: var(--space-xs); border-radius: var(--radius-control); background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; }
.chip .over { font-size: .625rem; }
.chip[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.chip[aria-selected="true"] .over { color: var(--accent); }
.state-line { display: flex; align-items: center; gap: var(--space-s); padding: var(--space-m) var(--space-l) 0; }
/* Écran d'attente */
.closed { position: relative; min-height: 100%; display: grid; align-content: center; justify-items: center; gap: var(--space-l); padding: var(--space-xxl) var(--space-xl); text-align: center; overflow: hidden; }
.closed > * { position: relative; }
.closed .eng-closed { position: absolute; width: 520px; height: 520px; top: 50%; left: 50%; translate: -50% -50%; }
.emblem-big { width: 96px; height: 96px; }
.closed-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); }

/* Fiche (ébauche commune) et superpositions */
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--surface-0); animation: slide-in 160ms ease-out; }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
.sheet-bar { flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xs) var(--space-s); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet-actions { flex: none; display: grid; gap: var(--space-s); padding: var(--space-m) var(--space-l) max(env(safe-area-inset-bottom), var(--space-m)); background: var(--surface-1); border-top: 1px solid var(--border); }
.fiche-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.warn-note { display: flex; gap: var(--space-s); color: var(--warning); font-size: var(--fs-meta); font-weight: 600; }
.warn-note svg { width: 18px; height: 18px; }
.cw { padding: var(--space-m); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-control); display: grid; gap: var(--space-xs); }
.scrim { position: absolute; inset: 0; z-index: 29; background: color-mix(in srgb, var(--surface-0) 72%, transparent); animation: fade-in 140ms ease-out; }
.menu { --menu-edge: color-mix(in srgb, var(--accent) 60%, var(--border)); position: absolute; z-index: 30; top: 62px; right: var(--space-s); width: 264px; padding: var(--space-l); display: grid; gap: var(--space-s); background: var(--surface-3); border: 1px solid var(--menu-edge); border-radius: var(--radius-card); animation: pop-in 140ms ease-out; transform-origin: top right; }
.menu::before { content: ''; position: absolute; top: -7px; right: 52px; width: 12px; height: 12px; background: var(--surface-3); border-left: 1px solid var(--menu-edge); border-top: 1px solid var(--menu-edge); rotate: 45deg; }
.menu .btn-secondary { background: var(--surface-2); }
.pseudo[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.pseudo[aria-expanded="true"] svg { color: var(--accent); }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
@keyframes fade-in { from { opacity: 0; } }
.toast { position: absolute; z-index: 40; left: var(--space-l); right: var(--space-l); bottom: 84px; padding: var(--space-m) var(--space-l); background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-control); font-size: var(--fs-meta); }
.toast strong { display: block; color: var(--text); font-size: var(--fs-body); }

/* ---------- Barre du prototype : hors du design évalué ---------- */
.switcher { position: fixed; left: 50%; bottom: 14px; translate: -50% 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 6px; max-width: calc(100vw - 16px); background: #f4f4f4; color: #111; border-radius: 24px; box-shadow: 0 8px 28px rgba(0, 0, 0, .55); font: 600 13px/1 system-ui, sans-serif; }
.switcher button, .switcher select { font: inherit; color: #111; background: #e2e2e2; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.switcher select { max-width: 330px; }
.switcher .label { padding: 0 6px; min-width: 180px; text-align: center; }
.switcher label { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; }
.switcher .sep { width: 1px; height: 22px; background: #c8c8c8; }
.switcher :focus-visible { outline: 2px solid #1a6bb0; outline-offset: 2px; }
.switcher .sw-toggle { display: none; }
@media (max-width: 520px) {
  .switcher { top: calc(6px + env(safe-area-inset-top, 0px)); bottom: auto; border-radius: 16px; }
  .switcher .sw-toggle { display: inline-block; }
  .switcher.collapsed { padding: 4px; }
  .switcher.collapsed > :not(.sw-toggle) { display: none; }
}

/* ---------- Vue du MJ ---------- */
.mj-card { display: grid; gap: var(--space-m); padding: var(--space-l); scroll-margin-top: var(--space-s); }
.mj-head { display: flex; gap: var(--space-m); align-items: flex-start; }
.mj-head > div { flex: 1; min-width: 0; display: grid; gap: 2px; justify-items: start; }
.mj-panel { display: grid; gap: var(--space-m); padding: var(--space-l); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }
.roster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-xs); }
.roster li { display: flex; align-items: center; gap: var(--space-s); min-width: 0; padding: var(--space-s); background: var(--surface-3); border-radius: var(--radius-control); font-weight: 600; }
.roster li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ini { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-1); border: 1px solid var(--engraving-strong); font-family: var(--font-display); color: var(--initial); }
.lead-note { display: flex; gap: var(--space-s); align-items: flex-start; margin: var(--space-m) var(--space-l) 0; padding: var(--space-m); background: color-mix(in srgb, var(--accent) 10%, var(--surface-1)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: var(--radius-control); font-size: var(--fs-meta); }
.lead-note svg { width: 18px; height: 18px; color: var(--accent); margin-top: 1px; }
.lead-note.warn { background: color-mix(in srgb, var(--warning) 12%, var(--surface-1)); border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); }
.lead-note.warn svg { color: var(--warning); }
.chip .lead { color: var(--accent); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 45% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }
.alert { position: absolute; z-index: 35; left: var(--space-s); right: var(--space-s); bottom: 80px; display: flex; gap: var(--space-xs); align-items: center; padding: var(--space-m) var(--space-xs) var(--space-m) var(--space-m); background: var(--surface-3); border: 1px solid color-mix(in srgb, var(--accent) 60%, var(--border)); border-radius: var(--radius-card); animation: pop-in 140ms ease-out; }
.alert > div { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: var(--fs-meta); color: var(--text-muted); }

// « de » devant un titre : du, des, de la, d'.
function deTitle(t) {
  if (/^Le /.test(t)) return 'du ' + t.slice(3);
  if (/^Les /.test(t)) return 'des ' + t.slice(4);
  if (/^La /.test(t)) return 'de la ' + t.slice(3);
  if (/^L'/.test(t)) return "de l'" + t.slice(2);
  return /^[AEIOUYÉÈÊÀÂÎÔH]/i.test(t) ? "d'" + t : 'de ' + t;
}

/* ================= Règles (simplifiées) ================= */
const slotState = (n) => (C().slots ?? OPEN)[n - 1];
function timeOf(n, double) {
  const s = SLOTS[n - 1].s, e = (double ? SLOTS[n] : SLOTS[n - 1]).e, c = clock();
  return c < s ? 'upcoming' : c < e ? 'current' : 'past';
}
const covers = (g, n) => g.slot === n || (g.double && g.slot + 1 === n);
const gamesOn = (n) => GAMES.filter((g) => covers(g, n));
const isMine = (g) => g.mj === S.who;
const leadOn = (n) => gamesOn(n).find(isMine);
const slotName = (n, double) => (double ? `Créneaux ${n} et ${n + 1}` : `Créneau ${n}`);
const slotRange = (n, double) => `${SLOTS[n - 1].start} – ${(double ? SLOTS[n] : SLOTS[n - 1]).end}`;
const inscrits = (g) => g.others + (S.signups.has(g.id) ? 1 : 0);
const over = (g) => slotState(g.slot) !== 'published' && inscrits(g) > g.max;
const placesTxt = (g) => (S.variant === 'B' && g.min < g.max ? `${g.min} à ${g.max} places` : plural(g.max, 'place'));
function counter(g) {
  if (slotState(g.slot) === 'published') return `${plural(g.players, 'joueur')} · ${placesTxt(g)}`;
  const k = inscrits(g);
  return `${k ? plural(k, 'inscrit') : 'Aucun inscrit'} · ${placesTxt(g)}`;
}
const tresDemandee = (g) => (over(g) ? badge('warn', 'triangle-alert', 'Très demandée') : '');
// La partie double publiée où l'on joue, et qui occupe le créneau n, son second créneau.
const doubleHolding = (n) => GAMES.find((d) => d.double && d.slot + 1 === n && slotState(d.slot) === 'published' && S.results[d.slot] === d.id);

// Ce que le créneau n est pour la personne.
function mine(n) {
  const st = slotState(n), lg = leadOn(n);
  if (lg) return { kind: 'leads', game: lg, st };
  const d = doubleHolding(n);
  if (d) return { kind: 'assigned', game: d, cont: true };
  const signups = GAMES.filter((g) => g.slot === n && S.signups.has(g.id));
  if (st === 'published') {
    const r = S.results[n];
    if (r && r !== 'none') return { kind: 'assigned', game: G(r) };
    return { kind: signups.length ? 'unassigned' : 'closed' };
  }
  return { kind: st === 'drawing' ? 'pending' : 'open', signups };
}

// Pourquoi on ne peut pas s'inscrire à g, ou null.
function blocker(g) {
  if (isMine(g)) return { kind: 'mine' };
  for (const n of g.double ? [g.slot, g.slot + 1] : [g.slot]) {
    const lg = leadOn(n);
    if (lg) return { kind: 'leads', n, lg };
    const d = doubleHolding(n);
    if (d && d.id !== g.id) return { kind: 'held', d };
  }
  const st = slotState(g.slot);
  if (st === 'drawing') return { kind: 'drawing' };
  if (st === 'published') return { kind: 'published', m: mine(g.slot) };
  return null;
}

/* ================= Morceaux communs ================= */
function initialOf(title) {
  const words = title.trim().split(/\s+/);
  let w = words[0];
  if (/^l['’]/i.test(w)) w = w.slice(2);
  else if (['le', 'la', 'les', 'un', 'une', 'des', 'the', 'a', 'an'].includes(w.toLowerCase()) && words[1]) w = words[1];
  return w.charAt(0).toLocaleUpperCase('fr');
}

function slotBadge(n) {

  if (st === 'open') return badge('accent', 'circle-check', 'Inscriptions ouvertes');
  if (st === 'drawing') return badge('neutral', 'hourglass', 'Tirage en cours');

}

/* ================= Accueil ================= */
function mineLine(n) {
  const m = mine(n), g = m.game;
  switch (m.kind) {
    case 'leads': return { tone: 'accent', ic: 'book-open', label: `Tu mènes à la table ${g.table}`, detail: `${g.title} · ${counter(g)}`, act: 'fiche', id: g.id };
    case 'assigned': return { tone: 'ok', ic: 'circle-check', label: `Table ${g.table}`, detail: `${g.title}, avec ${g.mj}`, act: 'fiche', id: g.id };
    case 'unassigned': return { tone: 'warn', ic: 'triangle-alert', label: 'Pas de place pour toi', detail: '', act: 'goto-prog', n };
    case 'pending': return { tone: 'neutral', ic: 'hourglass', label: 'Tirage en cours', detail: m.signups.length ? listFr(m.signups.map((x) => x.title)) : 'Aucune inscription', act: 'goto-prog', n };
    case 'open': return m.signups.length
      ? { tone: 'accent', ic: 'circle-check', label: plural(m.signups.length, 'inscription'), detail: listFr(m.signups.map((x) => x.title)), act: 'goto-prog', n }
      : { tone: 'muted', ic: 'plus', label: 'Aucune inscription', detail: 'Choisir une partie', act: 'goto-prog', n };
    default: return { tone: 'muted', ic: 'circle-check', label: 'Tirage publié', detail: 'Aucune inscription sur ce créneau', act: 'goto-prog', n };
  }
}
const firstSlot = () => SLOTS.find((s) => timeOf(s.n) !== 'past')?.n ?? 4;
function accueil() {
  const pub = [4, 3, 2, 1].find((n) => { const m = mine(n); return slotState(n) === 'published' && m.kind === 'assigned' && !m.cont && timeOf(n, m.game.double) !== 'past'; });
  const pend = pub ? null : [1, 2, 3, 4].find((n) => { const m = mine(n); return m.kind === 'pending' && m.signups.length && timeOf(n) !== 'past'; });
  let hero, skip = [];
  if (pub) {
    const g = mine(pub).game;
    skip = g.double ? [pub, pub + 1] : [pub];
    hero = `<button class="ill" data-act="fiche" data-id="${g.id}">${art(g)}<span class="corner">${whenBadge(g)}</span>
      <span class="ill-text"><span class="over">${slotName(pub, g.double)} · ${slotRange(pub, g.double)}</span><span class="hero-table">Table ${g.table}</span>
      <span>Tu joues à <strong>${g.title}</strong>, avec ${g.mj}.</span><span class="meta">${g.system}</span></span></button>`;
  } else if (pend) {
    skip = [pend];
    hero = `<section class="card hero">${engraving('eng-bg')}<span class="over">${slotName(pend)} · ${slotRange(pend)}</span>
      <h2 class="hero-title">Tirage en cours</h2><p>Tes inscriptions comptent pour ce tirage : ${listFr(mine(pend).signups.map((g) => g.title))}.</p></section>`;
  } else {
    hero = `<section class="card hero">${engraving('eng-bg')}<span class="over">Inscriptions ouvertes</span>
      <h2 class="hero-title">Choisis tes parties</h2><p>Chaque créneau est tiré au sort peu avant son début.</p>
      <div><button class="btn btn-primary" data-act="goto-prog" data-n="${firstSlot()}">${icon('calendar')}Voir le programme</button></div></section>`;
  }
  const next = SLOTS.filter((s) => timeOf(s.n) !== 'past' && !skip.includes(s.n));
  return `<div class="pad stack-l">${hero}
    ${next.length ? `<section class="stack"><h2 class="section-title">Ton programme</h2>
      <ul class="card" style="overflow:hidden">${next.map((s) => { const l = mineLine(s.n); return `<li style="border-bottom:1px solid var(--border)"><button class="row" style="border:0;width:100%;text-align:left" data-act="${l.act}" data-id="${l.id ?? ''}" data-n="${s.n}"><div class="row-main"><span class="over">${slotName(s.n)} · ${s.start}</span>${status(l.tone, l.ic, l.label, l.detail)}</div>${icon('chevron-right', 'i tone-muted')}</button></li>`; }).join('')}</ul></section>` : ''}
  </div>`;
}

/* ================= Programme ================= */
function bigGameCard(g, cont) {
  const badges = [];
  const r = mine(g.slot);
  if (S.signups.has(g.id) && slotState(g.slot) !== 'published') badges.push(badge('accent', 'check', 'Inscrit'));
  if (r.kind === 'assigned' && r.game.id === g.id) badges.push(badge('ok', 'circle-check', 'Ta table'));
  if (isMine(g)) badges.push(badge('accent', 'book-open', 'Tu mènes'));
  if (g.double) badges.push(badge('neutral', 'clock', `Double · créneaux ${g.slot} et ${g.slot + 1}`));
  return `<button class="ill" data-act="fiche" data-id="${g.id}">${art(g)}
    ${badges.length ? `<span class="corner badges">${badges.join('')}</span>` : ''}
    <span class="ill-text"><span class="over">Table ${g.table}${cont ? ` · commence au créneau ${g.slot}` : ''}</span><span class="block-title">${g.title}</span>
    <span class="meta">${g.system} · avec ${g.mj}</span>
    <span class="badges" style="align-items:center"><span class="meta num">${counter(g)}</span>${tresDemandee(g)}</span></span></button>`;
}
const contRow = (g) => `<button class="cont-row" data-act="fiche" data-id="${g.id}">${thumb(g, 40)}<div><span class="over">Suite de la partie double</span><span style="font-weight:600">${g.title}</span><span class="meta">Table ${g.table} · commence au créneau ${g.slot}</span></div>${icon('chevron-right', 'i tone-muted')}</button>`;
function programme() {
  const n = S.progSlot ?? firstSlot();
  const shown = SLOTS.filter((s) => timeOf(s.n) !== 'past');
  const lg = leadOn(n), d = doubleHolding(n);
  let note = '';
  if (lg) note = `<p class="lead-note">${icon('book-open')}<span>Tu mènes <strong>${lg.title}</strong> à la table ${lg.table}${lg.slot !== n ? ` (créneaux ${lg.slot} et ${lg.slot + 1})` : ''} : tu ne peux pas t'inscrire comme joueur sur ce créneau.</span></p>`;
  else if (d) note = `<p class="lead-note">${icon('circle-check')}<span>Tu joues à <strong>${d.title}</strong> sur les créneaux ${d.slot} et ${d.slot + 1} : tu ne peux pas t'inscrire sur ce créneau.</span></p>`;
  const own = GAMES.filter((g) => g.slot === n), cont = GAMES.filter((g) => g.double && g.slot + 1 === n);
  let cards = own.map((g) => bigGameCard(g)).join('');
  if (S.variant === 'A') cards += cont.map((g) => bigGameCard(g, true)).join('');
  if (S.variant === 'C') cards += cont.map(contRow).join('');
  return `<div class="chips" role="tablist" aria-label="Créneaux" style="grid-template-columns:repeat(${shown.length}, 1fr)">${shown.map((s) => `<button class="chip" role="tab" data-act="prog-slot" data-n="${s.n}" aria-selected="${s.n === n}"><span class="over">Créneau ${s.n}</span><span class="num">${leadOn(s.n) ? icon('book-open', 'i lead') : ''} ${s.start}</span></button>`).join('')}</div>
    <div class="state-line"><span class="meta num">${slotRange(n)}</span>${slotBadge(n)}</div>${note}
    <div class="pad stack-l">${cards}</div>`;
}

/* ================= Mes parties ================= */
function mesParties() {
  const item = (g, inner, side = icon('chevron-right', 'i tone-muted')) => `<button class="mine-item" data-act="fiche" data-id="${g.id}">${thumb(g, 36)}<div>${inner}</div>${side}</button>`;
  return `<div class="stack">${SLOTS.filter((s) => timeOf(s.n) !== 'past').map((s) => {
    const n = s.n, m = mine(n), g = m.game;
    let content;
    if (m.kind === 'leads') content = item(g, status('accent', 'book-open', `Tu mènes à la table ${g.table}`, `${g.title} · ${counter(g)}`), tresDemandee(g));
    else if (m.kind === 'assigned') content = item(g, status('ok', 'circle-check', `Table ${g.table}`, `${g.title}, avec ${g.mj}${m.cont ? ' · partie double' : ''}`));
    else if (m.kind === 'unassigned') content = `<div class="mine-item">${status('warn', 'triangle-alert', 'Pas de place pour toi', 'Les parties que tu avais choisies sont complètes.')}</div>`;
    else if (m.signups?.length) content = m.signups.map((x) => item(x, `<div style="font-weight:600">${x.title}</div><div class="meta num">Table ${x.table} · ${counter(x)}</div>`, m.kind === 'pending' ? icon('lock', 'i tone-muted') : tresDemandee(x) || icon('chevron-right', 'i tone-muted'))).join('');
    else if (m.kind === 'open') content = `<div class="mine-item" style="justify-content:space-between"><span class="meta">Aucune inscription</span><button class="btn btn-ghost" data-act="goto-prog" data-n="${n}">Choisir une partie</button></div>`;
    else content = `<div class="mine-item"><span class="meta">Aucune inscription sur ce créneau</span></div>`;
    return `<section id="slot-${n}"><div class="slot-head"><span class="over">${slotName(n)} · ${slotRange(n)}</span>${slotBadge(n)}</div><div class="pad stack" style="padding-block:var(--space-s)">${content}</div></section>`;
  }).join('')}</div>`;
}

/* ================= Fiche : le geste, ou ce qui l'empêche ================= */
function blockHTML(g, b) {
  const signed = S.signups.has(g.id);
  switch (b.kind) {
    case 'mine': {
      const st = slotState(g.slot);
      const detail = st === 'published' ? 'Tes joueurs sont dans Mes parties.' : st === 'drawing' ? 'Tirage en cours : tes joueurs s\'afficheront dans Mes parties à la publication.' : `${counter(g)}. Tes joueurs s'afficheront dans Mes parties à la publication du tirage.`;
      return `${status('accent', 'book-open', 'Tu mènes cette partie', detail)}<button class="btn btn-secondary btn-block" data-act="mes" data-n="${g.slot}">${icon('dices')}Voir dans Mes parties</button>`;
    }
    case 'leads': return status('accent', 'book-open', b.n === g.slot ? 'Tu mènes une partie sur ce créneau' : `Tu mènes une partie au créneau ${b.n}`,
      b.n === g.slot ? `${b.lg.title}, table ${b.lg.table} : tu ne peux pas t'inscrire comme joueur sur ce créneau.` : `${b.lg.title}, table ${b.lg.table} : tu ne peux pas t'inscrire à cette partie double, qui occupe aussi le créneau ${b.n}.`);
    case 'held': return `${status('ok', 'circle-check', `Tu joues aux créneaux ${b.d.slot} et ${b.d.slot + 1}`, `${b.d.title}, table ${b.d.table} : tu ne peux pas t'inscrire sur ce créneau.${signed ? ' Ton inscription à cette partie ne compte plus.' : ''}`)}
      <button class="btn btn-secondary btn-block" data-act="fiche" data-id="${b.d.id}">Voir ta partie</button>`;
    case 'drawing': return status('neutral', 'hourglass', 'Tirage en cours', `Les inscriptions du créneau ${g.slot} sont fermées.${signed ? ' Ton inscription compte pour ce tirage.' : ''}`);
    case 'published': {
      const m = b.m;
      if (m.kind === 'assigned' && m.game.id === g.id) return status('ok', 'circle-check', 'Tu joues à cette table', `Table ${g.table} · début à ${SLOTS[g.slot - 1].start}`);
      if (m.kind === 'assigned') return `${status('neutral', 'circle-check', 'Tirage publié', `Tu joues à la table ${m.game.table} : ${m.game.title}.`)}<button class="btn btn-secondary btn-block" data-act="fiche" data-id="${m.game.id}">Voir ta partie</button>`;
      if (m.kind === 'unassigned') return status('warn', 'triangle-alert', 'Pas de place pour toi', 'Tirage publié : les parties que tu avais choisies sont complètes.');
      return status('muted', 'circle-check', 'Tirage publié', `Les inscriptions du créneau ${g.slot} sont fermées.`);
    }
  }
}
// compact : la barre fixe de A, sur une ligne quand on est inscrit.
function zone(g, compact) {
  const b = blocker(g);
  if (b) return blockHTML(g, b);
  const L = LABELS[S.labels], busy = S.busy === g.id, spin = '<span class="spinner" aria-hidden="true"></span>';
  const busyAttr = busy ? 'aria-busy="true"' : '';
  if (S.signups.has(g.id)) {
    const off = `<button class="btn btn-secondary ${compact ? '' : 'btn-block'}" data-act="unsub" data-id="${g.id}" ${busyAttr}>${busy ? spin : ''}${L.off}</button>`;
    return compact
      ? `<div class="bar-split"><span class="status tone-accent">${icon('circle-check')}Inscription enregistrée</span>${off}</div>`
      : `${status('accent', 'circle-check', 'Inscription enregistrée', `Le tirage du créneau ${g.slot} a lieu peu avant ${SLOTS[g.slot - 1].start}.`)}${off}`;
  }
  return `<button class="btn btn-primary btn-block" data-act="signup" data-id="${g.id}" ${busyAttr}>${busy ? spin : icon('plus')}${L.on}</button>`;
}
const box = (tone, ic, html) => `<div class="box ${tone}">${icon(ic)}<div>${html}</div></div>`;
// Ce que deviennent les inscriptions du second créneau d'une partie double (TI-3).
function doubleNote(g) {
  if (!g.double || blocker(g)) return '';
  const n2 = g.slot + 1, other = GAMES.filter((x) => x.slot === n2 && S.signups.has(x.id));
  if (S.variant === 'B') return box('', 'info', `<p>Partie double, sur les créneaux ${g.slot} et ${n2}. Si tu y as une place, tes inscriptions au créneau ${n2} ne comptent plus.</p>`);
  if (S.variant === 'C' && other.length) return box('', 'info', `<p>Tu as aussi ${other.length > 1 ? 'des inscriptions' : 'une inscription'} au créneau ${n2} : ${listFr(other.map((x) => x.title))}. Si tu as une place ici, ${other.length > 1 ? 'elles ne compteront pas' : 'elle ne comptera pas'}.</p>`);
  return '';
}
// B : après l'inscription à une partie très demandée, l'encart montre les autres parties du créneau.
function afterWarn(g) {
  if (S.variant !== 'B' || S.after !== g.id || !S.signups.has(g.id) || !over(g)) return '';
  const others = GAMES.filter((x) => x.slot === g.slot && x.id !== g.id && !isMine(x)).sort((a, b) => over(a) - over(b));
  return box('warn', 'triangle-alert', `<p><strong>Partie très demandée</strong><br>${plural(inscrits(g), 'inscrit')} pour ${plural(g.max, 'place')} : tu risques de ne pas avoir de place. Inscris-toi aussi à une autre partie du créneau ${g.slot}.</p>
    <div class="left-list">${others.map((x) => `<button class="left-item" data-act="fiche" data-id="${x.id}">${thumb(x, 36)}<div><div style="font-weight:600">${x.title}</div><div class="meta num">${counter(x)}</div></div>${S.signups.has(x.id) ? badge('accent', 'check', 'Inscrit') : over(x) ? badge('warn', 'triangle-alert', 'Très demandée') : icon('chevron-right', 'i tone-muted')}</button>`).join('')}</div>`);
}

/* ================= Fiche : les trois variantes ================= */
const ficheBar = (g) => `<div class="sheet-bar"><button class="icon-btn" data-act="back" aria-label="Retour">${icon('chevron-left')}</button><span class="over">${slotName(g.slot, g.double)} · table ${g.table}</span></div>${staleLine()}`;
const pitch = (g) => `<p>${g.pitch ?? `Une partie de ${g.system}, de ${g.min} à ${g.max} joueurs. (Présentation fictive du prototype.)`}</p>`;
const cw = (g) => (g.warnings ? `<div class="cw"><span class="over">Avertissements de contenu</span><p>${g.warnings}</p></div>` : '');
const slotLine = (g) => `<p class="meta num">${slotName(g.slot, g.double)} · ${slotRange(g.slot, g.double)} · table ${g.table}</p>`;
const counterLine = (g) => `<div class="badges" style="align-items:center"><span class="meta num">${counter(g)}</span>${tresDemandee(g)}${g.double ? badge('neutral', 'clock', 'Partie double') : ''}</div>`;

function ficheA(g) {
  return `${ficheBar(g)}<div class="scroll" data-sid="fA-${g.id}"><div class="pad stack-l">
    <div class="ill">${art(g)}</div>
    <div class="stack"><h1 class="fiche-title">${g.title}</h1><p class="meta">${g.system} · avec ${g.mj}</p>${slotLine(g)}${counterLine(g)}</div>
    ${cw(g)}${pitch(g)}${doubleNote(g)}</div></div>
    <div class="sheet-actions">${zone(g, true)}</div>`;
}
function ficheB(g) {
  return `${ficheBar(g)}<div class="scroll" data-sid="fB-${g.id}"><div class="pad stack-l">
    <div class="b-head">${thumb(g, 64)}<div class="stack" style="gap:2px"><h1 class="fiche-title">${g.title}</h1><p class="meta">${g.system} · avec ${g.mj}</p></div></div>
    <section class="card panel">${slotLine(g)}${counterLine(g)}${cw(g)}${doubleNote(g)}${zone(g)}${afterWarn(g)}</section>
    <h2 class="over">Présentation</h2>${pitch(g)}<div class="ill">${art(g)}</div></div></div>`;
}
function ficheC(g) {
  return `${ficheBar(g)}<div class="scroll" data-sid="fC-${g.id}"><div class="ill poster">${art(g)}<span class="ill-text"><span class="over">${slotName(g.slot, g.double)} · ${slotRange(g.slot, g.double)}</span><h1 class="fiche-title">${g.title}</h1><span class="meta">${g.system} · avec ${g.mj} · table ${g.table}</span></span></div>
    <div class="pad stack-l">${pitch(g)}
    <section class="stack-l c-end"><h2 class="section-title">Inscription</h2>${counterLine(g)}${cw(g)}${doubleNote(g)}${zone(g)}</section></div></div>`;
}

function renderConfirm() {
  const c = S.confirm, g = G(c.id), L = LABELS[S.labels];
  if (c.kind === 'tres') return `<div class="scrim" data-act="dismiss"></div><section class="dialog warn" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t">${icon('triangle-alert', 'i tone-warn')}Partie très demandée</h2>
    <p>${g.title} a déjà ${plural(inscrits(g), 'inscrit')} pour ${plural(g.max, 'place')} : tu risques de ne pas avoir de place. Inscris-toi aussi à d'autres parties du créneau ${g.slot}, pour avoir plus de chances de jouer.</p>
    <button class="btn btn-primary btn-block" data-act="confirm-tres" data-id="${g.id}">${L.anyway}</button>
    <button class="btn btn-secondary btn-block" data-act="goto-prog" data-n="${g.slot}">Voir les autres parties</button>
    <button class="btn btn-ghost btn-block" data-act="dismiss">Annuler</button></section>`;
  return `<div class="scrim" data-act="dismiss"></div><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t">${L.off} ${deTitle(g.title)} ?</h2>
    <p>Tu pourras te réinscrire tant que le tirage du créneau ${g.slot} n'est pas lancé.</p>
    <button class="btn btn-primary btn-block" data-act="confirm-unsub" data-id="${g.id}">${L.off}</button>
    <button class="btn btn-ghost btn-block" data-act="dismiss">Annuler</button></section>`;
}
// Sur une fiche sans barre fixe (B, C), l'alerte descend en bas de l'écran.
const renderAlert = () => { const a = S.alert, low = S.fiches.length && S.variant !== 'A' ? 'low' : ''; return `<div class="alert ${a.tone ?? ''} ${low}" role="alert"><div><strong>${a.title}</strong>${a.text ? `<span>${a.text}</span>` : ''}</div>
  ${a.btn ? `<button class="btn btn-ghost" data-act="${a.btn.act}" data-id="${a.btn.id ?? ''}" data-n="${a.btn.n ?? ''}">${a.btn.label}</button>` : ''}<button class="icon-btn" data-act="alert-close" aria-label="Fermer l'alerte">${icon('x')}</button></div>`; };

/* ================= Le geste, contre un serveur fictif ================= */
function send(id, on) {
  S.busy = id; S.alert = null; S.confirm = null; render();
  clearTimeout(timer);
  const finish = (fn) => { S.busy = null; fn(); render(); };
  if (S.net === 'off') timer = setTimeout(() => finish(() => { S.alert = { tone: 'danger', title: "Pas de connexion : rien n'a été enregistré." }; }), 600);
  else if (S.net === 'slow') timer = setTimeout(() => finish(() => { apply(id, on, true); S.alert = { tone: 'warn', title: 'Le réseau ne répond pas : vérifie ton inscription.' }; }), 10000);
  else timer = setTimeout(() => finish(() => apply(id, on)), 450);
}
// quiet : relecture après un délai dépassé, sans les suites de la variante.
function apply(id, on, quiet) {
  const g = G(id), L = LABELS[S.labels];
  if (on) S.signups.add(id); else S.signups.delete(id);
  S.after = null;
  if (quiet) return;
  if (on && over(g)) {
    if (S.variant === 'B') S.after = id;
    if (S.variant === 'C') S.alert = { tone: 'warn', title: 'Partie très demandée', text: `${plural(inscrits(g), 'inscrit')} pour ${plural(g.max, 'place')} : tu risques de ne pas avoir de place. Inscris-toi aussi à d'autres parties du créneau ${g.slot}.`, btn: { label: 'Voir le créneau', act: 'goto-prog', n: g.slot } };
  }
  if (!on && S.variant === 'C') S.alert = { tone: 'neutral', title: 'Inscription retirée', text: g.title, btn: { label: L.resub, act: 'resub', id } };
}

/* ================= Rendu ================= */
const app = document.getElementById('app');
function frTypography(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    n.nodeValue = n.nodeValue
      .replace(/« /g, '« ').replace(/ »/g, ' »')
      .replace(/ ([;!?])/g, ' $1').replace(/ :/g, ' :')
      .replace(/(\d) h (\d\d)/g, '$1 h $2').replace(/(\d) h\b/g, '$1 h')
      .replace(/ – /g, ' – ')
      .replace(/(\d) (?=[A-Za-zÀ-ÿ])/g, '$1 ');
  }
}
function render() {
  const saved = {};
  app.querySelectorAll('[data-sid]').forEach((el) => { saved[el.dataset.sid] = el.scrollTop; });
  const body = { accueil, programme, mes: mesParties }[S.tab]();
  let html = `${header()}${staleLine()}<div class="scroll" data-sid="${S.variant}-${S.tab}-${S.progSlot}">${body}</div>${tabbar(S.tab)}`;
  const top = S.fiches.at(-1);
  if (top) { const g = G(top); html += `<section class="sheet" role="dialog" aria-modal="true" aria-label="${g.title}">${{ A: ficheA, B: ficheB, C: ficheC }[S.variant](g)}</section>`; }
  if (S.confirm) html += renderConfirm();
  if (S.alert) html += renderAlert();
  app.innerHTML = html;
  frTypography(app);
  app.querySelectorAll('[data-sid]').forEach((el) => { if (saved[el.dataset.sid] != null) el.scrollTop = saved[el.dataset.sid]; });
  if (S.target) {
    const el = app.querySelector('#' + S.target), sc = el?.closest('.scroll');
    if (el && sc) { sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 8; el.classList.add('flash'); }
    S.target = null;
  }
  document.getElementById('sb-time').textContent = fmt(clock()).replace(' h ', ':');
  document.getElementById('sb-net').textContent = S.net === 'off' ? 'Pas de réseau' : S.net === 'slow' ? '4G ▮▭▭ ▭' : '4G ▮▮▮ ▭';
  document.getElementById('sw-label').textContent = `${S.variant} · ${VARIANTS[S.variant].name}`;
  document.getElementById('cas').value = String(S.cas);
  document.getElementById('net').value = S.net;
  renderNotes();
}
function renderNotes() {
  const v = VARIANTS[S.variant];
  const notes = document.getElementById('notes');
  notes.innerHTML = `<h2>${S.variant} · ${v.name}</h2><p>${v.pitch}</p>
    <h3>Ses choix</h3><ul>${v.choices.map((c) => `<li>${c}</li>`).join('')}</ul>
    <h3>Cas</h3><p class="clock">${fmt(clock())}</p><p><strong>${C().label}</strong> · ${S.who}</p><p>${C().note}</p>
    <h3>Commun aux trois</h3><ul>
      <li>Libellés « S'inscrire » et « Se désinscrire », à l'infinitif comme le veut la charte. Le choix « Libellés » de la barre essaie « Je m'inscris ».</li>
      <li>Quand on ne peut pas s'inscrire, la place du bouton dit pourquoi : MJ sur ce créneau, partie double publiée, tirage en cours ou publié.</li>
      <li>Sans réseau, le bouton reste actif ; l'échec donne « Pas de connexion : rien n'a été enregistré. », et après 10 s sans réponse « Le réseau ne répond pas : vérifie ton inscription. » (§6). Le choix « Réseau » vaut pour tous les cas.</li>
      <li>Les inscriptions du second créneau d'une partie double restent : le tirage ne les ignore que si l'on est pris dans la partie double (TI-3).</li></ul>
    <p style="color:#8f8a85">← → : variante · ↑ ↓ : cas.</p>`;
  frTypography(notes);
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const { act, id, n, v } = t.dataset;
  switch (act) {
    case 'tab': S.tab = v; S.fiches = []; S.progSlot = null; S.alert = null; break;
    case 'prog-slot': S.progSlot = Number(n); break;
    case 'goto-prog': S.fiches = []; S.confirm = null; S.alert = null; S.tab = 'programme'; S.progSlot = Number(n) || null; break;
    case 'fiche': S.fiches.push(id); S.after = null; S.alert = null; break;
    case 'back': S.fiches.pop(); S.after = null; S.alert = null; break;
    case 'mes': S.fiches = []; S.tab = 'mes'; S.target = `slot-${n}`; break;
    case 'signup': {
      if (S.busy) return;
      const g = G(id);
      if (S.variant === 'A' && g.others + 1 > g.max) { S.confirm = { kind: 'tres', id }; break; }
      return send(id, true);
    }
    case 'confirm-tres': return send(id, true);
    case 'unsub':
      if (S.busy) return;
      if (S.variant === 'B') { S.confirm = { kind: 'unsub', id }; break; }
      return send(id, false);
    case 'confirm-unsub': return send(id, false);
    case 'resub': return send(id, true);
    case 'dismiss': S.confirm = null; break;
    case 'alert-close': S.alert = null; break;
    case 'noop': return;
  }
  render();
});

/* ---------- Barre du prototype ---------- */
const casSel = document.getElementById('cas');
casSel.innerHTML = CASES.map((c, i) => `<option value="${i}">${i + 1}. ${c.label}</option>`).join('');
function setVariant(k) {
  S.variant = k; S.confirm = null; S.alert = null; S.after = null;
  try { history.replaceState(null, '', '#variante-' + k.toLowerCase()); } catch { /* page intégrée */ }
  render();
}
const cycle = (dir) => setVariant(KEYS[(KEYS.indexOf(S.variant) + dir + KEYS.length) % KEYS.length]);
function setCase(i) { S.cas = (i + CASES.length) % CASES.length; resetCase(); render(); }
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('c-prev').onclick = () => setCase(S.cas - 1);
document.getElementById('c-next').onclick = () => setCase(S.cas + 1);
casSel.onchange = (e) => setCase(Number(e.target.value));
document.getElementById('net').onchange = (e) => { S.net = e.target.value; render(); };
document.getElementById('labels').onchange = (e) => { S.labels = e.target.value; render(); };
const sw = document.getElementById('switcher');
if (matchMedia('(max-width: 520px)').matches) sw.classList.add('collapsed');
document.getElementById('sw-toggle').onclick = (e) => { const c = sw.classList.toggle('collapsed'); e.target.setAttribute('aria-expanded', String(!c)); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); setCase(S.cas - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setCase(S.cas + 1); }
  else if (e.key === 'Escape') { if (S.confirm) S.confirm = null; else if (S.fiches.length) S.fiches.pop(); render(); }
});

resetCase();
render();
</script>
</html>
