<title>Écran du tirage · prototype</title>
<!--
  PROTOTYPE JETABLE : ne pas reprendre ce code en production.
  Question : à quoi ressemble le tirage dans la page « Pilotage du jour J » ? Lancement, résultat
  provisoire, ajustements, publication, créneau publié.
  Ticket « Prototype de l'écran du tirage » (#112), carte « Tirage d'un créneau : algorithme,
  ajustements et publication » (#109). Base : la variante C retenue pour le suivi (#94), soit la
  page actuelle : bande des créneaux, résumé du créneau, onglets de classeur, fiche à droite.

  Ce qui est commun aux trois variantes :
    - le bouton « Lancer le tirage », dans le résumé du seul premier créneau non publié, et sa
      confirmation (inscrits, places, avertissements rouges du suivi) ;
    - après le lancement, le résumé montre les chiffres du tirage (placés, non placés, parties au
      minimum) et ses propres signaux à la place des avertissements de suivi, avec « Publier le
      tirage », « Relancer le tirage » et « ⋯ » (« Rouvrir les inscriptions ») ;
    - les confirmations : lancer, relancer (s'il y a eu des déplacements), rouvrir, annuler une
      partie, programmer depuis la réserve, publier ;
    - le créneau publié, en lecture seule, avec les places qui restent (PRD §4.5).

  Trois variantes du résultat provisoire et du geste « déplacer un participant », basculables par
  ?variant=A|B|C, par la barre du bas et par les flèches ← → du clavier :
    A « Onglets et dialogue »   : onglets Parties, Non placés, Réserve. Chaque partie liste ses joueurs ;
                                  un pseudo ouvre « Déplacer… », un dialogue qui montre ses inscriptions
                                  et le remplissage de chaque partie.
    B « Plan de salle »         : une colonne par table, et les non placés en première colonne. On choisit
                                  un joueur, puis sa nouvelle table : chaque colonne dit alors s'il y est
                                  inscrit et si elle dépasse son maximum.
    C « Grille des inscrits »   : l'onglet « Inscrits du créneau » devient la répartition : un participant
                                  par ligne, une partie par colonne, ses inscriptions cochées et sa table
                                  marquée. Un clic sur une autre case le déplace.

  Données : convention de démonstration, jour J. Le créneau 1 est publié (une partie annulée). Le
  créneau 2 attend son tirage : 26 inscrits pour 22 places, 8 participants inscrits à la seule
  « Néons sur Neo-Paris », et « Le Marché aux ombres » restera sous son minimum. Brindille mène cette
  partie et a une inscription à « Sous la surface » : elle ne compte pas tant que Brindille mène
  (IN-4), et revient si la partie est annulée. Le créneau 3 porte une partie double.

  Retenu : B « Plan de salle », avec son passage à la ligne des tables et les cibles « Déplacer ici »
  alignées en bas des cartes. Détail et autres décisions dans le ticket #112.

  L'algorithme est celui du prototype « algorithme de tirage » (#110), recopié tel quel. Le suivi
  des créneaux ouverts est simplifié. Rien n'est enregistré : tout vit en mémoire.
-->

}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--surface-0); color: var(--text); font: var(--font-size-body)/1.4 var(--font-ui); }

/* ---------- Boutons, badges, pastilles ---------- */
.btn { display: inline-flex; gap: var(--space-xs); align-items: center; justify-content: center; min-height: 32px; padding: 6px 12px; border: 1px solid transparent; border-radius: var(--radius-control); font-weight: 600; white-space: nowrap; cursor: pointer; }

/* ---------- Jauge : inscrits face aux places minimum et maximum ---------- */
/* La zone claire va du minimum au maximum ; un trait marque chaque borne ; les hachures, ce qui dépasse. */
.gauge { position: relative; display: block; height: 8px; border-radius: 999px; background: var(--surface-3); }

.gauge .fill.warning { background: var(--warning); }

.gauge .excess.danger { background: repeating-linear-gradient(135deg, var(--danger) 0 3px, transparent 3px 6px); }
.gauge .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); }

/* ---------- Vignettes ---------- */
.thumb { display: inline-grid; place-items: center; flex: none; aspect-ratio: 1; border-radius: var(--radius-thumb); background: var(--surface-3); color: var(--initial); font-family: var(--font-display); line-height: 1; }

// ---------- Algorithme : recopié du prototype « algorithme de tirage » (#110) ----------
const DrawPrototype = (() => {
  'use strict';

  /** Un générateur pseudo-aléatoire à graine : la source de hasard injectée. */
  function mulberry32(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Mélange de Fisher-Yates : chaque ordre a la même probabilité. */
  function shuffled(list, random) {
    const copy = [...list];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  const gcd = (a, b) => (b ? gcd(b, a % b) : a);

  /**
   * Le tirage d'un créneau.
   * `slot` : `{ games: [{ id, min, max }], participants: [{ id, gameIds }] }`, identifiants opaques.
   * `options` : `balance` ('weighted' | 'range' | 'leximin'), `underMin` ('balance' | 'fewest'), `shuffle`.
   * Rend l'affectation de chaque participant (id de partie, ou `null` : non placé), la répartition
   * retenue (joueurs par partie, dans l'ordre de `games`), le nombre de répartitions ex aequo et
   * le nombre de répartitions examinées.
   */
  function drawTimeSlot(slot, random, options) {
    const { games } = slot;
    const n = games.length;
    const index = new Map(games.map((game, i) => [game.id, i]));
    const order = options.shuffle ? shuffled(slot.participants, random) : slot.participants;
    const masks = order.map((p) =>
      p.gameIds.reduce((mask, id) => (index.has(id) ? mask | (1 << index.get(id)) : mask), 0),
    );

    // signedUpTo[T] : participants inscrits à au moins une partie de l'ensemble T (condition de Hall).
    const signedUpTo = new Array(1 << n).fill(0);
    for (let T = 1; T < 1 << n; T++) for (const mask of masks) if (mask & T) signedUpTo[T]++;

    // Couplage par chemins augmentants, dans l'ordre mélangé : un participant placé le reste, mais
    // peut glisser vers une autre de ses parties pour faire de la place au suivant.
    const seat = (seatsPerGame) => {
      const seated = games.map(() => []);
      const gameOf = new Array(order.length).fill(-1);
      const tryToSeat = (p, visited) => {
        for (let g = 0; g < n; g++) {
          if (!((masks[p] >> g) & 1) || visited[g]) continue;
          visited[g] = true;
          if (seated[g].length < seatsPerGame[g]) {
            seated[g].push(p);
            gameOf[p] = g;
            return true;
          }
          for (let k = 0; k < seated[g].length; k++) {
            if (tryToSeat(seated[g][k], visited)) {
              seated[g][k] = p;
              gameOf[p] = g;
              return true;
            }
          }
        }
        return false;
      };
      for (let p = 0; p < order.length; p++) tryToSeat(p, new Array(n).fill(false));
      return gameOf;
    };

    // Étape 2 : le nombre maximum de participants plaçables.
    const maxPlaced = seat(games.map((g) => g.max)).filter((g) => g >= 0).length;

    // Étapes 3 et 4 : toutes les répartitions qui placent ce maximum, sans dépasser les maximums,
    // et que les inscriptions permettent (Hall : pour tout ensemble de parties, pas plus de joueurs
    // que d'inscrits à ces parties). On garde les meilleures.
    const caps = games.map((g, i) => Math.min(g.max, signedUpTo[1 << i]));
    const capsAfter = caps.map((_, i) => caps.slice(i + 1).reduce((a, b) => a + b, 0));
    const seatScale = games.reduce((l, g) => (l * g.max) / gcd(l, g.max), 1);
    const counts = new Array(n).fill(0);
    let bestKey = null;
    let best = [];
    let examined = 0;

    const keyOf = () => {
      const atMin = games.filter((g, k) => counts[k] >= g.min).length;
      const underMin = games.reduce((sum, g, k) => sum + (counts[k] < g.min ? counts[k] : 0), 0);
      // Remplissages en entiers (places ramenées au même dénominateur) : les ex aequo sont exacts.
      const fills = counts.map((c, k) => (c * seatScale) / games[k].max);
      const balance =
        options.balance === 'range' ? [Math.min(...fills) - Math.max(...fills)]
        : options.balance === 'leximin' ? [...fills].sort((a, b) => a - b)
        : [-counts.reduce((sum, c, k) => sum + (c * c * seatScale) / games[k].max, 0)];
      return [atMin, ...(options.underMin === 'fewest' ? [-underMin] : []), ...balance];
    };

    const hallHolds = (i) => {
      for (let T = 1 << i; T < 1 << (i + 1); T++) {
        let sum = 0;
        for (let g = 0; g <= i; g++) if ((T >> g) & 1) sum += counts[g];
        if (sum > signedUpTo[T]) return false;
      }
      return true;
    };

    const explore = (i, placedSoFar) => {
      if (i === n) {
        examined++;
        const key = keyOf();
        let comparison = 1;
        if (bestKey) {
          comparison = 0;
          for (let k = 0; k < key.length && comparison === 0; k++) comparison = key[k] - bestKey[k];
        }
        if (comparison > 0) {
          bestKey = key;
          best = [[...counts]];
        } else if (comparison === 0) {
          best.push([...counts]);
        }
        return;
      }
      const from = Math.max(0, maxPlaced - placedSoFar - capsAfter[i]);
      const to = Math.min(caps[i], maxPlaced - placedSoFar);
      for (let x = from; x <= to; x++) {
        counts[i] = x;
        if (!hallHolds(i)) break;
        explore(i + 1, placedSoFar + x);
      }
      counts[i] = 0;
    };
    explore(0, 0);

    // Étape 5 : le hasard choisit entre les répartitions ex aequo, puis l'ordre mélangé décide qui s'assoit.
    const distribution = best[Math.floor(random() * best.length)];
    const gameOf = seat(distribution);
    const assignments = new Map(order.map((p, k) => [p.id, gameOf[k] < 0 ? null : games[gameOf[k]].id]));
    return { assignments, distribution, tied: best.length, examined, maxPlaced };
  }
  return { mulberry32, drawTimeSlot };
})();

const { mulberry32, drawTimeSlot } = DrawPrototype;
const DRAW_OPTIONS = { balance: 'leximin', underMin: 'fewest', shuffle: true };

// Le créneau 1, publié, et l'inscription de Brindille, MJ du « Marché aux ombres » sur le créneau 2,
// à « Sous la surface » sur ce même créneau (IN-4).
Object.assign(SIGN_UPS, {
  'masques@c1': 'Aube Corbeau Lune Nox Opale Ulysse',
  'reine@c1': 'Bastou Dahlia Milo Tanuki Corbeau',
  'desert@c1': 'Éole Gaspard Isis Jaspe Kestrel Yuzu',
  'lanternes@c1': 'Faëlle Hirondelle Pixel Volute Aube Nox',
  'mandragores@c1': 'Sélène Rhubarbe',
});
SIGN_UPS['surface@c2'] += ' Brindille';

/** Seuil de « presque plein » : une constante du domaine (#90). */
const NEARLY_FULL = 0.8;

let games = [];
let signUps = {};
/** L'état de chaque créneau : 'open' (inscriptions ouvertes), 'drawing' (tirage lancé), 'published'. */
let state = {};
/** Le tirage de chaque créneau lancé : affectations, parties annulées, participants déplacés à la main. */
let draws = {};
let seed = 1;

const slotById = (id) => SLOTS.find((s) => s.id === id);
const tableById = (id) => TABLES.find((t) => t.id === id);
const gameById = (id) => games.find((g) => g.id === id);
const scOf = (game) => SCENARIOS[game.scenario];
const gmOf = (game) => GMS[scOf(game).gm].nickname;
const tableIndex = (game) => TABLES.findIndex((t) => t.id === game.table);
const startingGames = (slotId) => games.filter((g) => g.slots[0] === slotId).sort((a, b) => tableIndex(a) - tableIndex(b));
const coveringGames = (slotId) => games.filter((g) => g.slots.includes(slotId)).sort((a, b) => tableIndex(a) - tableIndex(b));
const isCanceled = (game) => Boolean(draws[game.slots[0]]?.canceled.has(game.id));
const leadsOn = (pseudo, slotId) => coveringGames(slotId).some((g) => !isCanceled(g) && gmOf(g) === pseudo);
const isSignedUp = (pseudo, game) => signUps[game.id].includes(pseudo);
const firstUnpublished = () => SLOTS.find((s) => state[s.id] !== 'published');
const titleOf = (game) => scOf(game).title;
const tableName = (game) => tableById(game.table).name;

function makeGame(slotId, tableId, scenarioId) {
  const rank = slotById(slotId).rank;
  const slots = SCENARIOS[scenarioId].double ? [slotId, SLOTS.find((s) => s.rank === rank + 1).id] : [slotId];
  return { id: `${scenarioId}@${slotId}`, scenario: scenarioId, slots, table: tableId };
}

function loadData() {
  games = PROGRAMME.map(([slotId, tableId, scenarioId]) => makeGame(slotId, tableId, scenarioId));
  signUps = Object.fromEntries(games.map((g) => [g.id, (SIGN_UPS[g.id] ?? '').split(' ').filter(Boolean)]));
  state = Object.fromEntries(SLOTS.map((s) => [s.id, 'open']));
  draws = {};
  seed = 1;
  // Le créneau 1 : tiré, « La Nuit des Mandragores » annulée, publié.
  launch('c1');
  cancelGame('c1', 'mandragores@c1');
  state.c1 = 'published';
}

/** TI-3 : les joueurs d'une partie double, placés au tirage de son premier créneau, ne sont pas du tirage du suivant. */
function takenByDoubleGame(slotId) {
  const taken = new Set();
  for (const g of coveringGames(slotId)) {
    if (g.slots[0] === slotId || isCanceled(g)) continue;
    const d = draws[g.slots[0]];
    if (!d) continue;
    for (const [pseudo, gameId] of d.assignments) if (gameId === g.id) taken.add(pseudo);
  }
  return taken;
}

/** Les participants du créneau et leurs inscriptions actives (IN-4, TI-2, TI-3), parties annulées comprises. */
function participantsOf(slotId) {
  const taken = takenByDoubleGame(slotId);
  const people = new Map();
  for (const g of startingGames(slotId)) {
    for (const pseudo of signUps[g.id]) {
      if (leadsOn(pseudo, slotId) || taken.has(pseudo)) continue;
      if (!people.has(pseudo)) people.set(pseudo, { pseudo, gameIds: [] });
      people.get(pseudo).gameIds.push(g.id);
    }
  }
  return [...people.values()].sort((a, b) => byPseudo(a.pseudo, b.pseudo));
}

// ---------- Gestes du tirage ----------
function runDraw(slotId) {
  const d = draws[slotId];
  const live = startingGames(slotId).filter((g) => !d.canceled.has(g.id));
  const input = {
    games: live.map((g) => ({ id: g.id, min: scOf(g).min, max: scOf(g).max })),
    participants: participantsOf(slotId).map((p) => ({ id: p.pseudo, gameIds: p.gameIds.filter((id) => !d.canceled.has(id)) })),
  };
  d.assignments = drawTimeSlot(input, mulberry32(seed++ * 7919), DRAW_OPTIONS).assignments;
  d.moved = new Set();
}

function launch(slotId) {
  state[slotId] = 'drawing';
  draws[slotId] = { assignments: new Map(), canceled: new Set(), moved: new Set() };
  runDraw(slotId);
}

function movePlayer(slotId, pseudo, gameId) {
  const d = draws[slotId];
  if ((d.assignments.get(pseudo) ?? null) === gameId) return false;
  d.assignments.set(pseudo, gameId);
  d.moved.add(pseudo);
  return true;
}

/** Ses joueurs passent dans les non placés, sans nouveau tirage ; son MJ redevient participant (IN-4). */
function cancelGame(slotId, gameId) {
  const d = draws[slotId];
  d.canceled.add(gameId);
  for (const [pseudo, id] of d.assignments) if (id === gameId) d.assignments.set(pseudo, null);
}

/** Prototype : une partie annulée par erreur revient, vide ; son MJ quitte les participants. */
function restoreGame(slotId, gameId) {
  const d = draws[slotId];
  d.canceled.delete(gameId);
  const gm = gmOf(gameById(gameId));
  d.assignments.delete(gm);
  d.moved.delete(gm);
}

function reopen(slotId) {
  state[slotId] = 'open';
  delete draws[slotId];
}

function scheduleFromReserve(slotId, scenarioId, tableId) {
  const game = makeGame(slotId, tableId, scenarioId);
  games.push(game);
  signUps[game.id] = [];
  reopen(slotId);
  return game;
}

// ---------- Ce que l'écran lit ----------
function drawView(slotId) {
  const d = draws[slotId];
  const people = participantsOf(slotId);
  const starting = startingGames(slotId);
  const byGame = new Map(starting.map((g) => [g.id, []]));
  const unplaced = [];
  for (const p of people) {
    const id = d.assignments.get(p.pseudo) ?? null;
    if (id && byGame.has(id) && !d.canceled.has(id)) byGame.get(id).push(p.pseudo);
    else unplaced.push(p.pseudo);
  }
  const infos = starting.map((game) => {
    const sc = scOf(game);
    const players = byGame.get(game.id);
    const canceled = d.canceled.has(game.id);
    return { game, sc, players, count: players.length, min: sc.min, max: sc.max, canceled, under: !canceled && players.length < sc.min, over: players.length > sc.max, free: canceled ? 0 : Math.max(0, sc.max - players.length) };
  });
  const live = infos.filter((i) => !i.canceled);
  return {
    people, infos, live, unplaced,
    placed: people.length - unplaced.length,
    atMin: live.filter((i) => i.count >= i.min).length,
    under: live.filter((i) => i.under),
    over: live.filter((i) => i.over),
    canceled: infos.filter((i) => i.canceled),
    freeSeats: live.reduce((sum, i) => sum + i.free, 0),
  };
}
const infoOf = (v, gameId) => v.infos.find((i) => i.game.id === gameId);
const playersOfDouble = (game) => [...(draws[game.slots[0]]?.assignments ?? [])].filter(([, id]) => id === game.id).map(([p]) => p).sort(byPseudo);

/** Le suivi d'un créneau ouvert, simplifié : demande, capacité et avertissements (#90). */
function trackingOf(slotId) {
  const people = participantsOf(slotId);
  const live = startingGames(slotId);
  const count = new Map(live.map((g) => [g.id, people.filter((p) => p.gameIds.includes(g.id)).length]));
  const capMin = live.reduce((s, g) => s + scOf(g).min, 0);
  const capMax = live.reduce((s, g) => s + scOf(g).max, 0);
  const demand = people.length;
  const oversubscribed = (id) => count.get(id) > scOf(gameById(id)).max;
  const atRisk = people.filter((p) => p.gameIds.every(oversubscribed)).length;
  const below = live.filter((g) => count.get(g.id) < scOf(g).min).length;
  const warnings = [];
  if (demand) {
    if (demand > capMax) warnings.push({ level: 'danger', title: `Il manque ${countOf(demand - capMax, 'place', 'places')}`, detail: `${countOf(demand, 'participant', 'participants')} pour ${countOf(capMax, 'place', 'places')} au plus.` });
    if (atRisk) warnings.push({ level: 'danger', title: `${countOf(atRisk, 'participant risque', 'participants risquent')} de ne pas être placé${atRisk > 1 ? 's' : ''}`, detail: 'Toutes leurs parties du créneau sont très demandées.' });
    if (demand <= capMax && demand >= NEARLY_FULL * capMax) warnings.push({ level: 'warning', title: 'Presque plein', detail: `${countOf(demand, 'participant', 'participants')} pour ${countOf(capMax, 'place', 'places')} au plus.` });
    if (demand < capMin) warnings.push({ level: 'warning', title: 'Trop de parties', detail: `${countOf(demand, 'participant', 'participants')} pour ${countOf(capMin, 'place', 'places')} au moins.` });
    if (below) warnings.push({ level: 'warning', title: `${countOf(below, 'partie', 'parties')} sous ${below > 1 ? 'leur' : 'son'} minimum`, detail: '' });
  }
  return { people, demand, capMin, capMax, count, warnings: warnings.slice(0, 3) };
}

/** Les signaux du tirage, qui remplacent les avertissements de suivi une fois le tirage lancé. */
function signalsOf(v) {
  const signals = [];
  if (v.unplaced.length) signals.push({ level: 'danger', code: 'unplaced', title: countOf(v.unplaced.length, 'non placé', 'non placés'), detail: v.freeSeats ? `Il reste ${countOf(v.freeSeats, 'place', 'places')} dans les parties du créneau.` : 'Aucune place libre dans les parties du créneau.' });
  if (v.under.length) signals.push({ level: 'warning', code: 'under', title: `${countOf(v.under.length, 'partie', 'parties')} sous ${v.under.length > 1 ? 'leur' : 'son'} minimum`, detail: v.under.length > 1 ? 'Maintenues : elles seront jouées ainsi, sauf si tu les annules.' : 'Maintenue : elle sera jouée ainsi, sauf si tu l\'annules.' });
  if (v.over.length) signals.push({ level: 'warning', code: 'over', title: `${countOf(v.over.length, 'partie', 'parties')} au-delà de ${v.over.length > 1 ? 'leur' : 'son'} maximum`, detail: `${v.over.map((i) => `« ${esc(i.sc.title)} » : ${i.count} joueurs pour ${countOf(i.max, 'place', 'places')}`).join(' ; ')}.` });
  return signals;
}

function reserveOf(slotId) {
  const slot = slotById(slotId);
  const next = SLOTS.find((s) => s.rank === slot.rank + 1);
  const freeOn = (id) => TABLES.filter((t) => !coveringGames(id).some((g) => g.table === t.id));
  const free = freeOn(slotId);
  return Object.keys(SCENARIOS).flatMap((id) => {
    const sc = SCENARIOS[id];
    const gm = GMS[sc.gm];
    if (!gm.availability.includes(slot.rank) || leadsOn(gm.nickname, slotId)) return [];
    if (games.some((g) => g.scenario === id && g.slots[0] === slotId)) return [];
    let tables = free;
    if (sc.double) {
      if (!next || state[next.id] !== 'open' || !gm.availability.includes(next.rank) || leadsOn(gm.nickname, next.id)) return [];
      tables = free.filter((t) => freeOn(next.id).includes(t));
    }
    return tables.length ? [{ scenario: id, table: tables[0] }] : [];
  });
}

const ui = {
  variant: 'A',
  slot: 'c2',
  aTab: 'games',
  cTab: 'grid',
  cFilter: 'all',
  picked: null, // B : le joueur choisi, avant sa nouvelle table

// ---------- Rendu commun ----------
function thumb(sc, size) {
  if (sc.img) return `<span class="thumb" style="width:${size}px;background:${IMAGES[sc.img]}" aria-hidden="true"></span>`;
  const initial = sc.title.replace(/^(Les |Le |La |L'|Un |Une )/, '').charAt(0).toUpperCase();
  return `<span class="thumb" style="width:${size}px;font-size:${Math.round(size * 0.55)}px" aria-hidden="true">${initial}</span>`;
}
function gauge(count, min, max, { fill = '', excess = '' } = {}) {
  const scale = Math.max(count, max, 1);
  const pct = (v) => `${((v / scale) * 100).toFixed(2)}%`;
  return `<span class="gauge" aria-hidden="true"><span class="zone" style="left:${pct(min)};width:${pct(max - min)}"></span><span class="fill ${fill}" style="width:${pct(Math.min(count, max))}"></span>${count > max ? `<span class="excess ${excess}" style="left:${pct(max)};width:${pct(count - max)}"></span>` : ''}<span class="tick" style="left:${pct(min)}"></span><span class="tick" style="left:${pct(max)}"></span></span>`;
}
const doubleBadge = () => `<span class="badge">${icon('columns-2', 'i s')}double</span>`;
const underBadge = () => `<span class="badge warning">${icon('triangle-alert', 'i s')}Sous son minimum</span>`;
const overBadge = () => `<span class="badge warning">${icon('triangle-alert', 'i s')}Au-delà du maximum</span>`;
const canceledBadge = () => `<span class="badge">${icon('ban', 'i s')}Annulée</span>`;
function gameBadges(i) {
  return `${i.sc.double ? doubleBadge() : ''}${i.canceled ? canceledBadge() : ''}${i.under ? underBadge() : ''}${i.over ? overBadge() : ''}`;
}
function playerFigures(i) {
  if (i.canceled) return 'Partie annulée';
  return `${countOf(i.count, 'joueur', 'joueurs')} · ${formatSeats(i.min, i.max)}${i.over ? ` · <strong>${i.count - i.max}${NB}de trop</strong>` : i.free ? ` · ${countOf(i.free, 'place libre', 'places libres')}` : ''}`;
}
const gameGauge = (i) => gauge(i.count, i.min, i.max, { fill: i.under ? 'warning' : '' });

/** Un joueur : sa pastille, avec ses marques (déplacé à la main, pas inscrit à sa partie). */
function chip(slotId, pseudo, game, { readOnly = false, act = 'a-move', pressed } = {}) {
  const moved = draws[slotId].moved.has(pseudo);
  const unsigned = game && !isSignedUp(pseudo, game);
  const notes = [unsigned ? 'pas inscrit à cette partie' : '', moved ? 'déplacement manuel' : ''].filter(Boolean).join(', ');
  const cls = `player${moved ? ' moved' : ''}${unsigned ? ' unsigned' : ''}`;
  const body = `${esc(pseudo)}${moved ? icon('pencil', 'i s') : ''}`;
  if (readOnly) return `<span class="${cls}"${notes ? ` title="${notes}"` : ''}>${body}</span>`;
  return `<button type="button" class="${cls}" data-act="${act}" data-pseudo="${esc(pseudo)}" data-key="chip-${esc(pseudo)}"${pressed === undefined ? '' : ` aria-pressed="${pressed}"`} aria-label="${esc(pseudo)}${notes ? `, ${notes}` : ''}"${notes ? ` title="${notes}"` : ''}>${body}</button>`;
}
function players(slotId, i, opts) {
  if (!i.players.length) return `<span class="empty-players">${i.canceled ? 'Ses joueurs sont passés dans les non placés.' : 'Aucun joueur'}</span>`;
  return i.players.map((p) => chip(slotId, p, i.game, { ...opts, pressed: opts.act === 'b-pick' ? p === ui.picked : undefined })).join('');
}
/** Sous son minimum : maintenue par défaut, avec « Annuler la partie » (le badge suffit à le signaler) ; annulée : « Rétablir la partie ». */
function underLine(i, readOnly) {
  if (i.canceled) {
    return `<p class="under-line"><span class="pastille neutral">${icon('ban', 'i s')}Partie annulée${readOnly ? ' : son MJ a été notifié' : ''}</span>${readOnly ? '' : `<button type="button" class="btn quiet sm" data-act="restore" data-game="${i.game.id}" data-key="restore-${i.game.id}">Rétablir la partie</button>`}</p>`;
  }
  if (!i.under || readOnly) return '';
  return `<p class="under-line"><button type="button" class="btn quiet-danger sm" data-act="ask-cancel" data-game="${i.game.id}" data-key="cancel-${i.game.id}">Annuler la partie</button></p>`;
}
const wishesOf = (slotId, v, person) => person.gameIds.map((id) => {
  const i = infoOf(v, id);
  return `<b>${esc(i.sc.title)}</b> (${i.canceled ? 'annulée' : `${i.count}${NB}/${NB}${i.max}`})`;
}).join(', ');

function tile(slot) {
  const st = state[slot.id];
  const pressed = slot.id === ui.slot;
  const head = `<span class="caps">Créneau ${slot.rank}</span><span class="range">${formatRange(slot)}</span>`;
  if (st === 'open') {
    const t = trackingOf(slot.id);
    const worst = t.warnings.some((w) => w.level === 'danger') ? 'danger' : 'warning';
    const warn = t.demand > t.capMax ? '' : (t.demand >= NEARLY_FULL * t.capMax || t.demand < t.capMin) && t.demand ? 'warning' : '';
    return `<button type="button" class="tile" aria-pressed="${pressed}" data-act="slot" data-id="${slot.id}" data-key="tile-${slot.id}">${head}
      <span class="ratio num">${t.demand} / ${t.capMax}</span><span class="legend">participants / places</span>
      ${gauge(t.demand, t.capMin, t.capMax, { fill: warn, excess: 'danger' })}
      <span class="tile-warnings ${worst}">${t.warnings.length ? `${levelIcon(worst, 'i s')}${countOf(t.warnings.length, 'avertissement', 'avertissements')}` : ''}</span></button>`;
  }
  const v = drawView(slot.id);
  const label = st === 'drawing' ? `${icon('hourglass', 'i s')}Tirage provisoire` : `${icon('lock', 'i s')}Tirage publié`;
  return `<button type="button" class="tile ${st === 'drawing' ? 'drawing' : 'closed'}" aria-pressed="${pressed}" data-act="slot" data-id="${slot.id}" data-key="tile-${slot.id}">${head}
    <span class="ratio num">${v.placed} / ${v.people.length}</span><span class="legend">placés / participants</span>
    <span class="tile-state">${label}</span></button>`;
}

function warningList(items, buttons = {}) {
  if (!items.length) return '';
  return `<ul class="warnings">${items.map((w) => `<li class="${w.level}">${levelIcon(w.level)}<div><strong>${w.title}</strong>${w.detail ? `<p>${w.detail}</p>` : ''}</div>${buttons[w.code] ? `<button type="button" class="btn secondary sm" data-act="follow" data-code="${w.code}" data-key="follow-${w.code}">${buttons[w.code]}</button>` : '<span></span>'}</li>`).join('')}</ul>`;
}

function summary(slot) {
  const st = state[slot.id];
  const first = firstUnpublished();
  const h2 = `<h2 id="summary-title" tabindex="-1" data-key="summary-title">${slotLabel(slot)}</h2>`;
  if (st === 'open') {
    const t = trackingOf(slot.id);
    const isFirst = first?.id === slot.id;
    const actions = isFirst ? `<div class="actions"><button type="button" class="btn primary" data-act="ask-launch" data-key="launch">${icon('dices')}Lancer le tirage</button></div>` : '';
    const warn = t.demand > t.capMax ? '' : (t.demand >= NEARLY_FULL * t.capMax || t.demand < t.capMin) && t.demand ? 'warning' : '';
    return `<section class="summary" aria-labelledby="summary-title">
      <div class="summary-head">${h2}${actions}</div>
      <div class="figures-b"><p><strong class="num">${t.demand}</strong>${plural(t.demand, 'participant', 'participants')}</p>
        <p><strong class="num">${t.capMin === t.capMax ? t.capMax : `${t.capMin} à ${t.capMax}`}</strong>places</p>${gauge(t.demand, t.capMin, t.capMax, { fill: warn, excess: 'danger' })}</div>
      ${t.demand ? '' : '<p class="muted">Aucune inscription sur ce créneau pour l\'instant.</p>'}
      ${warningList(t.warnings)}
      ${isFirst ? '' : `<p class="note">${icon('clock')}Le tirage de ce créneau se lance après la publication du créneau ${first.rank}.</p>`}
    </section>`;
  }
  const v = drawView(slot.id);
  const figures = `<div class="figures-d">
      <p><strong class="num">${v.placed} / ${v.people.length}</strong>placés</p>
      <p><strong class="num">${v.unplaced.length}</strong>non placés</p>
      <p><strong class="num">${v.atMin} / ${v.live.length}</strong>parties au minimum</p></div>`;
  if (st === 'published') {
    const left = v.live.filter((i) => i.free);
    return `<section class="summary" aria-labelledby="summary-title">
      <div class="summary-head">${h2}<span class="badge">${icon('lock', 'i s')}Tirage publié</span></div>
      ${figures}
      <p class="muted">Tirage publié : les participants et les MJ ont reçu leur notification, et le résultat ne change plus.</p>
      <p class="left-seats">${left.length ? `Il reste de la place : ${left.map((i) => `<strong>${tableName(i.game)}</strong> (${countOf(i.free, 'place', 'places')})`).join(', ')}. Les non placés vont voir leur MJ.` : 'Toutes les parties sont pleines.'}</p>
    </section>`;
  }
  const buttons = ui.variant === 'A' ? { unplaced: 'Voir les non placés', under: 'Voir les parties', over: 'Voir les parties' }
    : ui.variant === 'C' ? { unplaced: 'Voir les non placés' } : {};
  const menu = ui.menu ? `<div class="menu-pop" role="menu">
      ${ui.variant === 'B' ? `<button type="button" role="menuitem" data-act="open-reserve" data-key="menu-reserve">${icon('inbox')}Programmer depuis la réserve…</button>` : ''}
      <button type="button" role="menuitem" class="danger" data-act="ask-reopen" data-key="menu-reopen">${icon('lock-open')}Rouvrir les inscriptions</button></div>` : '';
  return `<section class="summary" aria-labelledby="summary-title">
    <div class="summary-head">${h2}<span class="badge accent">${icon('hourglass', 'i s')}Tirage provisoire</span>
      <div class="actions">
        <button type="button" class="btn secondary" data-act="ask-relaunch" data-key="relaunch">${icon('shuffle')}Relancer le tirage</button>
        <button type="button" class="btn primary" data-act="ask-publish" data-key="publish">${icon('send')}Publier le tirage</button>
        <button type="button" class="btn icon" data-act="toggle-menu" data-key="menu" aria-label="Autres actions du créneau" title="Autres actions du créneau" aria-haspopup="menu" aria-expanded="${ui.menu}">${icon('ellipsis')}</button>
        ${menu}
      </div></div>
    ${figures}
    ${warningList(signalsOf(v), buttons)}
    <p class="muted">Les inscriptions du créneau sont fermées. Personne n'est notifié avant la publication.</p>
  </section>`;
}

/** Créneau ouvert : les parties et leurs inscrits, comme l'onglet « Parties du créneau » du suivi. */
function openBody(slot) {
  const t = trackingOf(slot.id);
  const rows = TABLES.map((table) => {
    const g = coveringGames(slot.id).find((x) => x.table === table.id);
    if (!g) return `<li class="free"><span class="caps">${table.name}</span><span></span><span>Table libre</span><span></span></li>`;
    const sc = scOf(g);
    if (g.slots[0] !== slot.id) return `<li class="cont"><span class="caps">${table.name}</span>${thumb(sc, 32)}<div class="row-title"><h4>${esc(sc.title)}</h4><p class="meta">Partie double, comptée sur le créneau ${slotById(g.slots[0]).rank}</p></div><span></span></li>`;
    const n = t.count.get(g.id);
    return `<li><span class="caps">${table.name}</span>${thumb(sc, 32)}<div class="row-title"><h4>${esc(sc.title)}</h4><p class="meta">${esc(sc.system)} · ${esc(gmOf(g))}</p></div>
      <div class="row-figs">${gauge(n, sc.min, sc.max, { fill: n < sc.min ? 'warning' : '' })}<span>${countOf(n, 'inscrit', 'inscrits')} · ${formatSeats(sc.min, sc.max)}</span><span class="badges">${sc.double ? doubleBadge() : ''}${n < sc.min ? underBadge() : ''}</span></div></li>`;
  }).join('');
  return `<div class="tab-panel" style="border-radius: var(--radius-card)"><p class="muted">Suivi des inscriptions, simplifié dans ce prototype : seules les parties du créneau.</p><ul class="draw-rows">${rows}</ul></div>`;
}

function tabbed(tabs, current, act) {
  const tab = tabs.find((x) => x.id === current) ?? tabs[0];
  return `<div class="tabbed">
    <div class="tabs" role="tablist" aria-label="Vues du créneau">${tabs.map((x) => `<button type="button" role="tab" class="tab" aria-selected="${x.id === tab.id}" tabindex="${x.id === tab.id ? 0 : -1}" data-act="${act}" data-tab="${x.id}" data-key="tab-${x.id}">${icon(x.icon)}${x.label}<span class="count num">${x.count}</span></button>`).join('')}</div>
    <div class="tab-panel" role="tabpanel" tabindex="0">${tab.body}</div></div>`;
}

function reserveCards(slot) {
  const entries = reserveOf(slot.id);
  if (!entries.length) return '<p class="muted">Aucun scénario programmable sur ce créneau.</p>';
  return `<p class="muted">Programmer une partie efface le tirage provisoire et rouvre les inscriptions du créneau.</p>
    <ul class="cards">${entries.map(({ scenario, table }) => {
      const sc = SCENARIOS[scenario];
      return `<li class="r-card">${thumb(sc, 44)}<h4>${esc(sc.title)}</h4><p class="meta">${esc(sc.system)} · ${esc(GMS[sc.gm].nickname)}</p>
        <div class="foot"><span class="badges">${sc.double ? doubleBadge() : ''}</span><button type="button" class="btn secondary sm" data-act="ask-schedule" data-scenario="${scenario}" data-table="${table.id}" data-key="schedule-${scenario}">Programmer sur ${table.name}</button></div></li>`;
    }).join('')}</ul>`;
}

const legendLine = () => `<p class="legend-line"><span>${icon('pencil', 'i s')}déplacement manuel</span><span><span class="player unsigned" style="cursor:default">pseudo</span>pas inscrit à sa partie</span></p>`;

// ---------- Variante A : onglets et dialogue ----------
function bodyA(slot, v, readOnly) {
  const rows = TABLES.map((table) => {
    const g = coveringGames(slot.id).find((x) => x.table === table.id);
    if (!g) return `<li class="free"><span class="caps">${table.name}</span><span></span><span>Table libre</span><span></span></li>`;
    if (g.slots[0] !== slot.id) {
      const ps = playersOfDouble(g);
      return `<li class="cont"><span class="caps">${table.name}</span>${thumb(scOf(g), 32)}<div class="row-title"><h4>${esc(titleOf(g))}</h4><p class="meta">Partie double, tirée avec le créneau ${slotById(g.slots[0]).rank}</p></div><div class="row-figs">${countOf(ps.length, 'joueur', 'joueurs')}</div>
        <div class="players">${ps.map((p) => `<span class="player">${esc(p)}</span>`).join('')}</div></li>`;
    }
    const i = infoOf(v, g.id);
    return `<li class="${i.canceled ? 'canceled' : ''}"><span class="caps">${table.name}</span>${thumb(i.sc, 32)}
      <div class="row-title"><h4 tabindex="-1" data-key="row-${g.id}">${esc(i.sc.title)}</h4><p class="meta">${esc(i.sc.system)} · ${esc(gmOf(g))}</p></div>
      <div class="row-figs">${i.canceled ? '' : gameGauge(i)}<span>${playerFigures(i)}</span><span class="badges">${gameBadges(i)}</span></div>
      <div class="players">${players(slot.id, i, { readOnly, act: 'a-move' })}</div>${underLine(i, readOnly)}</li>`;
  }).join('');
  const people = new Map(v.people.map((p) => [p.pseudo, p]));
  const unplaced = v.unplaced.length
    ? `<p class="muted">${countOf(v.unplaced.length, 'non placé', 'non placés')}. ${v.freeSeats ? `Il reste ${countOf(v.freeSeats, 'place', 'places')} dans les parties du créneau.` : 'Aucune place libre dans les parties du créneau.'}</p>
      <ul class="unplaced-list">${v.unplaced.map((p) => `<li><span class="pseudo">${esc(p)}${draws[slot.id].moved.has(p) ? ` ${icon('pencil', 'i s')}` : ''}</span><span class="wishes">Inscriptions : ${wishesOf(slot.id, v, people.get(p))}</span>${readOnly ? '<span></span>' : `<button type="button" class="btn secondary sm" data-act="a-move" data-pseudo="${esc(p)}" data-key="place-${esc(p)}">Placer…</button>`}</li>`).join('')}</ul>`
    : '<p class="muted">Tous les participants sont placés.</p>';
  const tabs = [
    { id: 'games', label: 'Parties du créneau', icon: 'dices', count: v.live.length, body: `${readOnly ? '' : legendLine()}<ul class="draw-rows">${rows}</ul>` },
    { id: 'unplaced', label: 'Non placés', icon: 'user-x', count: v.unplaced.length, body: unplaced },
  ];
  if (!readOnly) tabs.push({ id: 'reserve', label: 'Réserve du créneau', icon: 'inbox', count: reserveOf(slot.id).length, body: reserveCards(slot) });
  return tabbed(tabs, ui.aTab, 'a-tab');
}

// ---------- Variante B : plan de salle ----------
function bodyB(slot, v, readOnly) {
  const d = draws[slot.id];
  const picked = readOnly ? null : ui.picked;
  const person = picked && v.people.find((p) => p.pseudo === picked);
  const current = person ? (d.assignments.get(picked) ?? null) : undefined;
  const effective = current && infoOf(v, current)?.canceled ? null : current;
  const bar = readOnly ? '' : person
    ? `<div class="move-bar">${icon('arrow-right-left')}<span><strong>${esc(picked)}</strong> · inscriptions : ${person.gameIds.map((id) => `« ${esc(titleOf(gameById(id)))} »`).join(', ')}. Choisis sa nouvelle table.</span><button type="button" class="btn quiet" data-act="b-unpick" data-key="unpick">Annuler</button></div>`
    : `<div class="move-bar idle">${icon('info')}<span>Choisis un joueur, puis sa nouvelle table.</span>${legendLine()}</div>`;
  const target = (gameId, i) => {
    if (!person) return '';
    if (gameId === null) return effective === null ? '' : `<button type="button" class="target" data-act="b-place" data-game="none" data-key="target-none"><span class="what">${icon('user-x', 'i s')}Retirer de sa table</span></button>`;
    if (i.canceled || effective === gameId) return '';
    const signed = person.gameIds.includes(gameId);
    const after = i.count + 1;
    return `<button type="button" class="target${signed ? ' signed' : ''}" data-act="b-place" data-game="${gameId}" data-key="target-${gameId}"><span class="what">${signed ? `${icon('check', 'i s')}Déplacer ici · inscrit` : 'Déplacer ici · pas inscrit'}</span>${after > i.max ? `<span class="warn">${icon('triangle-alert', 'i s')}${after} joueurs pour ${countOf(i.max, 'place', 'places')}</span>` : ''}</button>`;
  };
  const cols = [`<section class="col unplaced" aria-label="Non placés"><div class="col-head"><span class="caps">Non placés</span><h4 tabindex="-1" data-key="col-unplaced">${countOf(v.unplaced.length, 'participant', 'participants')}</h4><span class="meta">${v.freeSeats ? `${countOf(v.freeSeats, 'place libre', 'places libres')} dans le créneau` : 'Aucune place libre'}</span></div>
    <div class="players">${v.unplaced.length ? v.unplaced.map((p) => chip(slot.id, p, null, { readOnly, act: 'b-pick', pressed: p === picked })).join('') : '<span class="empty-players">Tous les participants sont placés.</span>'}</div><div class="col-foot">${target(null)}</div></section>`];
  for (const table of TABLES) {
    const g = coveringGames(slot.id).find((x) => x.table === table.id);
    if (!g) continue;
    if (g.slots[0] !== slot.id) {
      const ps = playersOfDouble(g);
      cols.push(`<section class="col cont"><div class="col-head"><span class="caps">${table.name}</span><h4>${esc(titleOf(g))}</h4><span class="meta">Partie double, tirée avec le créneau ${slotById(g.slots[0]).rank}</span></div><div class="players">${ps.map((p) => `<span class="player">${esc(p)}</span>`).join('')}</div></section>`);
      continue;
    }
    const i = infoOf(v, g.id);
    cols.push(`<section class="col${i.canceled ? ' canceled' : ''}" aria-label="${table.name}"><div class="col-head"><span class="caps">${table.name}</span><h4 tabindex="-1" data-key="row-${g.id}">${esc(i.sc.title)}</h4><span class="meta">${esc(i.sc.system)} · ${esc(gmOf(g))}</span>
      ${i.canceled ? '' : gameGauge(i)}<span class="count">${playerFigures(i)}</span><span class="badges">${gameBadges(i)}</span></div>
      <div class="players">${players(slot.id, i, { readOnly, act: 'b-pick' })}</div><div class="col-foot">${underLine(i, readOnly)}${target(g.id, i)}</div></section>`);
  }
  return `${bar}<div class="plan" data-scroll="plan">${cols.join('')}</div>`;
}

// ---------- Variante C : grille des inscrits ----------
function bodyC(slot, v, readOnly) {
  const d = draws[slot.id];
  const starting = v.infos;
  const filters = [
    { id: 'all', label: 'Tous', n: v.people.length },
    { id: 'unplaced', label: 'Non placés', n: v.unplaced.length },
    { id: 'moved', label: 'Déplacés à la main', n: v.people.filter((p) => d.moved.has(p.pseudo)).length },
  ].filter((f) => f.id === 'all' || f.n);
  if (!filters.some((f) => f.id === ui.cFilter)) ui.cFilter = 'all';
  const keep = (p) => ui.cFilter === 'all' || (ui.cFilter === 'unplaced' ? v.unplaced.includes(p.pseudo) : d.moved.has(p.pseudo));
  const unplacedSet = new Set(v.unplaced);
  const groups = [
    { id: 'unplaced', label: 'Non placés', danger: true, people: v.people.filter((p) => unplacedSet.has(p.pseudo) && keep(p)) },
    { id: 'placed', label: 'Placés', people: v.people.filter((p) => !unplacedSet.has(p.pseudo) && keep(p)) },
  ].filter((g) => g.people.length);
  const cell = (p, i) => {
    const current = unplacedSet.has(p.pseudo) ? null : d.assignments.get(p.pseudo);
    const check = icon('check', 'i s');
    if (i === null) {
      const here = current === null;
      const inner = here ? '<span class="mark">non placé</span>' : '<span class="mark"></span><span class="hint">retirer</span>';
      if (readOnly) return `<td class="cell"><span class="cell-btn${here ? ' assigned none' : ''}">${here ? 'non placé' : ''}</span></td>`;
      return `<td class="cell"><button type="button" class="cell-btn${here ? ' assigned none' : ''}" data-act="c-cell" data-pseudo="${esc(p.pseudo)}" data-game="none" data-key="cell-${esc(p.pseudo)}-none" aria-label="${esc(p.pseudo)} : ${here ? 'non placé' : 'retirer de sa table'}">${inner}</button></td>`;
    }
    const signed = p.gameIds.includes(i.game.id);
    if (i.canceled) return `<td class="cell off">${signed ? `<span class="cell-btn">${check}</span>` : ''}</td>`;
    const here = current === i.game.id;
    const after = i.count + 1;
    const mark = here ? `${signed ? check : ''}joue` : signed ? check : '';
    if (readOnly) return `<td class="cell"><span class="cell-btn${here ? ' assigned' : ''}${here && !signed ? ' unsigned' : ''}">${mark}</span></td>`;
    const hint = after > i.max ? `<span class="hint warnc">${icon('triangle-alert', 'i s')}${after}${NB}/${NB}${i.max}</span>` : '<span class="hint">ici</span>';
    const label = here ? `${p.pseudo} joue à « ${i.sc.title} »` : `Déplacer ${p.pseudo} vers « ${i.sc.title} »${signed ? ', inscrit' : ', pas inscrit'}${after > i.max ? `, ${after} joueurs pour ${i.max} places` : ''}`;
    return `<td class="cell"><button type="button" class="cell-btn${here ? ' assigned' : ''}${here && !signed ? ' unsigned' : ''}" data-act="c-cell" data-pseudo="${esc(p.pseudo)}" data-game="${i.game.id}" data-key="cell-${esc(p.pseudo)}-${i.game.id}" aria-label="${esc(label)}"><span class="mark">${mark}</span>${here ? '' : hint}</button></td>`;
  };
  const head = `<tr><th class="pseudo" scope="col">Participant</th><th class="gcol" scope="col"><span class="t">Non placés</span><b class="num">${v.unplaced.length}</b></th>${starting.map((i) => `<th class="gcol" scope="col"><span class="t">${tableName(i.game)}</span><b>${esc(i.sc.title)}</b><span class="num">${i.canceled ? 'Annulée' : `${i.count}${NB}/${NB}${i.max} · ${i.min}–${i.max}`}</span><span class="badges">${i.under ? underBadge() : ''}${i.over ? overBadge() : ''}${i.sc.double ? doubleBadge() : ''}</span>${
    readOnly ? '' : i.canceled ? `<button type="button" class="btn quiet sm" data-act="restore" data-game="${i.game.id}" data-key="restore-${i.game.id}">Rétablir la partie</button>` : i.under ? `<button type="button" class="btn quiet-danger sm" data-act="ask-cancel" data-game="${i.game.id}" data-key="cancel-${i.game.id}">Annuler la partie</button>` : ''}</th>`).join('')}</tr>`;
  const body = groups.map((g) => `<tr class="group${g.danger ? ' danger' : ''}"><th colspan="${starting.length + 2}">${g.label} · ${g.people.length}</th></tr>${g.people.map((p) => `<tr><th class="pseudo" scope="row">${esc(p.pseudo)}${d.moved.has(p.pseudo) ? ` ${icon('pencil', 'i s')}` : ''}</th>${cell(p, null)}${starting.map((i) => cell(p, i)).join('')}</tr>`).join('')}`).join('');
  const doubles = coveringGames(slot.id).filter((g) => g.slots[0] !== slot.id);
  const grid = `<div class="filters">${filters.map((f) => `<button type="button" class="filter" aria-pressed="${f.id === ui.cFilter}" data-act="c-filter" data-filter="${f.id}" data-key="filter-${f.id}">${f.label}<span class="count num">${f.n}</span></button>`).join('')}</div>
    <p class="legend-line"><span>${icon('check', 'i s')}inscrit</span><span><span class="cell-btn assigned" style="width:auto">joue</span>sa table</span><span>${icon('pencil', 'i s')}déplacement manuel</span>${readOnly ? '' : '<span>Un clic sur une case déplace le participant.</span>'}</p>
    ${doubles.map((g) => `<p class="muted">${tableName(g)} : « ${esc(titleOf(g))} », partie double tirée avec le créneau ${slotById(g.slots[0]).rank} (${countOf(playersOfDouble(g).length, 'joueur', 'joueurs')}).</p>`).join('')}
    <div class="table-scroll" data-scroll="grid"><table class="grid-d"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  const tabs = [{ id: 'grid', label: 'Répartition', icon: 'users', count: v.people.length, body: grid }];
  if (!readOnly) tabs.push({ id: 'reserve', label: 'Réserve du créneau', icon: 'inbox', count: reserveOf(slot.id).length, body: reserveCards(slot) });
  return tabbed(tabs, ui.cTab, 'c-tab');
}

function renderNav() {
  const entry = (label, name, active = false, upcoming = false) => upcoming
    ? `<li class="entry upcoming">${icon(name)}<span>${label} <span class="soon">${icon('clock', 'i s')}à venir</span></span></li>`
    : `<li><a class="entry${active ? ' active' : ''}" href="#" onclick="return false"${active ? ' aria-current="page"' : ''}>${icon(name)}<span>${label}</span></a></li>`;
  return `<h2 class="section">Préparation</h2><ul>${entry('Calendrier', 'calendar')}${entry('MJ', 'users')}${entry('Scénarios', 'book-open')}${entry('Créneaux et tables', 'layout-grid')}</ul>
    <h2 class="section">Jour J</h2><ul>${entry('Pilotage du jour J', 'radio-tower', true)}${entry('Participants', 'user-round', false, true)}</ul>`;
}

function renderPage() {
  const slot = slotById(ui.slot);
  const st = state[slot.id];
  let body = '';
  if (st === 'open') body = openBody(slot);
  else {
    const v = drawView(slot.id);
    const readOnly = st === 'published';
    body = { A: bodyA, B: bodyB, C: bodyC }[ui.variant](slot, v, readOnly);
  }
  return `<header class="page-head"><h1 tabindex="-1" data-key="h1">Pilotage du jour J</h1><p class="sync"></p></header>
    <nav class="band" aria-label="Créneaux de la journée">${SLOTS.map(tile).join('')}</nav>
    <div class="detail c">${summary(slot)}${body}</div>`;
}

// ---------- Dialogues ----------
const shell = (body, { alert = false, wide = false } = {}) => `<div class="backdrop"></div><div class="dialog${wide ? ' wide' : ''}" role="${alert ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dialog-title">${body}</div>`;
const actionsOf = (confirm, kind = 'primary', dismiss = 'Annuler') => `<div class="dialog-actions"><button type="button" class="btn quiet" data-act="dialog-cancel" data-initial data-key="dlg-cancel">${dismiss}</button><button type="button" class="btn ${kind}" data-act="dialog-confirm" data-key="dlg-confirm">${confirm}</button></div>`;
const gameList = (items, line) => `<ul class="dot">${items.map(line).join('')}</ul>`;

function renderDialog() {
  const dl = ui.dialog;
  if (!dl) return '';
  const slot = slotById(dl.slotId);
  if (dl.type === 'launch') {
    const t = trackingOf(slot.id);
    const reds = t.warnings.filter((w) => w.level === 'danger');
    return shell(`<h2 id="dialog-title">Lancer le tirage du créneau ${slot.rank} ?</h2>
      <p>${t.demand ? `${countOf(t.demand, 'participant est inscrit', 'participants sont inscrits')} sur ce créneau, pour ${t.capMin === t.capMax ? countOf(t.capMax, 'place', 'places') : `${t.capMin} à ${t.capMax}${NB}places`}.` : 'Aucun participant n\'est inscrit sur ce créneau : le résultat sera vide.'}</p>
      ${reds.length ? `<ul class="signal-list">${reds.map((w) => `<li class="danger">${levelIcon('danger', 'i s')}<span><strong>${w.title}</strong> <span class="muted">${w.detail}</span></span></li>`).join('')}</ul>` : ''}
      <p>Les inscriptions du créneau seront fermées. Personne n'est notifié avant la publication.</p>
      ${actionsOf('Lancer le tirage')}`, { alert: true });
  }
  const d = draws[slot.id];
  if (dl.type === 'relaunch') {
    const v = drawView(slot.id);
    return shell(`<h2 id="dialog-title">Relancer le tirage du créneau ${slot.rank} ?</h2>
      <p>${d.moved.size > 1 ? `Tes ${d.moved.size}${NB}déplacements seront effacés` : 'Ton déplacement sera effacé'} : le tirage repart des inscriptions.</p>
      ${v.canceled.length ? `<p>${v.canceled.length > 1 ? `Les ${v.canceled.length} parties annulées le restent` : `« ${esc(v.canceled[0].sc.title)} » reste annulée`}.</p>` : ''}
      ${actionsOf('Relancer le tirage', 'danger')}`, { alert: true });
  }
  if (dl.type === 'reopen') {
    return shell(`<h2 id="dialog-title">Rouvrir les inscriptions du créneau ${slot.rank} ?</h2>
      <p>Le résultat provisoire sera effacé, avec ses déplacements et ses parties annulées.</p>
      <p>Personne n'est notifié : chacun retrouve ses inscriptions, et peut en changer jusqu'au prochain tirage.</p>
      ${actionsOf('Rouvrir les inscriptions', 'danger')}`, { alert: true });
  }
  if (dl.type === 'cancel-game') {
    const game = gameById(dl.gameId);
    const i = infoOf(drawView(slot.id), game.id);
    const gm = gmOf(game);
    const gmWishes = startingGames(slot.id).filter((g) => g.id !== game.id && isSignedUp(gm, g));
    return shell(`<h2 id="dialog-title">Annuler « ${esc(i.sc.title)} » ?</h2>
      <p>${i.count ? `${i.count > 1 ? `Ses ${i.count}${NB}joueurs passent` : 'Son joueur passe'} dans les non placés, sans nouveau tirage.` : 'Elle n\'a aucun joueur.'}</p>
      <p>${esc(gm)}, son MJ, redevient participant sur ce créneau${gmWishes.length ? ` et rejoint les non placés, avec ${gmWishes.length > 1 ? 'ses inscriptions' : 'son inscription'} à ${gmWishes.map((g) => `« ${esc(titleOf(g))} »`).join(', ')}` : ''}.</p>
      <p>À la publication, son MJ reçoit la notification « partie annulée ».</p>
      ${actionsOf('Annuler la partie', 'danger', 'Garder la partie')}`, { alert: true });
  }
  if (dl.type === 'publish') {
    const v = drawView(slot.id);
    return shell(`<h2 id="dialog-title">Publier le tirage du créneau ${slot.rank} ?</h2>
      <p>${countOf(v.placed, 'participant est placé', 'participants sont placés')}${v.unplaced.length ? `, ${v.unplaced.length} ${v.unplaced.length > 1 ? 'ne le sont pas' : 'ne l\'est pas'}` : ''}. Chacun reçoit sa notification, ainsi que les MJ.</p>
      ${v.under.length ? `<div class="warn-line">${icon('triangle-alert')}<div><p>${v.under.length > 1 ? `${v.under.length} parties sous leur minimum seront jouées ainsi :` : 'Une partie sous son minimum sera jouée ainsi :'}</p>${gameList(v.under, (i) => `<li>« ${esc(i.sc.title)} », ${tableName(i.game)} : ${countOf(i.count, 'joueur', 'joueurs')} pour ${formatSeats(i.min, i.max)}</li>`)}</div></div>` : ''}
      ${v.over.length ? `<div class="warn-line">${icon('triangle-alert')}<div><p>${v.over.length > 1 ? `${v.over.length} parties dépassent leur maximum :` : 'Une partie dépasse son maximum :'}</p>${gameList(v.over, (i) => `<li>« ${esc(i.sc.title)} », ${tableName(i.game)} : ${i.count} joueurs pour ${countOf(i.max, 'place', 'places')}</li>`)}</div></div>` : ''}
      ${v.canceled.length ? `<div><p>${v.canceled.length > 1 ? 'Parties annulées, dont le MJ est notifié :' : 'Partie annulée, dont le MJ est notifié :'}</p>${gameList(v.canceled, (i) => `<li>« ${esc(i.sc.title)} », ${esc(gmOf(i.game))}</li>`)}</div>` : ''}
      <p>Le résultat ne pourra plus être modifié.</p>
      ${actionsOf('Publier le tirage')}`, { alert: true });
  }
  if (dl.type === 'schedule') {
    const sc = SCENARIOS[dl.scenario];
    return shell(`<h2 id="dialog-title">Programmer « ${esc(sc.title)} » sur le créneau ${slot.rank}, ${tableById(dl.table).name} ?</h2>
      <p>Le tirage provisoire sera effacé, avec ses déplacements et ses parties annulées, et les inscriptions du créneau ${slot.rank} rouvertes.</p>
      <p>Tous ceux qui peuvent s'inscrire sur ce créneau reçoivent la notification « nouvelle partie », qui annonce la réouverture. Tu relanceras le tirage ensuite.</p>
      ${actionsOf('Programmer la partie', 'danger')}`, { alert: true });
  }
  if (dl.type === 'reserve') {
    return shell(`<h2 id="dialog-title">Programmer depuis la réserve du créneau ${slot.rank}</h2>${reserveCards(slot)}
      <div class="dialog-actions"><button type="button" class="btn quiet" data-act="dialog-cancel" data-initial data-key="dlg-cancel">Fermer</button></div>`, { wide: true });
  }
  if (dl.type === 'move') {
    const v = drawView(slot.id);
    const person = v.people.find((p) => p.pseudo === dl.pseudo);
    const current = v.unplaced.includes(dl.pseudo) ? null : d.assignments.get(dl.pseudo);
    const verb = current ? 'Déplacer' : 'Placer';
    const option = (value, isCurrent, table, label, figs, tags) => `<li><label class="${isCurrent ? 'current' : ''}"><input type="radio" name="move" value="${value}" data-key="choice-${value}"${isCurrent ? ' disabled' : ''}${dl.choice === value ? ' checked' : ''}><span class="t">${table}</span><span class="g"><b>${label}</b><span>${figs}</span></span><span class="tags">${tags}</span></label></li>`;
    const choices = v.live.map((i) => {
      const isCurrent = current === i.game.id;
      const signed = person.gameIds.includes(i.game.id);
      const after = i.count + 1;
      const tags = isCurrent ? `<span class="badge accent">${icon('check', 'i s')}Joue ici</span>`
        : `${signed ? `<span class="badge accent">${icon('check', 'i s')}inscrit</span>` : '<span class="badge">pas inscrit</span>'}${after > i.max ? `<span class="badge warning">${icon('triangle-alert', 'i s')}Au-delà du maximum</span>` : ''}`;
      return option(i.game.id, isCurrent, tableName(i.game), esc(i.sc.title), `${i.count}${NB}/${NB}${i.max} joueurs · ${formatSeats(i.min, i.max)}${i.under ? ' · sous son minimum' : ''}`, tags);
    });
    choices.push(option('none', current === null, '—', 'Non placés', countOf(v.unplaced.length, 'participant', 'participants'), current === null ? `<span class="badge accent">${icon('check', 'i s')}Ici</span>` : ''));
    const chosen = dl.choice && dl.choice !== 'none' ? infoOf(v, dl.choice) : null;
    const line = dl.error ? `${icon('triangle-alert')}<span>${dl.error}</span>`
      : chosen && chosen.count + 1 > chosen.max ? `${icon('triangle-alert')}<span>« ${esc(chosen.sc.title)} » passera à ${chosen.count + 1}${NB}joueurs pour ${countOf(chosen.max, 'place', 'places')}.</span>` : '';
    return shell(`<h2 id="dialog-title">${verb} ${esc(dl.pseudo)}</h2>
      <p>Inscriptions de ${esc(dl.pseudo)} sur le créneau ${slot.rank} : ${person.gameIds.map((id) => `« ${esc(titleOf(gameById(id)))} »`).join(', ')}.</p>
      <ul class="choices">${choices.join('')}</ul>
      <p class="warn-line" style="min-height:1.4em">${line}</p>
      ${actionsOf(verb)}`, { wide: false });
  }
  return '';
}

// ---------- Rendu, focus, annonces ----------
const main = document.getElementById('main');
const dialogRoot = document.getElementById('dialog-root');
const VARIANTS = { A: 'A · Onglets et dialogue', B: 'B · Plan de salle', C: 'C · Grille des inscrits' };

function render() {
  const focused = document.activeElement?.closest?.('[data-key]')?.dataset.key;
  const scrolls = [...document.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollLeft, el.scrollTop]);
  document.getElementById('rail-nav').innerHTML = fr(renderNav());
  main.innerHTML = fr(renderPage());
  dialogRoot.innerHTML = fr(renderDialog());
  for (const [key, left, top] of scrolls) {
    const el = document.querySelector(`[data-scroll="${key}"]`);
    if (el) { el.scrollLeft = left; el.scrollTop = top; }
  }
  if (focused) focusKey(focused);
  document.getElementById('proto-label').textContent = VARIANTS[ui.variant];
}
function focusKey(key) { document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus(); }
function focusInitial() { dialogRoot.querySelector('[data-initial]')?.focus(); }
const live = document.getElementById('live');
function announce(text) {
  live.textContent = '';
  setTimeout(() => { live.textContent = fr(text); }, 50);
}

function openDialog(dialog, opener) {
  ui.menu = false;
  ui.dialog = { ...dialog, slotId: dialog.slotId ?? ui.slot, opener };
  render();
  focusInitial();
}
function closeDialog() {
  const opener = ui.dialog?.opener;
  ui.dialog = null;
  render();
  if (opener) focusKey(opener);
}
function switchVariant(step) {
  const order = ['A', 'B', 'C'];
  ui.variant = order[(order.indexOf(ui.variant) + step + order.length) % order.length];
  ui.picked = null;
  ui.menu = false;
  ui.dialog = null;
  try { history.replaceState(null, '', `?variant=${ui.variant}`); } catch { /* fichier local : sans effet */ }
  render();
}

function announceMove(slotId, pseudo, gameId) {
  if (gameId === null) announce(`${pseudo} rejoint les non placés.`);
  else announce(`${pseudo} joue désormais à « ${titleOf(gameById(gameId))} », ${tableName(gameById(gameId))}.`);
}

function confirmDialog() {
  const dl = ui.dialog;
  const slotId = dl.slotId;
  const slot = slotById(slotId);
  if (dl.type === 'move') {
    if (!dl.choice) { dl.error = 'Choisis une partie, ou les non placés.'; render(); focusKey('dlg-confirm'); return; }
    const target = dl.choice === 'none' ? null : dl.choice;
    movePlayer(slotId, dl.pseudo, target);
    ui.dialog = null;
    render();
    focusKey(target ? `chip-${dl.pseudo}` : `place-${dl.pseudo}`);
    if (document.activeElement === document.body) focusKey(`tab-${ui.aTab}`);
    announceMove(slotId, dl.pseudo, target);
    return;
  }
  if (dl.type === 'launch') {
    launch(slotId);
    const v = drawView(slotId);
    announce(`Tirage lancé sur le créneau ${slot.rank} : ${v.placed} placés sur ${v.people.length}.`);
  } else if (dl.type === 'relaunch') {
    runDraw(slotId);
    const v = drawView(slotId);
    announce(`Tirage relancé : ${v.placed} placés sur ${v.people.length}.`);
  } else if (dl.type === 'reopen') {
    reopen(slotId);
    announce(`Inscriptions du créneau ${slot.rank} rouvertes.`);
  } else if (dl.type === 'cancel-game') {
    const n = infoOf(drawView(slotId), dl.gameId).count;
    cancelGame(slotId, dl.gameId);
    announce(`Partie annulée : « ${titleOf(gameById(dl.gameId))} ». ${countOf(n, 'joueur rejoint', 'joueurs rejoignent')} les non placés.`);
  } else if (dl.type === 'publish') {
    state[slotId] = 'published';
    announce(`Tirage du créneau ${slot.rank} publié.`);
  } else if (dl.type === 'schedule') {
    const game = scheduleFromReserve(slotId, dl.scenario, dl.table);
    announce(`Partie programmée : créneau ${slot.rank}, ${tableName(game)}. Les inscriptions du créneau sont rouvertes.`);
  }
  ui.dialog = null;
  ui.picked = null;
  render();
  if (dl.type === 'cancel-game') focusKey(`restore-${dl.gameId}`);
  else focusKey('summary-title');
}

const actions = {
  'proto-prev': () => switchVariant(-1),
  'proto-next': () => switchVariant(1),
  'proto-skip': () => {
    const first = firstUnpublished();
    if (first && state[first.id] === 'open') launch(first.id);
    if (first) ui.slot = first.id;
    render();
  },
  'proto-reset': () => {
    loadData();
    Object.assign(ui, { slot: 'c2', aTab: 'games', cTab: 'grid', cFilter: 'all', picked: null, menu: false, dialog: null });
    render();
  },
  slot: (el) => { ui.slot = el.dataset.id; ui.picked = null; ui.menu = false; render(); focusKey(`tile-${ui.slot}`); },
  'ask-launch': () => openDialog({ type: 'launch' }, 'launch'),
  'ask-relaunch': () => {
    const d = draws[ui.slot];
    if (d.moved.size) { openDialog({ type: 'relaunch' }, 'relaunch'); return; }
    runDraw(ui.slot);
    ui.picked = null;
    render();
    const v = drawView(ui.slot);
    announce(`Tirage relancé : ${v.placed} placés sur ${v.people.length}.`);
  },
  'ask-publish': () => openDialog({ type: 'publish' }, 'publish'),
  'ask-reopen': () => openDialog({ type: 'reopen' }, 'menu'),
  'open-reserve': () => openDialog({ type: 'reserve' }, 'menu'),
  'toggle-menu': () => { ui.menu = !ui.menu; render(); if (ui.menu) dialogRootFocusMenu(); },
  'ask-cancel': (el) => openDialog({ type: 'cancel-game', gameId: el.dataset.game }, `cancel-${el.dataset.game}`),
  'ask-schedule': (el) => openDialog({ type: 'schedule', scenario: el.dataset.scenario, table: el.dataset.table }, `schedule-${el.dataset.scenario}`),
  restore: (el) => {
    restoreGame(ui.slot, el.dataset.game);
    render();
    focusKey(`row-${el.dataset.game}`);
    announce(`Partie rétablie : « ${titleOf(gameById(el.dataset.game))} », sans joueur.`);
  },
  follow: (el) => {
    const code = el.dataset.code;
    if (ui.variant === 'A') { ui.aTab = code === 'unplaced' ? 'unplaced' : 'games'; render(); focusKey(`tab-${ui.aTab}`); }
    else if (ui.variant === 'C') { ui.cTab = 'grid'; ui.cFilter = 'unplaced'; render(); focusKey('filter-unplaced'); }
  },
  'a-tab': (el) => { ui.aTab = el.dataset.tab; render(); focusKey(`tab-${ui.aTab}`); },
  'c-tab': (el) => { ui.cTab = el.dataset.tab; render(); focusKey(`tab-${ui.cTab}`); },
  'c-filter': (el) => { ui.cFilter = el.dataset.filter; render(); },
  'a-move': (el) => openDialog({ type: 'move', pseudo: el.dataset.pseudo, choice: null, error: '' }, el.dataset.key),
  'b-pick': (el) => { ui.picked = ui.picked === el.dataset.pseudo ? null : el.dataset.pseudo; render(); focusKey(`chip-${el.dataset.pseudo}`); },
  'b-unpick': () => { const p = ui.picked; ui.picked = null; render(); focusKey(`chip-${p}`); },
  'b-place': (el) => {
    const pseudo = ui.picked;
    const target = el.dataset.game === 'none' ? null : el.dataset.game;
    movePlayer(ui.slot, pseudo, target);
    ui.picked = null;
    render();
    focusKey(`chip-${pseudo}`);
    announceMove(ui.slot, pseudo, target);
  },
  'c-cell': (el) => {
    const target = el.dataset.game === 'none' ? null : el.dataset.game;
    const v = drawView(ui.slot);
    const current = v.unplaced.includes(el.dataset.pseudo) ? null : draws[ui.slot].assignments.get(el.dataset.pseudo);
    if (current === target) return;
    movePlayer(ui.slot, el.dataset.pseudo, target);
    render();
    focusKey(el.dataset.key);
    announceMove(ui.slot, el.dataset.pseudo, target);
  },
  'dialog-cancel': () => closeDialog(),
  'dialog-confirm': () => confirmDialog(),
};
function dialogRootFocusMenu() { document.querySelector('.menu-pop [role="menuitem"]')?.focus(); }

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-act]');
  if (ui.menu && !event.target.closest('.menu-pop, [data-act="toggle-menu"]')) { ui.menu = false; if (!el) { render(); return; } }
  if (!el) return;
  actions[el.dataset.act]?.(el);
});
document.addEventListener('change', (event) => {
  if (event.target.name === 'move' && ui.dialog?.type === 'move') {
    ui.dialog.choice = event.target.value;
    ui.dialog.error = '';
    render();
    focusKey(`choice-${event.target.value}`);
  }
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if (ui.dialog) closeDialog();
    else if (ui.menu) { ui.menu = false; render(); focusKey('menu'); }
    else if (ui.picked) actions['b-unpick']();
    return;
  }
  if (ui.dialog) {
    if (event.key === 'Tab') {
      const focusables = [...dialogRoot.querySelectorAll('button, input:not([disabled])')];
      const first = focusables[0];
      const last = focusables.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
    return;
  }
  const tablist = event.target.closest?.('[role="tablist"]');
  if (tablist && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
    event.preventDefault();
    const tabs = [...tablist.querySelectorAll('[role="tab"]')];
    const index = tabs.indexOf(event.target.closest('[role="tab"]'));
    const next = { ArrowLeft: index - 1, ArrowRight: index + 1, Home: 0, End: tabs.length - 1 }[event.key];
    tabs[(next + tabs.length) % tabs.length].click();
    return;
  }
  if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && !event.altKey && !event.ctrlKey && !event.metaKey && !event.target.closest('input, textarea, [contenteditable]')) {
    switchVariant(event.key === 'ArrowLeft' ? -1 : 1);
  }
});

// ---------- Démarrage ----------
loadData();
ui.variant = ['A', 'B', 'C'].find((v) => v === new URLSearchParams(location.search).get('variant')) ?? 'A';
render();
</script>
