<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vue du MJ</title>
<!--
  PROTOTYPE JETABLE : ne pas reprendre ce code en production.
  Question : que voit un MJ sur son téléphone, en plus de ce que voit un participant, et où cette vue
  se place-t-elle dans la coquille à trois onglets (Accueil, Programme, Mes parties) ?
  Ticket « Vue du MJ sur son téléphone » (#54), carte « Front office mobile » (#42).

  Trois variantes, basculables par la barre (← →) ; le moment de la journée par ↑ ↓.
  Le téléphone est relié au MJ Kaïros : il mène La Tour d'ébène aux créneaux 2 (table Dragon) et 4 (table Wyverne),
  et joue aux créneaux 1 et 3. Rien n'est enregistré : tout vit en mémoire.
  L'Accueil, le Programme et la fiche reprennent la variante retenue de la coquille (#51).

    A « Quatrième onglet »   : un onglet « Je mène », pour les seuls téléphones reliés à un MJ.
    B « Dans Mes parties »   : trois onglets ; la partie menée se déplie dans Mes parties, sur son créneau.
    C « La fiche, côté MJ »  : trois onglets ; la vue du MJ est la fiche de sa partie, augmentée pour lui.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Aldrich&display=swap">
<style>
/* Thème sombre seul, comme la charte. Jetons repris de packages/design/tokens.css. */
/* Jetons repris de packages/design/tokens.css. Échelle typographique du mobile : provisoire, pour le prototype. */
:root {
  color-scheme: dark;
  --surface-0: #151717;
  --surface-1: #1b1e1e;
  --surface-2: #222525;
  --surface-3: #2a2d2d;
  --border: #313535;
  --text: #eceae6;
  --text-muted: #a9a49e;
  --accent: #fc9203;
  --on-accent: #161818;
  --focus: #7cc4e4;
  --success: #6cc08b;
  --warning: #e8d25c;
  --danger: #f07f63;
  --engraving: #3a3e3e;
  --engraving-strong: #626767;
  --initial: #8c837c;
  --emblem-1: #4e4944; --emblem-2: #5e5852; --emblem-3: #6e6862;
  --emblem-4: #7d766f; --emblem-5: #8c837c; --emblem-6: #a39a92;
  --font-display: 'Uncial Antiqua', serif;
  --font-caps: 'Aldrich', sans-serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-hero: 2rem;
  --fs-title: 1.625rem;
  --fs-section: 1.25rem;
  --fs-block: 1.0625rem;
  --fs-body: .9375rem;
  --fs-meta: .8125rem;
  --fs-over: .6875rem;
  --space-xxs: 2px; --space-xs: 4px; --space-s: 8px; --space-m: 12px;
  --space-l: 16px; --space-xl: 24px; --space-xxl: 32px;
  --radius-card: 12px; --radius-control: 8px; --radius-thumb: 6px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0b0c0c; color: var(--text); font: 400 var(--fs-body)/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
svg.i { width: 20px; height: 20px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.over { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .12em; font-size: var(--fs-over); color: var(--text-muted); }
.meta { color: var(--text-muted); font-size: var(--fs-meta); }
.stack { display: grid; gap: var(--space-s); }
.stack-l { display: grid; gap: var(--space-l); }
.pad { padding: var(--space-l); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Scène : téléphone sur ordinateur, plein écran sur téléphone ---------- */
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 16px 16px 96px; }
.notes { width: 320px; flex: none; color: #c9c4be; font: 13px/1.55 system-ui, sans-serif; display: none; }
.notes h2 { font: 600 15px/1.3 system-ui, sans-serif; color: #f1efec; margin: 0 0 6px; }
.notes h3 { font: 600 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #8f8a85; margin: 18px 0 6px; }
.notes p { margin: 0 0 8px; }
.notes .clock { font: 600 28px/1 system-ui, sans-serif; color: #f1efec; font-variant-numeric: tabular-nums; }
@media (min-width: 1000px) { .notes { display: block; } }
.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 120px)); min-height: 600px; border-radius: 46px; overflow: hidden; background: var(--surface-0); display: flex; flex-direction: column; box-shadow: 0 0 0 10px #1c1d1d, 0 0 0 11px #333; }
.statusbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font: 600 15px system-ui, sans-serif; background: var(--surface-1); }
.statusbar .sb-right { font-size: 12px; letter-spacing: .04em; }
.app { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
@media (max-width: 520px) {
  .stage { padding: 0; }
  .phone { width: 100vw; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; border-radius: 0; box-shadow: none; }
  .statusbar { display: none; }
}

/* ---------- Éléments communs ---------- */
.hdr { flex: none; display: flex; align-items: center; gap: var(--space-s); padding: var(--space-xs) var(--space-s) var(--space-xs) var(--space-l); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--space-s); min-width: 0; flex: 1; }
.emblem { width: 28px; height: 28px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.2; flex: 1; min-width: 0; }
.pseudo { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border); font-weight: 600; font-size: var(--fs-meta); flex: none; max-width: 150px; }
.pseudo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pseudo svg { width: 18px; height: 18px; color: var(--text-muted); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; flex: none; }
.icon-btn:hover { background: var(--surface-3); }

.bandeau { flex: none; display: flex; gap: var(--space-s); align-items: flex-start; width: 100%; min-height: 44px; padding: var(--space-s) var(--space-l); background: color-mix(in srgb, var(--warning) 14%, var(--surface-1)); border-bottom: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; text-align: left; }
.bandeau svg { width: 18px; height: 18px; color: var(--warning); margin-top: 1px; }
.bandeau .chev { margin-left: auto; color: var(--text-muted); }
.bandeau.bottom { border-bottom: 0; border-top: 1px solid var(--border); }

.tabbar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-1); border-top: 1px solid var(--border); padding-bottom: max(env(safe-area-inset-bottom), 8px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: var(--text-muted); font-size: .75rem; font-weight: 600; text-align: center; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--radius-control); font-weight: 600; font-size: var(--fs-body); border: 1px solid transparent; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface-3); border-color: var(--border); }
.btn-ghost { color: var(--accent); padding: 0 var(--space-s); }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--text-muted); }
.badge svg { width: 14px; height: 14px; }
.t-ok { color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface-2)); }
.t-warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, var(--surface-2)); }
.t-danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface-2)); }
.t-accent { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.t-neutral { color: var(--text); background: var(--surface-3); }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-xs); }

.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-card); }
.section-title { font-size: var(--fs-section); font-weight: 600; }
.block-title { font-size: var(--fs-block); font-weight: 600; line-height: 1.25; }

/* Illustration par défaut : motif gravé et lettrine, sur le tiers droit et dans le haut. */
.ill { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: var(--radius-card); background: var(--surface-2); border: 1px solid var(--border); width: 100%; display: block; text-align: left; }
.ill > svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, color-mix(in srgb, var(--surface-0) 94%, transparent) 82%); }
.ill-text { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--space-l); z-index: 1; display: grid; gap: var(--space-xs); }
.ill .corner { position: absolute; top: var(--space-m); left: var(--space-m); z-index: 1; }
.thumb { width: 44px; height: 44px; flex: none; border-radius: var(--radius-thumb); background: var(--surface-3); }
.lettrine { font-family: var(--font-display); fill: var(--initial); }

/* Ligne de partie */
.row { position: relative; display: flex; gap: var(--space-m); align-items: flex-start; padding: var(--space-m) var(--space-l); border-bottom: 1px solid var(--border); }
.row-hit { position: absolute; inset: 0; z-index: 0; }
.row-hit:focus-visible { outline-offset: -2px; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; pointer-events: none; }
.row-title { font-weight: 600; font-size: var(--fs-block); line-height: 1.25; }
.row-side { position: relative; z-index: 1; flex: none; align-self: center; }
.toggle { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-3); color: var(--text); }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.toggle:disabled { opacity: .55; cursor: default; }

.slot-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: var(--space-s); padding: var(--space-s) var(--space-l); background: var(--surface-1); border-bottom: 1px solid var(--border); min-height: 44px; }
.slot-head .over { color: var(--text); }

.status { display: flex; gap: var(--space-s); align-items: flex-start; }
.status svg { width: 18px; height: 18px; margin-top: 1px; }
.tone-ok { color: var(--success); } .tone-warn { color: var(--warning); } .tone-accent { color: var(--accent); } .tone-muted { color: var(--text-muted); } .tone-neutral { color: var(--text); }
.past { opacity: .55; }
.empty { display: grid; justify-items: center; gap: var(--space-s); text-align: center; padding: var(--space-xxl) var(--space-l); color: var(--text-muted); }
.empty svg.eng { width: 120px; height: 120px; }

/* Cartes d'état (héros) */
.hero { position: relative; overflow: hidden; display: grid; gap: var(--space-s); padding: var(--space-l); width: 100%; text-align: left; }
.hero .eng-bg { position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; pointer-events: none; }
.hero > * { position: relative; }
.hero-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.hero-table { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-hero); line-height: 1.1; }
.hero.warn { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
.hero.flat { border-left: 4px solid var(--accent); }
.hero.flat.warn { border-left-color: var(--warning); }
.hero.flat.ok { border-left-color: var(--success); }
.left-list { display: grid; gap: 1px; background: var(--border); border-radius: var(--radius-control); overflow: hidden; margin-top: var(--space-xs); }
.left-item { display: flex; align-items: center; gap: var(--space-m); padding: var(--space-s) var(--space-m); background: var(--surface-3); min-height: 52px; width: 100%; text-align: left; }
.left-item > div { flex: 1; min-width: 0; }
.counts { display: grid; grid-template-columns: 1fr; gap: var(--space-xs); margin-top: var(--space-xs); }
.counts > div { background: var(--surface-3); border-radius: var(--radius-control); padding: var(--space-s) var(--space-m); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-s); }
.counts strong { font-size: var(--fs-body); }

/* A : puces de créneau */
.chips { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-xs); padding: var(--space-s) var(--space-l); background: var(--surface-0); border-bottom: 1px solid var(--border); }
.chip { display: grid; justify-items: center; gap: 1px; min-height: 48px; padding: var(--space-xs); border-radius: var(--radius-control); background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-meta); font-weight: 600; }
.chip .over { font-size: .625rem; }
.chip[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.chip[aria-selected="true"] .over { color: var(--accent); }
.state-line { display: flex; align-items: center; gap: var(--space-s); padding: var(--space-m) var(--space-l) 0; }
/* Écran d'attente */
.closed { position: relative; min-height: 100%; display: grid; align-content: center; justify-items: center; gap: var(--space-l); padding: var(--space-xxl) var(--space-xl); text-align: center; overflow: hidden; }
.closed > * { position: relative; }
.closed .eng-closed { position: absolute; width: 520px; height: 520px; top: 50%; left: 50%; translate: -50% -50%; }
.emblem-big { width: 96px; height: 96px; }
.closed-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); }

/* Fiche (ébauche commune) et superpositions */
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--surface-0); animation: slide-in 160ms ease-out; }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
.sheet-bar { flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xs) var(--space-s); min-height: 56px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet-actions { flex: none; display: grid; gap: var(--space-s); padding: var(--space-m) var(--space-l) max(env(safe-area-inset-bottom), var(--space-m)); background: var(--surface-1); border-top: 1px solid var(--border); }
.fiche-title { font-family: var(--font-display); font-weight: normal; font-size: var(--fs-title); line-height: 1.15; }
.warn-note { display: flex; gap: var(--space-s); color: var(--warning); font-size: var(--fs-meta); font-weight: 600; }
.warn-note svg { width: 18px; height: 18px; }
.cw { padding: var(--space-m); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-control); display: grid; gap: var(--space-xs); }
.scrim { position: absolute; inset: 0; z-index: 29; background: color-mix(in srgb, var(--surface-0) 72%, transparent); animation: fade-in 140ms ease-out; }
.menu { --menu-edge: color-mix(in srgb, var(--accent) 60%, var(--border)); position: absolute; z-index: 30; top: 62px; right: var(--space-s); width: 264px; padding: var(--space-l); display: grid; gap: var(--space-s); background: var(--surface-3); border: 1px solid var(--menu-edge); border-radius: var(--radius-card); animation: pop-in 140ms ease-out; transform-origin: top right; }
.menu::before { content: ''; position: absolute; top: -7px; right: 52px; width: 12px; height: 12px; background: var(--surface-3); border-left: 1px solid var(--menu-edge); border-top: 1px solid var(--menu-edge); rotate: 45deg; }
.menu .btn-secondary { background: var(--surface-2); }
.pseudo[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.pseudo[aria-expanded="true"] svg { color: var(--accent); }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
@keyframes fade-in { from { opacity: 0; } }
.toast { position: absolute; z-index: 40; left: var(--space-l); right: var(--space-l); bottom: 84px; padding: var(--space-m) var(--space-l); background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-control); font-size: var(--fs-meta); }
.toast strong { display: block; color: var(--text); font-size: var(--fs-body); }

/* ---------- Barre du prototype : hors du design évalué ---------- */
.switcher { position: fixed; left: 50%; bottom: 14px; translate: -50% 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 6px; max-width: calc(100vw - 16px); background: #f4f4f4; color: #111; border-radius: 24px; box-shadow: 0 8px 28px rgba(0, 0, 0, .55); font: 600 13px/1 system-ui, sans-serif; }
.switcher button, .switcher select { font: inherit; color: #111; background: #e2e2e2; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.switcher select { max-width: 330px; }
.switcher .label { padding: 0 6px; min-width: 180px; text-align: center; }
.switcher label { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; }
.switcher .sep { width: 1px; height: 22px; background: #c8c8c8; }
.switcher :focus-visible { outline: 2px solid #1a6bb0; outline-offset: 2px; }
.switcher .sw-toggle { display: none; }
@media (max-width: 520px) {
  .switcher { top: calc(6px + env(safe-area-inset-top, 0px)); bottom: auto; border-radius: 16px; }
  .switcher .sw-toggle { display: inline-block; }
  .switcher.collapsed { padding: 4px; }
  .switcher.collapsed > :not(.sw-toggle) { display: none; }
}

/* ---------- Vue du MJ ---------- */
.mj-card { display: grid; gap: var(--space-m); padding: var(--space-l); scroll-margin-top: var(--space-s); }
.mj-head { display: flex; gap: var(--space-m); align-items: flex-start; }
.mj-head > div { flex: 1; min-width: 0; display: grid; gap: 2px; justify-items: start; }
.mj-panel { display: grid; gap: var(--space-m); padding: var(--space-l); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }
.roster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-xs); }
.roster li { display: flex; align-items: center; gap: var(--space-s); min-width: 0; padding: var(--space-s); background: var(--surface-3); border-radius: var(--radius-control); font-weight: 600; }
.roster li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ini { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-1); border: 1px solid var(--engraving-strong); font-family: var(--font-display); color: var(--initial); }
.lead-note { display: flex; gap: var(--space-s); align-items: flex-start; margin: var(--space-m) var(--space-l) 0; padding: var(--space-m); background: color-mix(in srgb, var(--accent) 10%, var(--surface-1)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: var(--radius-control); font-size: var(--fs-meta); }
.lead-note svg { width: 18px; height: 18px; color: var(--accent); margin-top: 1px; }
.lead-note.warn { background: color-mix(in srgb, var(--warning) 12%, var(--surface-1)); border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); }
.lead-note.warn svg { color: var(--warning); }
.chip .lead { color: var(--accent); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 45% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }
.alert { position: absolute; z-index: 35; left: var(--space-s); right: var(--space-s); bottom: 80px; display: flex; gap: var(--space-xs); align-items: center; padding: var(--space-m) var(--space-xs) var(--space-m) var(--space-m); background: var(--surface-3); border: 1px solid color-mix(in srgb, var(--accent) 60%, var(--border)); border-radius: var(--radius-card); animation: pop-in 140ms ease-out; }
.alert > div { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: var(--fs-meta); color: var(--text-muted); }
.alert strong { font-size: var(--fs-body); color: var(--text); }
.toast { top: var(--space-s); bottom: auto; }
.toast .over { display: block; margin-bottom: 2px; }

  { key: 'pause', clock: 760, label: '12 h 40 · pause, créneau 2 pas encore tiré', slots: ['published', 'open', 'open', 'open'], results: { 1: 'g13' }, lead: { k2: { n: 7 }, k4: { n: 2 } },

  { key: 'c2-annulee', clock: 802, label: '13 h 22 · créneau 2 publié : partie annulée', slots: ['published', 'published', 'open', 'open'], results: { 1: 'g13' }, lead: { k2: { cancelled: true, n: 3 }, k4: { n: 2 } },

  { key: 'c2-en-cours', clock: 855, label: '14 h 15 · créneau 2 en cours', slots: ['published', 'published', 'open', 'open'], results: { 1: 'g13' }, lead: { k2: { players: ROSTER }, k4: { n: 3 } },
    note: "Kaïros mène à la table Dragon. Il veut retrouver ses joueurs sans chercher." },
  { key: 'c3-ajoutee', clock: 865, label: '14 h 25 · partie ajoutée au créneau 3', slots: ['published', 'published', 'open', 'open'], results: { 1: 'g13' }, lead: { k2: { players: ROSTER }, k3: { n: 0 }, k4: { n: 3 } }, signups: ['g11', 'g13'], alert: true,
    note: "À 14 h 20, un Organisateur a programmé Le Masque de jade, de Kaïros, au créneau 3, depuis la réserve. Son inscription au créneau 3 est retirée (IN-4). Application ouverte : l'alerte de NO-5, dont « Voir » ouvre la vue du MJ." },
];
const VARIANTS = {
  A: { name: 'Quatrième onglet', pitch: "Un onglet « Je mène », pour les seuls téléphones reliés à un MJ. Il réunit les parties à mener, une carte par partie : créneau, table, inscrits, puis les joueurs à la publication. Mes parties ne garde que le côté joueur, avec un renvoi sur chaque créneau mené. Les notifications du MJ et « Voir tes joueurs » ouvrent l'onglet sur la partie." },
  B: { name: 'Dans Mes parties', pitch: "Trois onglets, comme pour tout le monde. Mes parties raconte la journée créneau par créneau, dans les deux rôles : sur un créneau où tu mènes, la partie s'y déplie en entier (inscrits, joueurs). Les notifications du MJ et « Voir tes joueurs » ouvrent Mes parties sur ce créneau." },
  C: { name: 'La fiche, côté MJ', pitch: "Trois onglets. La vue du MJ est la fiche de sa partie : en haut, ce qui ne regarde que lui (inscrits, joueurs) ; dessous, la fiche telle que la lisent les joueurs. On y arrive par l'Accueil, Mes parties, le Programme ou la notification. Pas d'autre liste des parties menées que Mes parties." },
};
const KEYS = Object.keys(VARIANTS);

/* ================= État ================= */
const fromHash = () => { const k = location.hash.replace('#variante-', '').toUpperCase(); return KEYS.includes(k) ? k : null; };
const S = { variant: fromHash() ?? 'A', moment: 0, tab: 'accueil', progSlot: null, fiche: null, target: null, menu: false, alert: false, toast: null, signups: new Set() };

const M = () => MOMENTS[S.moment];
const G = (id) => GAMES.find((g) => g.id === id);
const clock = () => M().clock;
const fmt = (min) => `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}`;
const plural = (k, w) => `${k} ${w}${k > 1 ? 's' : ''}`;
const listFr = (a) => (a.length <= 1 ? a.join('') : `${a.slice(0, -1).join(', ')} et ${a[a.length - 1]}`);
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const badge = (tone, ic, label) => `<span class="badge t-${tone}">${icon(ic)}${label}</span>`;

let toastTimer;
function resetMoment() {
  S.signups = new Set(M().signups ?? SIGNUPS);
  S.alert = !!M().alert;
  S.fiche = null; S.menu = false; S.target = null; S.progSlot = null; S.toast = null;
  clearTimeout(toastTimer);
}

/* ================= Règles (simplifiées) ================= */
const slotState = (n) => M().slots[n - 1];
function timeOf(n, double) {
  const s = SLOTS[n - 1].s, e = (double ? SLOTS[n] : SLOTS[n - 1]).e, c = clock();
  return c < s ? 'upcoming' : c < e ? 'current' : 'past';
}
const visible = (g) => !g.from || g.from <= clock();
const gamesOn = (n) => GAMES.filter((g) => visible(g) && (g.slot === n || (g.double && g.slot + 1 === n)));
const leadOn = (n) => gamesOn(n).find((g) => g.mine);
const lead = (g) => M().lead[g.id] ?? { n: 0 };
const ledGames = () => GAMES.filter((g) => g.mine && visible(g) && timeOf(g.slot, g.double) !== 'past');
const slotName = (n, double) => (double ? `Créneaux ${n} et ${n + 1}` : `Créneau ${n}`);
const slotRange = (n, double) => `${SLOTS[n - 1].start} – ${(double ? SLOTS[n] : SLOTS[n - 1]).end}`;
const inscrits = (g) => (g.mine ? lead(g).n ?? 0 : g.others + (S.signups.has(g.id) ? 1 : 0));
const roomLeft = (n) => gamesOn(n).filter((g) => !g.mine && (g.players ?? 0) < g.max);

// Ce que le créneau n est pour Kaïros.
function mine(n) {
  const st = slotState(n);
  const lg = leadOn(n);
  if (lg) return lead(lg).cancelled && st === 'published' ? { kind: 'cancelled', game: lg, left: roomLeft(n) } : { kind: 'leads', game: lg, st };
  if (st === 'published') {
    const r = M().results[n];
    return r ? { kind: 'assigned', game: G(r) } : { kind: 'none' };
  }
  const signups = gamesOn(n).filter((g) => S.signups.has(g.id));
  return { kind: st === 'drawing' ? 'pending' : 'open', signups };
}

// La carte à montrer en premier sur l'Accueil.
function focus() {
  for (let n = 4; n >= 1; n--) {
    if (slotState(n) !== 'published') continue;
    const m = mine(n);
    if (!['assigned', 'leads', 'cancelled'].includes(m.kind)) continue;
    if (timeOf(n, m.game.double) !== 'past') return { type: m.kind, n, m };
    break;
  }
  for (let n = 1; n <= 4; n++) {
    if (slotState(n) !== 'drawing' || timeOf(n) === 'past') continue;
    const m = mine(n);
    if (m.kind === 'leads') return { type: 'leads-pending', n, m };
    if (m.signups?.length) return { type: 'pending', n, m };
  }
  return { type: 'open' };
}
const firstSlot = () => focus().n ?? SLOTS.find((s) => timeOf(s.n) !== 'past')?.n ?? 4;

function canSignUp(g) {
  if (g.mine) return { ok: false, why: 'Tu mènes cette partie.' };
  for (const n of g.double ? [g.slot, g.slot + 1] : [g.slot]) {
    const st = slotState(n);
    if (leadOn(n) && mine(n).kind !== 'cancelled') return { ok: false, why: n !== g.slot ? `Tu mènes une partie au créneau ${n} : tu ne peux pas t'inscrire à cette partie double.` : "Tu mènes une partie sur ce créneau : tu ne peux pas t'y inscrire comme joueur." };
    if (st === 'drawing') return { ok: false, why: `Tirage en cours : les inscriptions du créneau ${n} sont fermées.` };
    if (st === 'published') return { ok: false, why: `Le tirage du créneau ${n} est publié.` };
  }
  return { ok: true };
}

/* ================= Morceaux communs ================= */
function initialOf(title) {
  const words = title.trim().split(/\s+/);
  let w = words[0];
  if (/^l['’]/i.test(w)) w = w.slice(2);
  else if (['le', 'la', 'les', 'un', 'une', 'des', 'the', 'a', 'an'].includes(w.toLowerCase()) && words[1]) w = words[1];
  return w.charAt(0).toLocaleUpperCase('fr');
}
const thumb = (g, size = 44) => `<svg class="thumb" style="width:${size}px;height:${size}px" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#engraving-small" x="-100" y="-100" width="200" height="200"/><text class="lettrine" x="0" y="8" text-anchor="middle" dominant-baseline="middle" font-size="92">${initialOf(g.title)}</text></svg>`;
const art = (g) => `<svg class="art" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#engraving-initial" x="168" y="-4" width="164" height="164"/><text class="lettrine" x="250" y="82" text-anchor="middle" dominant-baseline="middle" font-size="66">${initialOf(g.title)}</text></svg>`;
const engraving = (cls) => `<svg class="${cls}" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#engraving" x="-100" y="-100" width="200" height="200"/></svg>`;

function counter(g) {
  const st = slotState(g.slot), L = g.mine ? lead(g) : null;
  if (L?.cancelled && st === 'published') return 'Partie annulée';
  if (st === 'published') {
    const k = L ? L.players?.length : g.players;
    if (k != null) return `${plural(k, 'joueur')} · ${plural(g.max, 'place')}`;
  }
  const k = inscrits(g);
  return `${k ? plural(k, 'inscrit') : 'Aucun inscrit'} · ${plural(g.max, 'place')}`;
}
const oversubscribed = (g) => slotState(g.slot) !== 'published' && inscrits(g) > g.max;
const tresDemandee = (g) => (oversubscribed(g) ? badge('warn', 'triangle-alert', 'Très demandée') : '');

function slotBadge(n) {
  const t = timeOf(n), st = slotState(n);
  if (t === 'current') return badge('accent', 'clock', 'Maintenant');
  if (st === 'open') return badge('accent', 'circle-check', 'Inscriptions ouvertes');
  if (st === 'drawing') return badge('neutral', 'hourglass', 'Tirage en cours');
  return badge('ok', 'circle-check', 'Tirage publié');
}
const whenBadge = (g) => (timeOf(g.slot, g.double) === 'current'
  ? badge('accent', 'clock', `Maintenant · jusqu'à ${(g.double ? SLOTS[g.slot] : SLOTS[g.slot - 1]).end}`)
  : badge('neutral', 'clock', `Début à ${SLOTS[g.slot - 1].start}`));

// Une ligne d'état par créneau, pour Kaïros.
function mineLine(n) {
  const m = mine(n), g = m.game;
  switch (m.kind) {
    case 'leads': {
      const detail = m.st === 'published' ? `${g.title}, avec ${plural(lead(g).players.length, 'joueur')}` : m.st === 'drawing' ? `${g.title} · tirage en cours` : `${g.title} · ${counter(g)}`;
      return { tone: 'accent', ic: 'book-open', label: `Tu mènes à la table ${g.table}`, detail, act: 'mj', id: g.id };
    }
    case 'cancelled': return { tone: 'warn', ic: 'triangle-alert', label: 'Ta partie est annulée', detail: m.left.length ? `Il reste de la place aux tables ${listFr(m.left.map((x) => x.table))}` : 'Toutes les parties du créneau sont complètes.', act: 'goto-prog', n };
    case 'assigned': return { tone: 'ok', ic: 'circle-check', label: `Table ${g.table}`, detail: `${g.title}, avec ${g.mj}`, act: 'fiche', id: g.id };
    case 'pending': return { tone: 'neutral', ic: 'hourglass', label: 'Tirage en cours', detail: m.signups.length ? `${plural(m.signups.length, 'inscription')} : ${listFr(m.signups.map((x) => x.title))}` : 'Aucune inscription', act: 'goto-prog', n };
    case 'open': return m.signups.length
      ? { tone: 'accent', ic: 'circle-check', label: plural(m.signups.length, 'inscription'), detail: listFr(m.signups.map((x) => x.title)), act: 'goto-prog', n }
      : { tone: 'muted', ic: 'plus', label: 'Aucune inscription', detail: 'Choisir une partie', act: 'goto-prog', n };
    default: return { tone: 'muted', ic: 'circle-check', label: 'Tirage publié', detail: 'Aucune inscription sur ce créneau', act: 'goto-prog', n };
  }
}
const statusHTML = (l) => `<div class="status tone-${l.tone}">${icon(l.ic)}<div><div style="font-weight:600">${l.label}</div>${l.detail ? `<div class="meta">${l.detail}</div>` : ''}</div></div>`;

const header = () => `<header class="hdr"><div class="brand"><svg class="emblem" aria-hidden="true"><use href="#emblem-small"/></svg><span class="brand-name">Histoires de Chimères</span></div><button class="pseudo" data-act="menu" aria-haspopup="dialog" aria-expanded="${S.menu}">${icon('user-round')}<span>Kaïros</span></button></header>`;
const tabbar = (items, current) => `<nav class="tabbar" aria-label="Navigation principale">${items.map(([k, ic, label]) => `<button class="tab" data-act="tab" data-v="${k}" ${k === current ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`;

/* ---------- Le cœur de la vue du MJ : l'état de sa partie, puis ses joueurs ---------- */
function mjBody(g) {
  const L = lead(g), st = slotState(g.slot);
  if (L.cancelled && st === 'published') {
    const left = roomLeft(g.slot);
    return `<div class="badges">${badge('danger', 'triangle-alert', 'Partie annulée')}</div>
      <p>${g.title} n'a pas atteint son minimum : ${plural(L.n, 'inscrit')} pour ${g.min} joueurs au moins. ${left.length ? `Il reste de la place aux tables ${listFr(left.map((x) => x.table))} : va voir leur MJ.` : 'Toutes les parties du créneau sont complètes.'}</p>
      ${left.length ? `<div class="left-list">${left.map((x) => `<button class="left-item" data-act="fiche" data-id="${x.id}">${thumb(x, 36)}<div><div style="font-weight:600">Table ${x.table}</div><div class="meta">${x.title}, avec ${x.mj}</div></div>${badge('ok', 'users', plural(x.max - x.players, 'place'))}</button>`).join('')}</div>` : ''}`;
  }
  if (st === 'published') {
    const players = [...L.players].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
    return `<div class="badges">${whenBadge(g)}${badge('ok', 'circle-check', 'Tirage publié')}</div>
      <div class="stack"><h3 class="over">Tes ${plural(players.length, 'joueur')} · ${g.min} à ${g.max} places</h3>
      <ul class="roster">${players.map((p) => `<li><span class="ini" aria-hidden="true">${initialOf(p)}</span><span>${p}</span></li>`).join('')}</ul></div>`;
  }
  const k = inscrits(g);
  if (st === 'drawing') {
    return `<div class="badges">${whenBadge(g)}${badge('neutral', 'hourglass', 'Tirage en cours')}</div>
      <p>Les inscriptions sont fermées : ${plural(k, 'inscrit')} pour ${plural(g.max, 'place')}. Tes joueurs s'afficheront ici à la publication.</p>`;
  }
  const hint = k > g.max ? `Le tirage choisira ${g.max} joueurs parmi les inscrits.` : k < g.min ? `Il faut ${g.min} joueurs au moins.` : '';
  return `<div class="badges">${whenBadge(g)}${badge('accent', 'circle-check', 'Inscriptions ouvertes')}${tresDemandee(g)}</div>
    <p><strong class="num">${k ? plural(k, 'inscrit') : 'Aucun inscrit'}</strong> <span class="meta num">· ${g.min} à ${g.max} places</span></p>
    <p class="meta">${hint ? hint + ' ' : ''}Tes joueurs s'afficheront ici à la publication du tirage.</p>`;
}

/* ================= Écrans communs : Accueil, Programme ================= */
function heroBig(f) {
  if (f.type === 'assigned' || (f.type === 'leads' && f.m.st === 'published')) {
    const g = f.m.game, dbl = !!g.double, leads = f.type === 'leads';
    return `<button class="ill" data-act="${leads ? 'mj' : 'fiche'}" data-id="${g.id}">${art(g)}
      <span class="corner">${whenBadge(g)}</span>
      <span class="ill-text"><span class="over">${slotName(f.n, dbl)} · ${slotRange(f.n, dbl)}</span>
      <span class="${leads ? 'hero-title' : 'hero-table'}">${leads ? `Tu mènes à la table ${g.table}` : `Table ${g.table}`}</span>
      <span>${leads ? `<strong>${g.title}</strong>, avec ${plural(lead(g).players.length, 'joueur')}.` : `Tu joues à <strong>${g.title}</strong>, avec ${g.mj}.`}</span><span class="meta">${g.system}</span></span></button>
      ${leads ? `<button class="btn btn-secondary btn-block" data-act="mj" data-id="${g.id}">${icon('users')}Voir tes joueurs</button>` : ''}`;
  }
  if (f.type === 'cancelled') {
    const g = f.m.game, left = f.m.left;
    return `<section class="card hero warn"><span class="over">${slotName(f.n)} · ${slotRange(f.n)}</span>
      <h2 class="hero-title">Ta partie est annulée</h2>
      <p>${g.title} n'a pas atteint son minimum. ${left.length ? `Il reste de la place aux tables ${listFr(left.map((x) => x.table))} : va voir leur MJ.` : 'Toutes les parties du créneau sont complètes.'}</p>
      <div class="left-list">${left.map((x) => `<button class="left-item" data-act="fiche" data-id="${x.id}">${thumb(x, 36)}<div><div style="font-weight:600">Table ${x.table}</div><div class="meta">${x.title}, avec ${x.mj}</div></div>${badge('ok', 'users', plural(x.max - x.players, 'place'))}</button>`).join('')}</div></section>`;
  }
  if (f.type === 'leads-pending') {
    const g = f.m.game;
    return `<section class="card hero">${engraving('eng-bg')}<span class="over">${slotName(f.n)} · ${slotRange(f.n)}</span>
      <h2 class="hero-title">Tirage en cours</h2>
      <p>Tu mènes ${g.title} à la table ${g.table} : ${plural(inscrits(g), 'inscrit')} pour ${plural(g.max, 'place')}.</p>
      <p class="meta">Tes joueurs s'afficheront dès la publication.</p>
      <div><button class="btn btn-secondary" data-act="mj" data-id="${g.id}">${icon('book-open')}Voir ta partie</button></div></section>`;
  }
  if (f.type === 'pending') {
    return `<section class="card hero">${engraving('eng-bg')}<span class="over">${slotName(f.n)} · ${slotRange(f.n)}</span>
      <h2 class="hero-title">Tirage en cours</h2><p>Tes inscriptions comptent pour ce tirage : ${listFr(f.m.signups.map((g) => g.title))}.</p></section>`;
  }
  return `<section class="card hero">${engraving('eng-bg')}<span class="over">Inscriptions ouvertes</span>
    <h2 class="hero-title">Choisis tes parties</h2>
    <p>Chaque créneau est tiré au sort peu avant son début.</p>
    <div><button class="btn btn-primary" data-act="goto-prog" data-n="${firstSlot()}">${icon('calendar')}Voir le programme</button></div></section>`;
}
function accueil() {
  const f = focus();
  const next = SLOTS.filter((s) => timeOf(s.n) !== 'past' && s.n !== f.n);
  return `<div class="pad stack-l">${heroBig(f)}
    ${next.length ? `<section class="stack"><h2 class="section-title">Ton programme</h2>
      <ul class="card" style="overflow:hidden">${next.map((s) => { const l = mineLine(s.n); return `<li style="border-bottom:1px solid var(--border)"><button class="row" style="border:0;width:100%;text-align:left" data-act="${l.act}" data-id="${l.id ?? ''}" data-n="${s.n}"><div class="row-main"><span class="over">${slotName(s.n)} · ${s.start}</span>${statusHTML(l)}</div>${icon('chevron-right', 'i tone-muted')}</button></li>`; }).join('')}</ul></section>` : ''}
  </div>`;
}
function programme() {
  const n = S.progSlot ?? firstSlot();
  const shown = SLOTS.filter((s) => timeOf(s.n) !== 'past');
  const m = mine(n), lg = leadOn(n);
  let note = '';
  if (m.kind === 'cancelled') note = `<p class="lead-note warn">${icon('triangle-alert')}<span>Ta partie est annulée. ${m.left.length ? `Il reste de la place aux tables ${listFr(m.left.map((x) => x.table))} : va voir leur MJ.` : ''}</span></p>`;
  else if (lg) note = `<p class="lead-note">${icon('book-open')}<span>Tu mènes <strong>${lg.title}</strong> à la table ${lg.table} : tu ne peux pas t'inscrire comme joueur sur ce créneau.</span></p>`;
  return `<div class="chips" role="tablist" aria-label="Créneaux" style="grid-template-columns:repeat(${shown.length}, 1fr)">${shown.map((s) => `<button class="chip" role="tab" data-act="prog-slot" data-n="${s.n}" aria-selected="${s.n === n}"><span class="over">Créneau ${s.n}</span><span class="num">${leadOn(s.n) ? icon('book-open', 'i lead') : ''} ${s.start}</span></button>`).join('')}</div>
    <div class="state-line"><span class="meta num">${slotRange(n)}</span>${slotBadge(n)}</div>${note}
    <div class="pad stack-l">${gamesOn(n).map(bigGameCard).join('')}</div>`;
}
function bigGameCard(g) {
  const badges = [];
  const r = mine(g.slot);
  if (S.signups.has(g.id) && slotState(g.slot) !== 'published') badges.push(badge('accent', 'check', 'Inscrit'));
  if (r.kind === 'assigned' && r.game.id === g.id) badges.push(badge('ok', 'circle-check', 'Ta table'));
  if (g.mine) badges.push(r.kind === 'cancelled' ? badge('danger', 'triangle-alert', 'Annulée') : badge('accent', 'book-open', 'Tu mènes'));
  if (g.double) badges.push(badge('neutral', 'clock', `Double · créneaux ${g.slot} et ${g.slot + 1}`));
  if (g.from) badges.push(badge('accent', 'sparkles', 'Nouvelle'));
  return `<button class="ill" data-act="fiche" data-id="${g.id}">${art(g)}
    ${badges.length ? `<span class="corner badges">${badges.join('')}</span>` : ''}
    <span class="ill-text"><span class="over">Table ${g.table}</span><span class="block-title">${g.title}</span>
    <span class="meta">${g.system} · avec ${g.mj}</span>
    <span class="badges" style="align-items:center"><span class="meta num">${counter(g)}</span>${tresDemandee(g)}</span></span></button>`;
}

/* ================= Mes parties ================= */
// inlineMj : la partie menée se déplie sur son créneau (variante B).
function mesParties(inlineMj) {
  return `<div class="stack">${SLOTS.filter((s) => timeOf(s.n) !== 'past').map((s) => {
    const n = s.n, m = mine(n);
    let content;
    if ((m.kind === 'leads' || m.kind === 'cancelled') && inlineMj) {
      const g = m.game;
      content = `<div class="card mj-card"><div class="mj-head">${thumb(g, 48)}<div><span class="over">Tu mènes</span><span class="block-title">Table ${g.table}</span><button class="link" data-act="fiche" data-id="${g.id}">${g.title}</button></div></div>${mjBody(g)}</div>`;
    } else if (m.kind === 'leads' || m.kind === 'cancelled' || m.kind === 'assigned') {
      const l = mineLine(n);
      content = `<button class="mine-item" data-act="${m.kind === 'assigned' ? 'fiche' : 'mj'}" data-id="${m.game.id}">${thumb(m.game, 36)}<div>${statusHTML(l)}</div>${icon('chevron-right', 'i tone-muted')}</button>`;
    } else if (m.signups?.length) {
      content = m.signups.map((g) => `<button class="mine-item" data-act="fiche" data-id="${g.id}">${thumb(g, 36)}<div><div style="font-weight:600">${g.title}</div><div class="meta num">Table ${g.table} · ${counter(g)}</div></div>${m.kind === 'pending' ? icon('lock', 'i tone-muted') : tresDemandee(g)}</button>`).join('');
    } else if (m.kind === 'open') {
      content = `<div class="mine-item" style="justify-content:space-between"><span class="meta">Aucune inscription</span><button class="btn btn-ghost" data-act="goto-prog" data-n="${n}">Choisir une partie</button></div>`;
    } else {
      content = `<div class="mine-item"><span class="meta">Aucune inscription sur ce créneau</span></div>`;
    }
    return `<section id="slot-${n}"><div class="slot-head"><span class="over">${slotName(n)} · ${slotRange(n)}</span>${slotBadge(n)}</div><div class="pad stack" style="padding-block:var(--space-s)">${content}</div></section>`;
  }).join('')}</div>`;
}

/* ================= A : l'onglet « Je mène » ================= */
function jeMene() {
  const games = ledGames();
  if (!games.length) return `<div class="empty">${engraving('eng')}<p>Tu ne mènes plus de partie aujourd'hui. Les dés se reposent.</p></div>`;
  return `<div class="pad stack-l"><p class="meta">Les parties que tu mènes, dans l'ordre de la journée.</p>
    ${games.map((g) => `<section class="card mj-card" id="mj-${g.id}">
      <div class="mj-head">${thumb(g, 56)}<div><span class="over">${slotName(g.slot, g.double)} · ${slotRange(g.slot, g.double)}</span>
        <h2 class="hero-title">Table ${g.table}</h2>
        <button class="link" data-act="fiche" data-id="${g.id}">${g.title}</button><span class="meta">${g.system}</span></div></div>
      ${mjBody(g)}</section>`).join('')}</div>`;
}

/* ================= Fiche d'une partie ================= */
function ficheHead(g) {
  const dbl = !!g.double;
  return `<div class="sheet-bar"><button class="icon-btn" data-act="back" aria-label="Retour">${icon('chevron-left')}</button><span class="over">${slotName(g.slot, dbl)} · table ${g.table}</span></div>`;
}
const publicContent = (g) => `<div class="ill">${art(g)}</div>
  ${g.warnings ? `<div class="cw"><span class="over">Avertissements de contenu</span><p>${g.warnings}</p></div>` : ''}
  <p>${g.pitch ?? `Une partie de ${g.system}, de ${g.min} à ${g.max} joueurs. (Présentation fictive du prototype.)`}</p>`;

// C : la fiche de sa propre partie, vue par son MJ.
function ficheMj(g) {
  return `<section class="sheet" role="dialog" aria-modal="true" aria-label="${g.title}">${ficheHead(g)}
    <div class="scroll" data-sid="fiche-${g.id}"><div class="pad stack-l">
      <div class="stack"><span class="over">Tu mènes</span><h1 class="fiche-title">${g.title}</h1>
        <p class="meta num">${g.system} · ${slotName(g.slot, g.double)} · ${slotRange(g.slot, g.double)} · table ${g.table}</p></div>
      <section class="card mj-panel">${mjBody(g)}</section>
      <h2 class="over">Ce que voient les joueurs</h2>
      <div class="badges" style="align-items:center"><span class="meta num">${counter(g)}</span>${tresDemandee(g)}</div>
      ${publicContent(g)}
    </div></div></section>`;
}
function renderFiche() {
  const g = G(S.fiche);
  if (g.mine && S.variant === 'C') return ficheMj(g);
  const signed = S.signups.has(g.id);
  const can = canSignUp(g);
  const r = mine(g.slot);
  const mineHere = r.kind === 'assigned' && r.game.id === g.id ? badge('ok', 'circle-check', 'Tu joues à cette table') : g.mine ? badge('accent', 'book-open', 'Tu mènes cette partie') : '';
  let action;
  if (g.mine) action = `<button class="btn btn-secondary btn-block" data-act="mj" data-id="${g.id}">${icon('book-open')}${S.variant === 'A' ? 'Voir dans « Je mène »' : 'Voir dans « Mes parties »'}</button>`;
  else if (can.ok) action = signed
    ? `<p class="meta" style="display:flex;gap:6px;align-items:center">${icon('check', 'i tone-accent')}Ton inscription est enregistrée.</p><button class="btn btn-secondary btn-block" data-act="toggle" data-id="${g.id}">Se désinscrire</button>`
    : `<button class="btn btn-primary btn-block" data-act="toggle" data-id="${g.id}">S'inscrire</button>`;
  else action = `<p class="meta">${can.why}</p>`;
  return `<section class="sheet" role="dialog" aria-modal="true" aria-label="${g.title}">${ficheHead(g)}
    <div class="scroll" data-sid="fiche-${g.id}"><div class="pad stack-l">
      <div class="stack"><h1 class="fiche-title">${g.title}</h1>
        <p class="meta">${g.system} · avec ${g.mj}</p>
        <p class="meta num">${slotName(g.slot, g.double)} · ${slotRange(g.slot, g.double)} · table ${g.table}</p>
        <div class="badges" style="align-items:center"><span class="meta num">${counter(g)}</span>${tresDemandee(g)}${mineHere}</div></div>
      ${publicContent(g)}
    </div></div>
    <div class="sheet-actions">${action}</div></section>`;
}
const renderMenu = () => `<div class="scrim"></div><section class="menu" role="dialog" aria-label="Ton pseudo">
  <span class="over">Ton pseudo</span><strong class="block-title">Kaïros</strong>
  <p class="meta">Ce téléphone est relié au MJ Kaïros.</p>
  <button class="btn btn-secondary" data-act="change-pseudo">Changer de pseudo</button></section>`;
// NO-5 : application ouverte, une partie à mener ajoutée.
const renderAlert = () => `<div class="alert" role="alert"><div><strong>Créneau 3 : tu mènes une partie</strong><span>Le Masque de jade, table Basilic, 16 h 30 – 19 h 00. Tes inscriptions sur ce créneau sont retirées.</span></div>
  <button class="btn btn-ghost" data-act="alert-voir" data-id="k3">Voir</button><button class="icon-btn" data-act="alert-close" aria-label="Fermer l'alerte">${icon('x')}</button></div>`;

/* ================= Rendu ================= */
const app = document.getElementById('app');
function frTypography(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    n.nodeValue = n.nodeValue
      .replace(/« /g, '« ').replace(/ »/g, ' »')
      .replace(/ ([;!?])/g, ' $1').replace(/ :/g, ' :')
      .replace(/(\d) h (\d\d)/g, '$1 h $2').replace(/(\d) h\b/g, '$1 h')
      .replace(/ – /g, ' – ')
      .replace(/(\d) (?=[A-Za-zÀ-ÿ])/g, '$1 ');
  }
}
function render() {
  const saved = {};
  app.querySelectorAll('[data-sid]').forEach((el) => { saved[el.dataset.sid] = el.scrollTop; });
  const tabs = [['accueil', 'house', 'Accueil'], ['programme', 'calendar', 'Programme'], ['mes', 'dices', 'Mes parties']];
  if (S.variant === 'A') tabs.push(['mene', 'book-open', 'Je mène']);
  const body = { accueil, programme, mes: () => mesParties(S.variant === 'B'), mene: jeMene }[S.tab]();
  let html = `${header()}<div class="scroll" data-sid="${S.variant}-${S.tab}-${S.progSlot}">${body}</div>${tabbar(tabs, S.tab)}`;
  if (S.fiche) html += renderFiche();
  if (S.alert) html += renderAlert();
  if (S.menu) html += renderMenu();
  if (S.toast) html += `<div class="toast" role="status">${S.toast}</div>`;
  app.innerHTML = html;
  frTypography(app);
  app.querySelectorAll('[data-sid]').forEach((el) => { if (saved[el.dataset.sid] != null) el.scrollTop = saved[el.dataset.sid]; });
  if (S.target) {
    const el = app.querySelector('#' + S.target), sc = el?.closest('.scroll');
    if (el && sc) { sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 8; el.classList.add('flash'); }
    S.target = null;
  }
  document.getElementById('sb-time').textContent = fmt(clock()).replace(' h ', ':');
  document.getElementById('sw-label').textContent = `${S.variant} · ${VARIANTS[S.variant].name}`;
  document.getElementById('moment').value = String(S.moment);
  renderNotes();
}
function renderNotes() {
  const v = VARIANTS[S.variant];
  const notes = document.getElementById('notes');
  notes.innerHTML = `<h2>${S.variant} · ${v.name}</h2><p>${v.pitch}</p>
    <h3>Moment</h3><p class="clock">${fmt(clock())}</p><p>${M().note}</p>
    <h3>À regarder</h3><p>Où vit la vue du MJ, et ce qu'elle montre à chaque moment. Où mènent « Voir tes joueurs » sur l'Accueil, la ligne « Tu mènes » de Mes parties, le programme, et la notification (bouton « Ouvrir par une notification »).</p>
    <h3>Commun aux trois</h3><ul>
      <li>Avant la publication, le MJ voit le nombre d'inscrits, pas leurs pseudos. À la publication, les pseudos de ses joueurs.</li>
      <li>Pendant le tirage de son créneau, l'Accueil montre « Tirage en cours » avec la partie qu'il mène.</li>
      <li>Le programme marque les créneaux où il mène, et dit pourquoi il ne peut pas s'y inscrire (IN-4).</li></ul>
    <p style="color:#8f8a85">← → : variante · ↑ ↓ : moment.</p>`;
  frTypography(notes);
}

/* ---------- Navigation ---------- */
// La vue du MJ d'une partie, selon la variante.
function mjGo(id) {
  const g = G(id);
  S.menu = false;
  if (S.variant === 'A') { S.fiche = null; S.tab = 'mene'; S.target = `mj-${id}`; }
  else if (S.variant === 'B') { S.fiche = null; S.tab = 'mes'; S.target = `slot-${g.slot}`; }
  else S.fiche = id;
}
function toast(msg, ms = 2600) {
  S.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, ms);
}
// Ouverture à froid par la dernière notification propre au MJ (NO-2).
function openByNotification() {
  S.fiche = null; S.menu = false; S.tab = 'accueil'; S.progSlot = null;
  const f = focus();
  let title, body;
  if (M().alert) {
    S.alert = false; mjGo('k3');
    title = 'Créneau 3 : tu mènes une partie'; body = 'Le Masque de jade, table Basilic, 16 h 30 – 19 h 00. Tes inscriptions sur ce créneau sont retirées.';
  } else if (f.type === 'cancelled') {
    S.tab = 'programme'; S.progSlot = f.n;
    title = 'Créneau 2 : ta partie est annulée'; body = `La Tour d'ébène n'a pas atteint son minimum. Il reste de la place aux tables ${listFr(f.m.left.map((x) => x.table))} : va voir leur MJ.`;
  } else if (f.type === 'leads') {
    const g = f.m.game; mjGo(g.id);
    title = `Créneau ${g.slot} : tu mènes à la table ${g.table}`; body = `${g.title}, avec ${plural(lead(g).players.length, 'joueur')}.`;
  } else {
    const g = ledGames()[0]; mjGo(g.id);
    title = `Créneau ${g.slot} : tu mènes une partie`; body = `${g.title}, table ${g.table}, ${slotRange(g.slot)}.`;
  }
  toast(`<span class="over">Ouvert par la notification</span><strong>${title}</strong>${body}`, 4200);
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  const { act, id, n, v } = t.dataset;
  if (act !== 'menu') S.menu = false;
  switch (act) {
    case 'tab': S.tab = v; S.fiche = null; S.progSlot = null; break;
    case 'prog-slot': S.progSlot = Number(n); break;
    case 'goto-prog': S.fiche = null; S.tab = 'programme'; S.progSlot = Number(n) || null; break;
    case 'fiche': S.fiche = id; break;
    case 'back': S.fiche = null; break;
    case 'mj': mjGo(id); break;
    case 'menu': S.menu = !S.menu; break;
    case 'alert-voir': S.alert = false; mjGo(id); break;
    case 'alert-close': S.alert = false; break;
    case 'toggle': {
      if (!canSignUp(G(id)).ok) break;
      if (S.signups.has(id)) S.signups.delete(id); else S.signups.add(id);
      break;
    }
    case 'change-pseudo': return toast("<strong>Changer de pseudo</strong>Coupe le lien du téléphone et ramène à l'identification (ID-9). Hors du prototype.");
  }
  render();
});

/* ---------- Barre du prototype ---------- */
const momentSel = document.getElementById('moment');
momentSel.innerHTML = MOMENTS.map((m, i) => `<option value="${i}">${m.label}</option>`).join('');
function setVariant(k) {
  S.variant = k; S.fiche = null; S.menu = false; S.toast = null;
  if (S.tab === 'mene' && k !== 'A') S.tab = 'accueil';
  try { history.replaceState(null, '', '#variante-' + k.toLowerCase()); } catch { /* page intégrée */ }
  render();
}
const cycle = (dir) => setVariant(KEYS[(KEYS.indexOf(S.variant) + dir + KEYS.length) % KEYS.length]);
function setMoment(i) { S.moment = (i + MOMENTS.length) % MOMENTS.length; resetMoment(); render(); }
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('m-prev').onclick = () => setMoment(S.moment - 1);
document.getElementById('m-next').onclick = () => setMoment(S.moment + 1);
momentSel.onchange = (e) => setMoment(Number(e.target.value));
document.getElementById('notif').onclick = openByNotification;
const sw = document.getElementById('switcher');
if (matchMedia('(max-width: 520px)').matches) sw.classList.add('collapsed');
document.getElementById('sw-toggle').onclick = (e) => { const c = sw.classList.toggle('collapsed'); e.target.setAttribute('aria-expanded', String(!c)); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); setMoment(S.moment - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setMoment(S.moment + 1); }
  else if (e.key === 'Escape' && (S.fiche || S.menu)) { if (S.menu) S.menu = false; else S.fiche = null; render(); }
});

resetMoment();
render();
</script>
</html>
